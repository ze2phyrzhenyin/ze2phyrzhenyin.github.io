# Installed before publishing the static tutorial. Only this route is protected.
location = /guides/codex-java {
    return 308 /guides/codex-java/;
}
location = /guides/codex-java/access-key {
    include /etc/nginx/snippets/codex-java-auth.conf;
    alias /var/lib/siteweb-private/codex-java/key.json;
    types { }
    default_type application/json;
    access_log off;
    limit_except GET { deny all; }
}
location ^~ /guides/codex-java/ {
    include /etc/nginx/snippets/codex-java-auth.conf;
    root /var/www/siteweb/current;
    index index.html;
    autoindex off;
    charset utf-8;
    try_files $uri $uri/ =404;
    limit_except GET { deny all; }
}
