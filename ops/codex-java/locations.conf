location = /guides/codex-java { return 308 /guides/codex-java/; }
# The custom access-code screen and its assets contain no API key.
location = /guides/codex-java/signin { include /etc/nginx/snippets/codex-java-proxy.conf; }
location = /guides/codex-java/gate.css { include /etc/nginx/snippets/codex-java-proxy.conf; }
location = /guides/codex-java/gate.js { include /etc/nginx/snippets/codex-java-proxy.conf; }
location = /guides/codex-java/unlock { include /etc/nginx/snippets/codex-java-proxy.conf; }
location = /guides/codex-java/signout { include /etc/nginx/snippets/codex-java-proxy.conf; }
location = /_codex_java_session_check {
    internal;
    proxy_pass http://unix:/run/siteweb-codex-java-auth/auth.sock:/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization "";
    proxy_set_header Cookie $http_cookie;
    access_log off;
}
location = /guides/codex-java/access-key {
    include /etc/nginx/snippets/codex-java-auth.conf;
    alias /var/lib/siteweb-private/codex-java/key.json;
    types { }
    default_type application/json;
    access_log off;
    limit_except GET { deny all; }
}
location ^~ /guides/codex-java/ {
    include /etc/nginx/snippets/codex-java-auth.conf;
    error_page 401 = @codex_java_login;
    root /var/www/siteweb/current;
    index index.html;
    autoindex off;
    charset utf-8;
    try_files $uri $uri/ =404;
    limit_except GET { deny all; }
}

location @codex_java_login { return 303 /guides/codex-java/signin; }
