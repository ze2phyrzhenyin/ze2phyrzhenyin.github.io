# Shared protection for the page, every asset, and the private credential endpoint.
auth_basic "Codex Java (username: friend)";
auth_basic_user_file /etc/nginx/private/codex-java.htpasswd;
add_header Cache-Control "private, no-store, max-age=0" always;
add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
etag off;
if_modified_since off;
