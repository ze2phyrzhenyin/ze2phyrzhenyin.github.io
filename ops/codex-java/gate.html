<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#fafaf9"><meta name="robots" content="noindex, nofollow, noarchive">
<title>访问码 · Codex 教程</title>
<script src="/guides/codex-java/theme.js"></script><link rel="stylesheet" href="/guides/codex-java/gate.css"><script src="/guides/codex-java/gate.js" defer></script>
</head>
<body>
<header><span>Codex 教程</span><button type="button" data-theme-toggle>深色</button></header>
<main>
<form action="/guides/codex-java/unlock" method="post" id="gate-form">
<h1><label for="access-code">请输入访问码</label></h1>

<div class="input-wrap"><input id="access-code" name="code" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" required maxlength="128" aria-describedby="gate-message"><button type="button" id="toggle-code" aria-label="显示访问码" aria-pressed="false">显示</button></div>
<p id="gate-message" role="status" aria-live="polite">{{ERROR}}</p>
<button type="submit" class="submit"><span id="submit-text">进入</span></button>
</form>
</main>
</body>
</html>
