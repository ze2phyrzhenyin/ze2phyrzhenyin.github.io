<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#0c0d10"><meta name="robots" content="noindex, nofollow, noarchive">
<title>输入访问码 · Codex Java 入门</title>
<link rel="stylesheet" href="/guides/codex-java/gate.css"><script src="/guides/codex-java/gate.js" defer></script>
</head>
<body>
<header class="topbar"><span class="brand"><span class="mark" aria-hidden="true">&gt;_</span>Codex<span class="divider">/</span><span class="brand-note">Java 入门</span></span><span class="invite"><span aria-hidden="true"></span>朋友专属指南</span></header>
<main>
<section class="intro" aria-labelledby="intro-title">
<p class="eyebrow">从第一行命令，到第一次修复</p>
<h1 id="intro-title">你的代码难题，<br><span>从这里开始解决。</span></h1>
<p class="description">不熟悉命令行也没关系。<br>跟着五个简单步骤，让 Codex 陪你读懂、<br class="wide">分析并修复 Java 项目。</p>
<div class="journey" aria-label="教程包含"><span><b>01</b>安装</span><i aria-hidden="true"></i><span><b>02</b>连接</span><i aria-hidden="true"></i><span><b>03</b>开始修复</span></div>
</section>
<section class="card" aria-labelledby="gate-title">
<div class="lock" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2"/></svg></div>
<p class="card-eyebrow">欢迎，你来啦</p>
<h2 id="gate-title">一枚访问码，就能开始。</h2>
<p class="card-copy">输入朋友发给你的访问码，进入教程。</p>
<form action="/guides/codex-java/unlock" method="post" id="gate-form">
<label for="access-code">访问码</label>
<div class="input-wrap"><input id="access-code" name="code" type="password" autocomplete="current-password" autocapitalize="none" spellcheck="false" required maxlength="128" placeholder="粘贴你的访问码" aria-describedby="gate-message"><button type="button" id="toggle-code" aria-label="显示访问码" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
<p class="message" id="gate-message" role="status" aria-live="polite">{{ERROR}}</p>
<button type="submit" class="submit"><span id="submit-text">进入教程</span><span aria-hidden="true">→</span></button>
</form>
<p class="help">还没有访问码？向分享这个页面的朋友获取即可。</p>
<div class="card-footer"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m10 2 6 3v5c0 4-6 7-6 7s-6-3-6-7V5z"/><path d="m7 9 2 2 4-4"/></svg>仅供受邀朋友使用，请勿公开转发访问码。</div>
</section>
</main>
<footer><span>为第一次使用 Codex 的你而写。</span><span>一步一步，慢慢来。</span></footer>
</body>
</html>
