,lazy,filtermap,streamorder"],["p.2 · 终端操作、Collectors","terminal,optional,reduce,collectors,grouping,primitivefileparallel"]]},{"source":"C6","rows":[["pp.1–9 · 目标、JDK21、语言和类型","program,primitives,packages"],["pp.10–17 · 整除、工资switch、循环、完全数、大写字母","shortcircuit,switch,loops"],["pp.18–24 · 数组、多维、复制、遍历与生成","arraybasics,aliases,matrix,arraytools"],["pp.25–27 · 子程序、四种排序任务、Java API","signature,complexity"],["pp.28–30 · 递归、求和、Fibonacci、回文、是否有序、最大值","recursion"]]}],"coverage_note":"算法题的完整解答见“算法与实现”；同名Java类代码为根据课程要求编写的复习实现，不冒充老师未提供的TP答案。PGCD、Luhn、BFS、二分、异常/I/O深化与部分API属于扩展，单独标识。原始7份文件不在下载包中再分发；网站保留文件名与页码定位。","files":[{"name":"Modeles.java","content":"import java.util.*;\n\n/** Exemples de classes complets ; classes imbriquees pour compiler un seul fichier. */\npublic final class Modeles {\n    private Modeles() { }\n\n    // BEGIN pairtuple\n    public static final class Paire<T> {\n        private T first, second;\n        public Paire(T first, T second) { this.first=first; this.second=second; }\n        public T getFirst() { return first; }\n        public T getSecond() { return second; }\n        public void setFirst(T value) { first=value; }\n        public void setSecond(T value) { second=value; }\n    }\n    public static final class Tuple<T,U> {\n        private final T first;\n        private final U second;\n        public Tuple(T first, U second) { this.first=first; this.second=second; }\n        public T getFirst() { return first; }\n        public U getSecond() { return second; }\n    }\n    // END pairtuple\n\n    // BEGIN singly\n    /** Valeurs null admises ; suppression a vide => NoSuchElementException. */\n    public static final class ListeChainee<T> {\n        private static final class Element<E> {\n            final E valeur;\n            Element<E> suivant;\n            Element(E valeur) { this.valeur=valeur; }\n        }\n        private Element<T> tete, queue;\n        private int taille;\n        public boolean isEmpty() { return tete==null; }\n        public int size() { return taille; }\n        public void addLast(T valeur) {\n            Element<T> e=new Element<>(valeur);\n            if (isEmpty()) tete=e;\n            else queue.suivant=e;\n            queue=e;\n            taille++;\n        }\n        public void addFirst(T valeur) {\n            Element<T> e=new Element<>(valeur);\n            e.suivant=tete;\n            tete=e;\n            if (queue==null) queue=e;\n            taille++;\n        }\n        public T removeFirst() {\n            if (isEmpty()) throw new NoSuchElementException(\"liste vide\");\n            T valeur=tete.valeur;\n            tete=tete.suivant;\n            if (tete==null) queue=null;\n            taille--;\n            return valeur;\n        }\n        public boolean contains(T valeur) {\n            for (Element<T> e=tete;e!=null;e=e.suivant)\n                if (Objects.equals(e.valeur,valeur)) return true;\n            return false;\n        }\n        @Override public String toString() {\n            StringJoiner j=new StringJoiner(\",\",\"{\",\"}\");\n            for (Element<T> e=tete;e!=null;e=e.suivant)\n                j.add(String.valueOf(e.valeur));\n            return j.toString();\n        }\n    }\n    // END singly\n\n    // BEGIN doubly\n    public static final class ListeDouble<T> {\n        private static final class Noeud<E> {\n            final E valeur;\n            Noeud<E> precedent, suivant;\n            Noeud(E valeur) { this.valeur=valeur; }\n        }\n        private Noeud<T> tete, queue;\n        private int taille;\n        public int size() { return taille; }\n        public boolean isEmpty() { return taille==0; }\n        public void addLast(T valeur) {\n            Noeud<T> e=new Noeud<>(valeur);\n            e.precedent=queue;\n            if (queue==null) tete=e;\n            else queue.suivant=e;\n            queue=e;\n            taille++;\n        }\n        public void addFirst(T valeur) {\n            Noeud<T> e=new Noeud<>(valeur);\n            e.suivant=tete;\n            if (tete==null) queue=e;\n            else tete.precedent=e;\n            tete=e;\n            taille++;\n        }\n        public T removeFirst() {\n            if (isEmpty()) throw new NoSuchElementException(\"liste vide\");\n            T v=tete.valeur;\n            tete=tete.suivant;\n            if (tete==null) queue=null;\n            else tete.precedent=null;\n            taille--;\n            return v;\n        }\n        public T removeLast() {\n            if (isEmpty()) throw new NoSuchElementException(\"liste vide\");\n            T v=queue.valeur;\n            queue=queue.precedent;\n            if (queue==null) tete=null;\n            else queue.suivant=null;\n            taille--;\n            return v;\n        }\n        @Override public String toString() {\n            StringJoiner j=new StringJoiner(\",\",\"{\",\"}\");\n            for (Noeud<T> e=tete;e!=null;e=e.suivant)\n                j.add(String.valueOf(e.valeur));\n            return j.toString();\n        }\n    }\n    // END doubly\n\n    // BEGIN studentmodel\n    public static final class Etudiant {\n        private String nom, prenom, email;\n        private int age;\n        private final double[] notes;\n        public Etudiant(String nom, String prenom, int age, String email, double[] notes) {\n            setNom(nom); setPrenom(prenom); setAge(age); setEmail(email);\n            Objects.requireNonNull(notes,\"notes\");\n            this.notes=Arrays.copyOf(notes,notes.length);\n            for (double n:this.notes) verifierNote(n);\n        }\n        private static void verifierNote(double n) {\n            if (!Double.isFinite(n) || n<0 || n>20)\n                throw new IllegalArgumentException(\"note hors [0,20]\");\n        }\n        public String getNom() { return nom; }\n        public String getPrenom() { return prenom; }\n        public int getAge() { return age; }\n        public String getEmail() { return email; }\n        public double[] getNotes() { return Arrays.copyOf(notes,notes.length); }\n        public void setNom(String v) { nom=Objects.requireNonNull(v); }\n        public void setPrenom(String v) { prenom=Objects.requireNonNull(v); }\n        public void setAge(int v) {\n            if (v<0) throw new IllegalArgumentException(\"age < 0\");\n            age=v;\n        }\n        /** Seulement non null ; pas de validation complete d'adresse email. */\n        public void setEmail(String v) { email=Objects.requireNonNull(v); }\n        public void setNote(int index,double n) {\n            Objects.checkIndex(index,notes.length);\n            verifierNote(n);\n            notes[index]=n;\n        }\n        public OptionalDouble moyenne() {\n            return Arrays.stream(notes).average();\n        }\n        @Override public String toString() {\n            return prenom+\" \"+nom+\" \"+Arrays.toString(notes);\n        }\n    }\n    // END studentmodel\n\n    // BEGIN polynomialmodel\n    /** Coefficients finis ; c[i] = coefficient de x^i ; egalite exacte normalisee. */\n    public static final class Polynome {\n        private final double[] coefficients;\n        public Polynome(double... valeurs) {\n            Objects.requireNonNull(valeurs,\"coefficients\");\n            double[] c=Arrays.copyOf(valeurs,Math.max(1,valeurs.length));\n            for (int i=0;i<c.length;i++) {\n                if (!Double.isFinite(c[i])) throw new IllegalArgumentException(\"non fini\");\n                if (c[i]==0.0) c[i]=0.0; // -0.0 => +0.0\n            }\n            int n=c.length;\n            while (n>1 && c[n-1]==0.0) n--;\n            coefficients=Arrays.copyOf(c,n);\n        }\n        public double[] getCoefficients() { return coefficients.clone(); }\n        public double evaluer(double x) {\n            return RevisionAlgorithms.horner(coefficients,x);\n        }\n        @Override public boolean equals(Object o) {\n            if (this==o) return true;\n            if (!(o instanceof Polynome p)) return false;\n            return Arrays.equals(coefficients,p.coefficients);\n        }\n        @Override public int hashCode() { return Arrays.hashCode(coefficients); }\n        @Override public String toString() { return Arrays.toString(coefficients); }\n    }\n    // END polynomialmodel\n\n    // BEGIN inheritanceexample\n    public interface Mesurable { double aire(); }\n    public abstract static class Forme implements Mesurable {\n        private final String nom;\n        protected Forme(String nom) { this.nom=Objects.requireNonNull(nom); }\n        public final String getNom() { return nom; }\n        @Override public String toString() { return nom+\"=\"+aire(); }\n    }\n    public static final class Carre extends Forme {\n        private final double cote;\n        public Carre(double cote) {\n            super(\"Carre\");\n            if (!Double.isFinite(cote) || cote<0) throw new IllegalArgumentException(\"cote\");\n            this.cote=cote;\n        }\n        @Override public double aire() { return cote*cote; }\n    }\n    // END inheritanceexample\n}\n"},{"name":"RevisionAlgorithms.java","content":"import java.util.*;\nimport java.util.function.*;\n\n/** Java 21, sans dépendances. Algorithmes pédagogiques ; contrats explicites. */\npublic final class RevisionAlgorithms {\n    private RevisionAlgorithms() { }\n\n    // BEGIN divisor\n    public static boolean estDiviseur(int nb, int diviseur) {\n        return diviseur != 0 && nb % diviseur == 0;\n    }\n    // END divisor\n\n    // BEGIN salary\n    /** Retour en kEUR ; grade inconnu / anciennete invalide => 0. */\n    public static double calculSalaire(String grade, int anciennete) {\n        if (grade == null) return 0;\n        return switch (grade) {\n            case \"Concepteur\" -> switch (anciennete) {\n                case 1 -> 15; case 2 -> 17; case 3 -> 19; default -> 0;\n            };\n            case \"Ingénieur\" -> switch (anciennete) {\n                case 1 -> 23; case 2 -> 25; case 3 -> 27; default -> 0;\n            };\n            case \"Développeur\" -> switch (anciennete) {\n                case 1 -> 35; case 2 -> 40; case 3 -> 45; default -> 0;\n            };\n            default -> 0;\n        };\n    }\n    // END salary\n\n    // BEGIN perfect\n    public static boolean estParfait(int n) {\n        if (n <= 1) return false;\n        long somme = 1; // somme des diviseurs propres positifs\n        for (int d = 2; d <= n / d; d++) { // evite d*d qui deborde\n            if (n % d == 0) {\n                somme += d;\n                int autre = n / d;\n                if (autre != d) somme += autre; // carre parfait : pas deux fois\n            }\n        }\n        return somme == n;\n    }\n    public static List<Integer> parfaits(int min, int max) {\n        if (min > max) throw new IllegalArgumentException(\"min > max\");\n        List<Integer> resultat = new ArrayList<>();\n        for (long n = Math.max(2, min); n <= max; n++) {\n            if (estParfait((int)n)) resultat.add((int)n);\n        }\n        return resultat;\n    }\n    // END perfect\n\n    // BEGIN uppercase\n    public static boolean uneMajusculeAscii(String s) {\n        Objects.requireNonNull(s, \"s\");\n        int i = 0;\n        while (i < s.length() && (s.charAt(i) < 'A' || s.charAt(i) > 'Z')) i++;\n        return i < s.length();\n    }\n    public static boolean uneMajusculeUnicode(String s) {\n        Objects.requireNonNull(s, \"s\");\n        return s.codePoints().anyMatch(Character::isUpperCase);\n    }\n    // END uppercase\n\n    // BEGIN randomarray\n    /** Bornes inclusives ; Random fourni pour rendre les tests reproductibles. */\n    public static int[] tableauAleatoire(int taille, int min, int max, Random random) {\n        Objects.requireNonNull(random, \"random\");\n        if (taille < 0 || min > max) throw new IllegalArgumentException(\"bornes\");\n        int[] a = new int[taille];\n        long amplitude = (long) max - min + 1;\n        for (int i = 0; i < a.length; i++) {\n            a[i] = (int) ((long) min + random.nextLong(amplitude));\n        }\n        return a;\n    }\n    // END randomarray\n\n    // BEGIN describe\n    public static String decrire(int[] a) {\n        Objects.requireNonNull(a, \"a\");\n        StringBuilder b = new StringBuilder(\"[\");\n        for (int i = 0; i < a.length; i++) {\n            if (i > 0) b.append(\", \");\n            b.append(a[i]);\n        }\n        return b.append(']').toString();\n    }\n    // END describe\n\n    // BEGIN sums\n    public static long sommeI(int n) {\n        if (n < 0) throw new IllegalArgumentException(\"n < 0\");\n        long s = 0;\n        for (long i = 1; i <= n; i++) s += i;\n        return s;\n    }\n    /** Pour de petits n : une grande profondeur peut epuiser la pile. */\n    public static long sommeR(int n) {\n        if (n < 0) throw new IllegalArgumentException(\"n < 0\");\n        if (n == 0) return 0;\n        return n + sommeR(n - 1);\n    }\n    public static long sommeFormule(int n) {\n        if (n < 0) throw new IllegalArgumentException(\"n < 0\");\n        return (long) n * (n + 1L) / 2;\n    }\n    // END sums\n\n    // BEGIN fibonacci\n    /** Version naive volontairement limitee a 35 (cout exponentiel). */\n    public static long fibonacciR(int n) {\n        if (n < 0 || n > 35) throw new IllegalArgumentException(\"0 <= n <= 35\");\n        return fibRec(n);\n    }\n    private static long fibRec(int n) {\n        if (n < 2) return n;\n        return fibRec(n - 1) + fibRec(n - 2);\n    }\n    /** F(0)=0, F(1)=1 ; long represente jusqu'a F(92). */\n    public static long fibonacciI(int n) {\n        if (n < 0 || n > 92) throw new IllegalArgumentException(\"0 <= n <= 92\");\n        if (n == 0) return 0;\n        long precedent = 0, courant = 1;\n        for (int i = 2; i <= n; i++) {\n            long suivant = precedent + courant;\n            precedent = courant;\n            courant = suivant;\n        }\n        return courant;\n    }\n    // END fibonacci\n\n    // BEGIN palindrome\n    /** Comparaison exacte des unites UTF-16 ; pas de normalisation. */\n    public static boolean palindrome(String s) {\n        Objects.requireNonNull(s, \"s\");\n        return palindrome(s, 0, s.length() - 1);\n    }\n    private static boolean palindrome(String s, int g, int d) {\n        if (g >= d) return true;\n        return s.charAt(g) == s.charAt(d) && palindrome(s, g + 1, d - 1);\n    }\n    // END palindrome\n\n    // BEGIN sortedrecursive\n    /** Croissant au sens large : les valeurs egales sont acceptees. */\n    public static boolean estTrie(int[] a) {\n        Objects.requireNonNull(a, \"a\");\n        return estTrie(a, 0);\n    }\n    private static boolean estTrie(int[] a, int i) {\n        if (i >= a.length - 1) return true;\n        return a[i] <= a[i + 1] && estTrie(a, i + 1);\n    }\n    // END sortedrecursive\n\n    // BEGIN maxrecursive\n    public static int maximumR(int[] a) {\n        Objects.requireNonNull(a, \"a\");\n        if (a.length == 0) throw new IllegalArgumentException(\"tableau vide\");\n        return maximumR(a, a.length - 1);\n    }\n    private static int maximumR(int[] a, int i) {\n        if (i == 0) return a[0];\n        return Math.max(a[i], maximumR(a, i - 1));\n    }\n    // END maxrecursive\n\n    // BEGIN linearsearch\n    /** Premier indice ou -1 ; le tableau n'a pas besoin d'etre trie. */\n    public static int rechercheLineaire(int[] a, int cible) {\n        Objects.requireNonNull(a, \"a\");\n        for (int i = 0; i < a.length; i++) {\n            if (a[i] == cible) return i;\n        }\n        return -1;\n    }\n    // END linearsearch\n\n    // BEGIN binarysearch\n    /** Precondition : a trie en ordre croissant. Un indice quelconque ou -1. */\n    public static int rechercheDichotomique(int[] a, int cible) {\n        Objects.requireNonNull(a, \"a\");\n        int gauche = 0, droite = a.length - 1;\n        while (gauche <= droite) {\n            int milieu = gauche + (droite - gauche) / 2;\n            if (a[milieu] == cible) return milieu;\n            if (a[milieu] < cible) gauche = milieu + 1;\n            else droite = milieu - 1;\n        }\n        return -1;\n    }\n    // END binarysearch\n\n    // BEGIN bubble\n    public static void triBulle(int[] a) {\n        Objects.requireNonNull(a, \"a\");\n        for (int fin = a.length - 1; fin > 0; fin--) {\n            boolean echange = false;\n            for (int i = 0; i < fin; i++) {\n                if (a[i] > a[i + 1]) {\n                    int tmp = a[i]; a[i] = a[i + 1]; a[i + 1] = tmp;\n                    echange = true;\n                }\n            }\n            if (!echange) return;\n        }\n    }\n    // END bubble\n\n    // BEGIN selection\n    public static void triSelection(int[] a) {\n        Objects.requireNonNull(a, \"a\");\n        for (int i = 0; i < a.length - 1; i++) {\n            int min = i;\n            for (int j = i + 1; j < a.length; j++) {\n                if (a[j] < a[min]) min = j;\n            }\n            int tmp = a[i]; a[i] = a[min]; a[min] = tmp;\n        }\n    }\n    // END selection\n\n    // BEGIN insertion\n    public static void triInsertion(int[] a) {\n        Objects.requireNonNull(a, \"a\");\n        for (int i = 1; i < a.length; i++) {\n            int valeur = a[i], j = i - 1;\n            while (j >= 0 && a[j] > valeur) {\n                a[j + 1] = a[j];\n                j--;\n            }\n            a[j + 1] = valeur;\n        }\n    }\n    // END insertion\n\n    // BEGIN merge\n    public static void triFusion(int[] a) {\n        Objects.requireNonNull(a, \"a\");\n        int[] aide = new int[a.length];\n        trier(a, aide, 0, a.length); // intervalles [g,d)\n    }\n    private static void trier(int[] a, int[] aide, int g, int d) {\n        if (d - g < 2) return;\n        int m = g + (d - g) / 2;\n        trier(a, aide, g, m);\n        trier(a, aide, m, d);\n        int i = g, j = m, k = g;\n        while (i < m && j < d) {\n            aide[k++] = a[i] <= a[j] ? a[i++] : a[j++];\n        }\n        while (i < m) aide[k++] = a[i++];\n        while (j < d) aide[k++] = a[j++];\n        System.arraycopy(aide, g, a, g, d - g);\n    }\n    // END merge\n\n    // BEGIN gcd\n    /** PGCD >= 0 ; convention pgcd(0,0)=0, valeurs int completes admises. */\n    public static long pgcd(int a, int b) {\n        long x = Math.abs((long) a), y = Math.abs((long) b);\n        while (y != 0) {\n            long reste = x % y;\n            x = y;\n            y = reste;\n        }\n        return x;\n    }\n    // END gcd\n\n    // BEGIN luhn\n    /** Chiffres ASCII seulement ; chaine vide invalide ; checksum, pas validation commerciale. */\n    public static boolean luhn(String s) {\n        Objects.requireNonNull(s, \"s\");\n        if (s.isEmpty()) return false;\n        int sommeModulo = 0;\n        boolean doubler = false;\n        for (int i = s.length() - 1; i >= 0; i--) {\n            char c = s.charAt(i);\n            if (c < '0' || c > '9') return false;\n            int n = c - '0';\n            if (doubler) {\n                n *= 2;\n                if (n > 9) n -= 9;\n            }\n            sommeModulo = (sommeModulo + n) % 10;\n            doubler = !doubler;\n        }\n        return sommeModulo == 0;\n    }\n    // END luhn\n\n    // BEGIN bfs\n    /** Grille rectangulaire : 0 libre, autre valeur bloquee ; quatre voisins. */\n    public static int distanceBfs(int[][] grille, int sr, int sc, int tr, int tc) {\n        Objects.requireNonNull(grille, \"grille\");\n        if (grille.length == 0 || grille[0] == null || grille[0].length == 0)\n            throw new IllegalArgumentException(\"grille vide\");\n        int lignes = grille.length, colonnes = grille[0].length;\n        for (int[] ligne : grille)\n            if (ligne == null || ligne.length != colonnes)\n                throw new IllegalArgumentException(\"grille non rectangulaire\");\n        if (sr<0 || sr>=lignes || sc<0 || sc>=colonnes ||\n            tr<0 || tr>=lignes || tc<0 || tc>=colonnes)\n            throw new IllegalArgumentException(\"coordonnees\");\n        if (grille[sr][sc]!=0 || grille[tr][tc]!=0) return -1;\n        int[][] distances = new int[lignes][colonnes];\n        for (int[] ligne : distances) Arrays.fill(ligne, -1);\n        Deque<int[]> file = new ArrayDeque<>();\n        file.offerLast(new int[]{sr,sc});\n        distances[sr][sc] = 0; // marquer a l'entree dans la file\n        int[] dr={1,-1,0,0}, dc={0,0,1,-1};\n        while (!file.isEmpty()) {\n            int[] p = file.pollFirst();\n            int r=p[0], c=p[1];\n            if (r==tr && c==tc) return distances[r][c];\n            for (int k=0;k<4;k++) {\n                int nr=r+dr[k], nc=c+dc[k];\n                if (nr>=0 && nr<lignes && nc>=0 && nc<colonnes &&\n                    grille[nr][nc]==0 && distances[nr][nc]==-1) {\n                    distances[nr][nc]=distances[r][c]+1;\n                    file.offerLast(new int[]{nr,nc});\n                }\n            }\n        }\n        return -1;\n    }\n    // END bfs\n\n    // BEGIN horner\n    /** coefficients[i] correspond a x^i ; tableau vide represente 0 ici. */\n    public static double horner(double[] coefficients, double x) {\n        Objects.requireNonNull(coefficients, \"coefficients\");\n        double resultat = 0;\n        for (int i = coefficients.length - 1; i >= 0; i--)\n            resultat = resultat * x + coefficients[i];\n        return resultat;\n    }\n    // END horner\n\n    // BEGIN frequency\n    /** Ordre de premiere apparition preserve ; mots non null. */\n    public static Map<String,Integer> frequences(List<String> mots) {\n        Objects.requireNonNull(mots, \"mots\");\n        Map<String,Integer> resultat = new LinkedHashMap<>();\n        for (String mot : mots) {\n            Objects.requireNonNull(mot, \"mot\");\n            resultat.merge(mot, 1, Integer::sum);\n        }\n        return resultat;\n    }\n    // END frequency\n\n    // BEGIN genericfunctional\n    public static <T> List<T> filterList(List<T> source, Predicate<? super T> filtre) {\n        Objects.requireNonNull(source); Objects.requireNonNull(filtre);\n        List<T> resultat = new ArrayList<>();\n        for (T x : source) if (filtre.test(x)) resultat.add(x);\n        return resultat;\n    }\n    public static <T,R> List<R> mapList(List<T> source, Function<? super T,? extends R> f) {\n        Objects.requireNonNull(source); Objects.requireNonNull(f);\n        List<R> resultat = new ArrayList<>();\n        for (T x : source) resultat.add(f.apply(x));\n        return resultat;\n    }\n    public static <T> T reduceList(List<T> source, T initial, BinaryOperator<T> op) {\n        Objects.requireNonNull(source); Objects.requireNonNull(op);\n        T resultat = initial;\n        for (T x : source) resultat = op.apply(resultat, x);\n        return resultat;\n    }\n    // END genericfunctional\n\n    // BEGIN benchmark\n    /** Petit banc pedagogique ; pas un benchmark de production. */\n    public static void comparerTris(int[] original) {\n        Objects.requireNonNull(original);\n        String[] noms={\"bulle\",\"selection\",\"insertion\",\"fusion\"};\n        List<Consumer<int[]>> tris=List.of(\n            RevisionAlgorithms::triBulle, RevisionAlgorithms::triSelection,\n            RevisionAlgorithms::triInsertion, RevisionAlgorithms::triFusion);\n        int[] attendu=original.clone(); Arrays.sort(attendu);\n        for (int i=0;i<tris.size();i++) {\n            int[] copie=original.clone(); // copie en dehors de la mesure\n            long debut=System.nanoTime();\n            tris.get(i).accept(copie);\n            long duree=System.nanoTime()-debut;\n            if (!Arrays.equals(copie,attendu)) throw new AssertionError(noms[i]);\n            System.out.printf(\"%s : %d ns%n\",noms[i],duree);\n        }\n    }\n    // END benchmark\n}\n"},{"name":"TestRevision.java","content":"import java.util.*;\nimport java.util.function.*;\nimport java.util.stream.*;\n\n/** Tests autonomes : lancer avec Java 21. Pas de bibliotheque de test externe. */\npublic final class TestRevision {\n    private static int checks=0;\n    private TestRevision() { }\n    private static void check(boolean ok,String label) {\n        checks++;\n        if (!ok) throw new AssertionError(label);\n    }\n    private static void eq(Object actual,Object expected,String label) {\n        check(Objects.equals(actual,expected),label+\": actual=\"+actual+\", expected=\"+expected);\n    }\n    private static void expect(Class<? extends Throwable> type,Runnable r,String label) {\n        checks++;\n        try { r.run(); } catch (Throwable t) {\n            if (type.isInstance(t)) return;\n            throw new AssertionError(label+\": wrong exception \"+t,t);\n        }\n        throw new AssertionError(label+\": missing exception \"+type.getSimpleName());\n    }\n    public static void main(String[] args) {\n        check(RevisionAlgorithms.estDiviseur(12,3),\"divisor\");\n        check(!RevisionAlgorithms.estDiviseur(12,0),\"zero divisor\");\n        check(RevisionAlgorithms.estDiviseur(0,-2),\"zero dividend\");\n        check(RevisionAlgorithms.estDiviseur(Integer.MIN_VALUE,-1),\"min remainder\");\n        String[] grades={\"Concepteur\",\"Ingénieur\",\"Développeur\"};\n        int[][] salaries={{15,17,19},{23,25,27},{35,40,45}};\n        for(int i=0;i<3;i++) for(int j=0;j<3;j++)\n            eq(RevisionAlgorithms.calculSalaire(grades[i],j+1),(double)salaries[i][j],\"salary\");\n        eq(RevisionAlgorithms.calculSalaire(null,1),0.0,\"salary null\");\n        eq(RevisionAlgorithms.calculSalaire(\"bad\",2),0.0,\"salary unknown\");\n        eq(RevisionAlgorithms.calculSalaire(\"Concepteur\",4),0.0,\"salary range\");\n        for(int n=0;n<1000;n++) {\n            int sum=0;\n            for(int d=1;d<n;d++) if(n%d==0) sum+=d;\n            check(RevisionAlgorithms.estParfait(n)==(n>0 && sum==n),\"perfect \"+n);\n        }\n        check(RevisionAlgorithms.estParfait(8128),\"perfect 8128\");\n        check(!RevisionAlgorithms.estParfait(-6),\"perfect negative\");\n        eq(RevisionAlgorithms.parfaits(-5,500),List.of(6,28,496),\"perfect range\");\n        expect(IllegalArgumentException.class,()->RevisionAlgorithms.parfaits(5,4),\"bad range\");\n        check(!RevisionAlgorithms.uneMajusculeAscii(\"\"),\"uppercase empty\");\n        check(RevisionAlgorithms.uneMajusculeAscii(\"abZ\"),\"uppercase end\");\n        check(!RevisionAlgorithms.uneMajusculeAscii(\"Été\"),\"ASCII only\");\n        check(RevisionAlgorithms.uneMajusculeUnicode(\"Été\"),\"unicode uppercase\");\n        expect(NullPointerException.class,()->RevisionAlgorithms.uneMajusculeAscii(null),\"uppercase null\");\n        int[] random=RevisionAlgorithms.tableauAleatoire(300,-9,9,new Random(5));\n        for(int x:random) check(x>=-9 && x<=9,\"random interval\");\n        check(Arrays.equals(random,RevisionAlgorithms.tableauAleatoire(300,-9,9,new Random(5))),\"repeatable random\");\n        eq(RevisionAlgorithms.tableauAleatoire(0,0,0,new Random(1)).length,0,\"random empty\");\n        int[] fullRange=RevisionAlgorithms.tableauAleatoire(100,Integer.MIN_VALUE,Integer.MAX_VALUE,new Random(1));\n        eq(fullRange.length,100,\"full range accepted\");\n        check(Arrays.stream(fullRange).anyMatch(x->x<0) && Arrays.stream(fullRange).anyMatch(x->x>=0),\"full range covers both signs for fixed seed\");\n        expect(IllegalArgumentException.class,()->RevisionAlgorithms.tableauAleatoire(-1,0,1,new Random()),\"negative size\");\n        expect(IllegalArgumentException.class,()->RevisionAlgorithms.tableauAleatoire(1,2,1,new Random()),\"reversed bounds\");\n        eq(RevisionAlgorithms.decrire(new int[]{}),\"[]\",\"describe empty\");\n        eq(RevisionAlgorithms.decrire(new int[]{-1,2}),\"[-1, 2]\",\"describe\");\n        for(int n=0;n<=100;n++) {\n            long expected=(long)n*(n+1)/2;\n            eq(RevisionAlgorithms.sommeI(n),expected,\"sum iterative\");\n            eq(RevisionAlgorithms.sommeR(n),expected,\"sum recursive\");\n            eq(RevisionAlgorithms.sommeFormule(n),expected,\"sum formula\");\n        }\n        eq(RevisionAlgorithms.sommeFormule(Integer.MAX_VALUE),2305843008139952128L,\"sum int max\");\n        expect(IllegalArgumentException.class,()->RevisionAlgorithms.sommeR(-1),\"sum negative\");\n        for(int n=0;n<22;n++) eq(RevisionAlgorithms.fibonacciR(n),RevisionAlgorithms.fibonacciI(n),\"fib parity \"+n);\n        eq(RevisionAlgorithms.fibonacciI(92),7540113804746346429L,\"fib 92\");\n        expect(IllegalArgumentException.class,()->RevisionAlgorithms.fibonacciI(93),\"fib overflow prevented\");\n        expect(IllegalArgumentException.class,()->RevisionAlgorithms.fibonacciR(36),\"fib costly input prevented\");\n        for(String s:List.of(\"\",\"x\",\"aba\",\"abba\",\"été\")) check(RevisionAlgorithms.palindrome(s),\"palindrome \"+s);\n        check(!RevisionAlgorithms.palindrome(\"Abba\"),\"case-sensitive palindrome\");\n        check(RevisionAlgorithms.estTrie(new int[]{}),\"sorted empty\");\n        check(RevisionAlgorithms.estTrie(new int[]{-3,-3,0}),\"sorted duplicate\");\n        check(!RevisionAlgorithms.estTrie(new int[]{1,0}),\"unsorted\");\n        eq(RevisionAlgorithms.maximumR(new int[]{-7,-2,-5}),-2,\"maximum all negative\");\n        expect(IllegalArgumentException.class,()->RevisionAlgorithms.maximumR(new int[]{}),\"maximum empty\");\n        eq(RevisionAlgorithms.rechercheLineaire(new int[]{2,1,2},2),0,\"first match\");\n        eq(RevisionAlgorithms.rechercheLineaire(new int[]{},1),-1,\"search empty\");\n        List<Consumer<int[]>> sorts=List.of(RevisionAlgorithms::triBulle,RevisionAlgorithms::triSelection,RevisionAlgorithms::triInsertion,RevisionAlgorithms::triFusion);\n        Random rng=new Random(87);\n        for(int trial=0;trial<150;trial++) {\n            int[] a=new int[trial%61];\n            for(int i=0;i<a.length;i++) a[i]=rng.nextInt(101)-50;\n            if(a.length>1) { a[0]=Integer.MIN_VALUE; a[1]=Integer.MAX_VALUE; }\n            int[] sorted=a.clone(); Arrays.sort(sorted);\n            for(Consumer<int[]> sort:sorts) {\n                int[] copy=a.clone(); sort.accept(copy);\n                check(Arrays.equals(copy,sorted),\"sort \"+trial);\n            }\n            for(int value=-52;value<=52;value+=13) {\n                int index=RevisionAlgorithms.rechercheDichotomique(sorted,value);\n                int oracle=Arrays.binarySearch(sorted,value);\n                check(index<0 ? oracle<0 : index<sorted.length && sorted[index]==value,\"binary search\");\n            }\n        }\n        for(Consumer<int[]> sort:sorts) expect(NullPointerException.class,()->sort.accept(null),\"sort null\");\n        eq(RevisionAlgorithms.pgcd(-54,24),6L,\"gcd signs\");\n        eq(RevisionAlgorithms.pgcd(0,0),0L,\"gcd zeros\");\n        eq(RevisionAlgorithms.pgcd(Integer.MIN_VALUE,0),2147483648L,\"gcd min\");\n        check(RevisionAlgorithms.luhn(\"79927398713\"),\"luhn valid\");\n        check(!RevisionAlgorithms.luhn(\"79927398714\"),\"luhn invalid\");\n        check(!RevisionAlgorithms.luhn(\"\"),\"luhn empty\");\n        check(!RevisionAlgorithms.luhn(\"12x\"),\"luhn non-digit\");\n        check(!RevisionAlgorithms.luhn(\"１２\"),\"luhn non-ASCII\");\n        int[][] grid={{0,1,0},{0,0,0},{1,1,0}};\n        eq(RevisionAlgorithms.distanceBfs(grid,0,0,2,2),4,\"bfs detour\");\n        eq(RevisionAlgorithms.distanceBfs(grid,0,0,0,0),0,\"bfs same\");\n        eq(RevisionAlgorithms.distanceBfs(grid,0,0,0,1),-1,\"bfs blocked\");\n        eq(RevisionAlgorithms.distanceBfs(new int[][]{{0,1,0}},0,0,0,2),-1,\"bfs unreachable\");\n        expect(IllegalArgumentException.class,()->RevisionAlgorithms.distanceBfs(new int[][]{{0},{0,1}},0,0,0,0),\"bfs ragged\");\n        eq(RevisionAlgorithms.horner(new double[]{1,2,3},2),17.0,\"horner\");\n        eq(RevisionAlgorithms.horner(new double[]{},4),0.0,\"horner empty\");\n        var frequencies=RevisionAlgorithms.frequences(List.of(\"b\",\"a\",\"b\"));\n        eq(frequencies,Map.of(\"b\",2,\"a\",1),\"frequency values\");\n        eq(new ArrayList<>(frequencies.keySet()),List.of(\"b\",\"a\"),\"frequency order\");\n        eq(RevisionAlgorithms.filterList(List.of(1,2,3),x->x>1),List.of(2,3),\"generic filter\");\n        eq(RevisionAlgorithms.mapList(List.of(\"a\",\"bb\"),String::length),List.of(1,2),\"generic map\");\n        eq(RevisionAlgorithms.reduceList(List.of(1,2,3),0,Integer::sum),6,\"generic reduce\");\n        eq(RevisionAlgorithms.reduceList(List.<Integer>of(),0,Integer::sum),0,\"generic reduce empty\");\n        var pair=new Modeles.Paire<>(1,2); pair.setFirst(3); pair.setSecond(4);\n        eq(pair.getFirst(),3,\"pair first\"); eq(pair.getSecond(),4,\"pair second\");\n        var tuple=new Modeles.Tuple<>(\"x\",pair); eq(tuple.getSecond().getFirst(),3,\"nested generics\");\n        var linked=new Modeles.ListeChainee<Integer>();\n        eq(linked.toString(),\"{}\",\"linked empty string\");\n        expect(NoSuchElementException.class,linked::removeFirst,\"linked empty removal\");\n        linked.addLast(1); linked.addFirst(null); linked.addLast(2);\n        eq(linked.toString(),\"{null,1,2}\",\"linked null and order\");\n        check(linked.contains(null),\"linked contains null\");\n        eq(linked.removeFirst(),null,\"linked remove null\");\n        eq(linked.removeFirst(),1,\"linked remove first\");\n        eq(linked.removeFirst(),2,\"linked remove last\");\n        eq(linked.size(),0,\"linked empty size\");\n        linked.addLast(9); eq(linked.removeFirst(),9,\"linked reuse empty\");\n        var doubleList=new Modeles.ListeDouble<Integer>();\n        var oracle=new LinkedList<Integer>();\n        for(int n=0;n<600;n++) {\n            int op=rng.nextInt(4);\n            if(op==0) { doubleList.addFirst(n); oracle.addFirst(n); }\n            else if(op==1) { doubleList.addLast(n); oracle.addLast(n); }\n            else if(!oracle.isEmpty() && op==2) eq(doubleList.removeFirst(),oracle.removeFirst(),\"double first\");\n            else if(!oracle.isEmpty()) eq(doubleList.removeLast(),oracle.removeLast(),\"double last\");\n            eq(doubleList.size(),oracle.size(),\"double size\");\n            eq(doubleList.toString(),\"{\"+oracle.stream().map(String::valueOf).collect(Collectors.joining(\",\"))+\"}\",\"double order\");\n        }\n        while(!oracle.isEmpty()) eq(doubleList.removeFirst(),oracle.removeFirst(),\"double drain\");\n        expect(NoSuchElementException.class,doubleList::removeLast,\"double empty remove\");\n        doubleList.addFirst(null); eq(doubleList.removeLast(),null,\"double null\");\n        double[] notes={10,20};\n        var student=new Modeles.Etudiant(\"Nom\",\"Prenom\",20,\"x@y\",notes);\n        notes[0]=0; eq(student.getNotes()[0],10.0,\"student input copy\");\n        double[] exposed=student.getNotes(); exposed[0]=0;\n        eq(student.getNotes()[0],10.0,\"student output copy\");\n        eq(student.moyenne().orElseThrow(),15.0,\"student mean\");\n        student.setNote(0,12); eq(student.moyenne().orElseThrow(),16.0,\"student set note\");\n        expect(IllegalArgumentException.class,()->student.setNote(0,Double.NaN),\"student nan\");\n        expect(IndexOutOfBoundsException.class,()->student.setNote(2,10),\"student index\");\n        check(new Modeles.Etudiant(\"a\",\"b\",0,\"\",new double[]{}).moyenne().isEmpty(),\"student empty mean\");\n        var p1=new Modeles.Polynome(1,2); var p2=new Modeles.Polynome(1,2,0,-0.0);\n        check(p1.equals(p2) && p2.equals(p1),\"polynomial normalized equality\");\n        eq(p1.hashCode(),p2.hashCode(),\"polynomial hash\");\n        check(new Modeles.Polynome().equals(new Modeles.Polynome(-0.0,0)) ,\"polynomial zero\");\n        check(!p1.equals(null) && !p1.equals(\"x\"),\"polynomial type\");\n        eq(p1.evaluer(3),7.0,\"polynomial eval\");\n        p1.getCoefficients()[0]=100; eq(p1.evaluer(3),7.0,\"polynomial defensive\");\n        eq(new HashSet<>(List.of(p1,p2)).size(),1,\"polynomial hash set\");\n        expect(IllegalArgumentException.class,()->new Modeles.Polynome(Double.POSITIVE_INFINITY),\"polynomial infinity\");\n        Modeles.Forme shape=new Modeles.Carre(3); eq(shape.aire(),9.0,\"polymorphism\");\n        eq(shape.getNom(),\"Carre\",\"inherited method\");\n        expect(IllegalArgumentException.class,()->new Modeles.Carre(-1),\"shape validation\");\n        Function<Integer,Integer> f=x->x+1,g=x->x*2;\n        eq(f.andThen(g).apply(3),8,\"andThen\"); eq(f.compose(g).apply(3),7,\"compose\");\n        check(Stream.<Integer>empty().allMatch(x->x>0),\"allMatch empty\");\n        check(!Stream.<Integer>empty().anyMatch(x->x>0),\"anyMatch empty\");\n        eq(Stream.of(1,2,3,4).filter(x->x%2==0).map(x->x*10).toList(),List.of(20,40),\"stream pipeline\");\n        expect(UnsupportedOperationException.class,()->Stream.of(1,2).toList().add(3),\"stream immutable\");\n        expect(IllegalStateException.class,()->Stream.of(\"a\",\"b\").collect(Collectors.toMap(String::length,x->x)),\"toMap duplicate\");\n        var once=Stream.of(1,2,3); eq(once.count(),3L,\"count\");\n        expect(IllegalStateException.class,once::count,\"stream reuse\");\n        eq(\"a12b\".replaceAll(\"\\\\d+\",\"#\"),\"a#b\",\"regex escaping\");\n        RevisionAlgorithms.comparerTris(new int[]{3,1,2,0});\n        System.out.println(\"PASS: \"+checks+\" checks; Java \"+System.getProperty(\"java.version\"));\n        System.out.println(\"Scope: full example files and selected language/API cases. Not a proof or exhaustive verification of every teaching fragment.\");\n    }\n}\n"},{"name":"TEST_REPORT.txt","content":"bulle : 5471 ns\nselection : 7081 ns\ninsertion : 3942 ns\nfusion : 11768 ns\nPASS: 5208 checks; Java 21.0.11\nScope: <script>/* Offline study application. No network requests, tracking, or third-party code. */
(() => {

const mobileNavigation=matchMedia('(max-width:760px)');
function setMenu(open,restoreFocus=true){
  open=!!open&&mobileNavigation.matches;

  document.body.classList.toggle('menu-open',open);
  button.setAttribute('aria-expanded',String(open));
  button.setAttribute('aria-label',open?'关闭导航':'打开导航');
  sidebar.inert=mobileNavigation.matches&&!open;
  $('.workspace').inert=open;
  if(open){sidebar.setAttribute('role','dialog');sidebar.setAttribute('aria-modal','true');$('.close-menu').focus();}
  else{sidebar.removeAttribute('role');sidebar.removeAttribute('aria-modal');if(restoreFocus&&hadFocus)button.focus();}
}
mobileNavigation.addEventListener('change',()=>setMenu(false));
setMenu(false);
document.addEventListener('keydown',e=>{
  if(!document.body.classList.contains('menu-open'))return;

  if(e.key==='Tab'){
    const focusable=$$('a[href],button:not([disabled])',$('#sidebar')).filter(el=>el.getClientRects().length);
    const first=focusable[0],last=focusable[focusable.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}

  }
});
document.addEventListener('click',e=>{
  if(document.body.classList.contains('menu-open')&&e.target.closest('#sidebar a'))setMenu(false,false);

const itemKeys=new Set([...D.lessons.map(x=>'lesson:'+x.id),...D.algorithms.map(x=>'algo:'+x.id)]);
const checkKeys=new Set(D.checklists.flatMap((c,i)=>c.items.map((_,j)=>i+':'+j)));

function dict(raw,allowed,map=v=>!!v){const out={};if(raw&&typeof raw==='object'&&!Array.isArray(raw))for(const [k,v] of Object.entries(raw))if(allowed.has(k))out[k]=map(v);return out;}
function cleanAnswer(q,v){if(!v||typeof v!=='object')return{};return{choice:Array.isArray(v.choice)?v.choice.filter(n=>Number.isInteger(n)&&n>=0&&n<(q.options?.length||0)):[],value:typeof v.value==='string'?v.value.slice(0,1000):'',draft:typeof v.draft==='string'?v.draft.slice(0,100000):'',done:!!v.done,ok:!!v.ok,reveal:!!v.reveal,attempts:Number.isInteger(v.attempts)?Math.max(0,Math.min(v.attempts,1000000)):0,time:typeof v.time==='string'?v.time.slice(0,40):''};}
function cleanState(raw){const s=init();if(!raw||typeof raw!=='object')return s;s.theme=raw.theme==='dark'?'dark':'light';s.large=!!raw.large;s.frOnly=!!raw.frOnly;
 s.learned=dict(raw.learned,itemKeys);s.bookmarks=dict(raw.bookmarks,itemKeys);s.notes=dict(raw.notes,itemKeys,v=>typeof v==='string'?v.slice(0,100000):'');
 s.known=dict(raw.known,new Set(vm.keys()));s.checks=dict(raw.checks,checkKeys);s.selfChecks=dict(raw.selfChecks,selfKeys);s.selfDone=dict(raw.selfDone,new Set(D.questions.filter(q=>q.kind==='write').map(q=>q.id)));
 s.wrong=dict(raw.wrong,new Set(qm.keys()));
 if(raw.answers&&typeof raw.answers==='object')for(const [id,v]of Object.entries(raw.answers))if(qm.has(id)){const q=qm.get(id),a=cleanAnswer(q,v);if(a.done&&q.kind!=='write')a.ok=correct(q,a);s.answers[id]=a;}
 s.history=Array.isArray(raw.history)?raw.history.filter(h=>h&&Number.isFinite(h.score)&&Number.isFinite(h.total)&&h.total>0&&h.score>=0&&h.score<=h.total).slice(-100).map(h=>({date:String(h.date||'').slice(0,40),score:h.score,total:h.total})):[];
 if(raw.last&&itemKeys.has(raw.last))s.last=raw.last;
 const m=raw.mock;if(m&&Array.isArray(m.ids)&&m.ids.length>0&&m.ids.length<=30&&new Set(m.ids).size===m.ids.length&&m.ids.every(id=>qm.has(id)&&qm.get(id).kind!=='write')&&Number.isFinite(m.end)&&m.end>=0){s.mock={ids:m.ids,end:m.end,submitted:!!m.submitted,answers:{},started:typeof m.started==='string'?m.started:''};for(const id of m.ids)s.mock.answers[id]=cleanAnswer(qm.get(id),m.answers?.[id]);}
 return s;}

function code(text,label='Java 21 · 教学片段'){if(!text)return'';const re=/\/\/[^\n]*|\/\*[\s\S]*?\*\/|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|\b(?:public|private|protected|static|final|abstract|class|interface|extends|implements|new|return|if|else|for|while|do|switch|case|default|break|continue|yield|throw|throws|try|catch|finally|instanceof|var|void|int|long|float|double|boolean|byte|short|char|true|false|null|this|super|package|import|enum)\b|\b\d+(?:\.\d+)?[LlFfDd]?\b/g;let out='',pos=0;for(const m of text.matchAll(re)){out+=esc(text.slice(pos,m.index));const s=m[0],type=s.startsWith('/')?'comment':s[0]==='"'||s[0]==="'"?'string':/^\d/.test(s)?'number':'keyword';out+=`<span class="tok-${type}">${esc(s)}</span>`;pos=m.index+s.length;}out+=esc(text.slice(pos));return`<div class="codebox"><div class="code-head"><span>${esc(label)}</span><button type="button" data-act="copy-code">复制代码</button></div><pre><code>${out}</code></pre></div>`;}

function algo(id){const a=am.get(id);if(!a)return missing();S.last='algo:'+id;save();const idx=D.algorithms.indexOf(a),qs=D.questions.filter(q=>q.algorithm===id);return crumbs([['算法与实现','#algorithms'],[a.title]])+`<div class="reader-layout"><article class="article"><header class="article-head"><div class="row-meta">${levels(a)}<span class="muted small">${esc(a.file)}</span></div><h1>${esc(a.title)}</h1><div class="fr" lang="fr">${esc(a.fr)}</div></header><div class="callout french"><span class="label">ÉNONCÉ / 题目要求</span><p lang="fr">${esc(a.prompt)}</p></div><h2>实现思路</h2><div class="prose numbered">${a.steps.map(t=>`<p>${esc(t)}</p>`).join('')}</div><div class="two-col"><div class="panel"><div class="eyebrow">COMPLEXITÉ TEMPORELLE</div><h3>${esc(a.time)}</h3><p class="muted small">时间复杂度</p></div><div class="panel"><div class="eyebrow">ESPACE AUXILIAIRE</div><h3>${esc(a.space)}</h3><p class="muted small">额外空间复杂度</p></div></div><div class="callout trap"><span class="label">CONTRAT / 前置条件与边界</span><p>${esc(a.edge)}</p></div><div class="section-title"><h2>参考实现</h2><button class="btn small" data-act="download-file" data-id="${esc(a.file)}">完整源文件 ↓</button></div>${code(a.code,a.file+' · 完整实现摘录')}<div class="notice">${a.file==='Modeles.java'?'下面的类型在完整文件中是 Modeles 的嵌套类型，调用示例：new Modeles.Etudiant(...)。如仅复制当前代码，要补上 java.util 等导入并保持合法的类体上下文。':'静态方法属于 RevisionAlgorithms 类；调用时写 RevisionAlgorithms.方法名(...)。完整文件包含所需导入、私有辅助方法及关联方法。'}</div><h2>测试与结果</h2><div class="table-wrap"><table><thead><tr><th>输入 / 情况</th><th>期望结果</th></tr></thead><tbody>${a.cases.map(([x,y])=>`<tr><td>${esc(x)}</td><td>${esc(y)}</td></tr>`).join('')}</tbody></table></div>${sources(a.src)}${qs.length?`<div class="section-title"><h2>独立手写一遍</h2></div>${qs.map(questionRow).join('')}`:''}${notes('algo:'+id)}<div class="prev-next">${idx>0?`<a href="#algo/${D.algorithms[idx-1].id}">← ${esc(D.algorithms[idx-1].title)}</a>`:'<span></span>'}${idx<D.algorithms.length-1?`<a href="#algo/${D.algorithms[idx+1].id}">${esc(D.algorithms[idx+1].title)} →</a>`:''}</div></article><aside class="reader-aside"><div class="panel"><h4>本题学习</h4>${learnButton('algo:'+id)}${bookmarkButton('algo:'+id)}<a class="btn" href="#algorithms">返回全部算法</a></div><div class="panel aside-reading" style="margin-top:15px"><h4>运行完整测试</h4><p class="small muted">把三个 .java 文件放在同一目录。使用 JDK 21，执行：</p><pre class="small" style="white-space:pre-wrap;line-height:1.9;margin-top:10px">javac -encoding UTF-8 *.java\njava TestRevision</pre><p class="small muted">网站本身不运行 Java；测试文件可在本机编译运行。</p></div></aside></div>`;}

function records(){const learnedCount=countLearned(),bookmarks=Object.keys(S.bookmarks).filter(k=>S.bookmarks[k]),noted=Object.keys(S.notes).filter(k=>S.notes[k]?.trim()),aq=D.questions.filter(q=>q.kind!=='write'&&S.answers[q.id]?.done);return head('ESPACE PERSONNEL / STOCKAGE LOCAL','我的学习记录','掌握状态、收藏、笔记、题目草稿、错题和模拟成绩都保存在当前浏览器。本页可导出JSON备份，或导入到另一台设备的同一份网站。')+`<div class="actions"><button class="btn primary" data-act="export">导出全部学习记录 ↓</button><button class="btn" data-act="import">导入记录</button><button class="btn danger" data-act="reset">清空本地记录</button></div><div class="notice warn">离线HTML在不同浏览器、不同路径下可能使用不同的本地存储空间；隐私模式和清除浏览数据也可能丢失记录。移动文件或换设备前，请先导出。没有云同步，不会把笔记上传到服务器。</div><div class="stats">${statCard(learnedCount+'/'+D.lessons.length,'知识已掌握','NOTIONS')}${statCard(bookmarks.length,'收藏条目','FAVORIS')}${statCard(noted.length,'个人笔记','NOTES')}${statCard(aq.length,'已答客观题','RÉPONSES')}</div><div class="section-title"><h2>我的收藏</h2></div>${bookmarks.length?`<div class="compact-list">${bookmarks.map(k=>{const x=itemFor(k);return`<a class="list-row" href="#${k.replace(':','/')}"><span class="row-index">☆</span><div class="row-content"><h3>${esc(x.title)}</h3><p>${k.startsWith('lesson:')?'知识手册':'算法与实现'} · ${esc(x.fr)}</p></div><span class="row-arrow">→</span></a>`;}).join('')}</div>`:empty('尚无收藏。在知识或算法页面点击“收藏本节”。')}<div class="section-title"><h2>个人笔记</h2></div>${noted.length?noted.map(k=>`<div class="panel" style="margin:12px 0"><a href="#${k.replace(':','/')}"><h3>${esc(itemFor(k).title)} ↗</h3></a><p class="note-preview">${esc(S.notes[k])}</p></div>`).join(''):empty('在知识或算法详情页底部记录笔记。')}<div class="section-title"><h2>模拟练习历史</h2></div>${S.history.length?`<div class="table-wrap"><table><thead><tr><th>时间</th><th>分数</th><th>正确率</th></tr></thead><tbody>${[...S.history].reverse().map(h=>`<tr><td>${esc(new Date(h.date).toLocaleString('zh-CN'))}</td><td>${h.score} / ${h.total}</td><td>${Math.round(h.score/h.total*100)}%</td></tr>`).join('')}</tbody></table></div>`:empty('完成一套模拟练习后，成绩会记录在这里。')}<div class="section-title"><h2>掌握状态按章节</h2></div><div class="chapter-grid">${D.chapters.map(chapterCard).join('')}</div>`;}
function sourcePage(){return head('PÉRIMÈTRE / SOURCES / TRAÇABILITÉ','资料覆盖与核对来源','七份提供的课程文件是主线，Java21语言规范和官方API用于校正边界与补充常用方法。网站不依赖联网加载；仅打开官方文档链接时需要网络。')+`<div class="stats">${statCard(7,'课程文件','SUPPORTS')}${statCard(50,'原始资料页','PAGES')}${statCard(11,'知识章节','CHAPITRES')}${statCard(18,'精度修正','RECTIFICATIONS')}</div><div class="notice">${esc(D.coverage_note)}</div><div class="actions"><button class="btn" data-act="print-all">打印完整资料</button>${D.files.map(f=>`<button class="btn small" data-act="download-file" data-id="${f.name}">${esc(f.name)} ↓</button>`).join('')}</div><div class="section-title"><h2>逐文件覆盖</h2><span class="muted">核心标签表示主题出现在课件中</span></div>${D.coverage.map(c=>{const s=sm.get(c.source);return`<section class="source-card" id="source-${c.source}"><div class="row-meta"><span class="pill">${c.source}</span><span class="muted small">课程文件</span></div><h3>${esc(s.title)}</h3><p class="filedetail">${esc(s.detail)}</p>${c.rows.map(([t,ls])=>`<div class="coverage-row"><div>${esc(t)}</div><div class="coverage-links">${ls.split(',').map(id=>`<a href="#lesson/${id}">${esc(lm.get(id).title)} ↗</a>`).join('')}</div>`).join('')}</section>`;}).join('')}<div class="section-title"><h2>规范与官方 API</h2><span class="muted">Java 21 固定版本</span></div><div class="source-official">${D.sources.filter(s=>s.url).map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.title)} ↗</a>`).join('')}</div><div class="section-title"><h2>使用与验证边界</h2></div><div class="panel"><p>${esc(D.meta.validation)}</p><p>${esc(D.meta.fragment_note)}</p><p>练习中的错误示例是有意设置，不能把所有题目代码一并作为成功编译的源文件。题库答案依据指定上下文作答；手写答案由学习者根据边界、自查点与参考实现核对。</p><p>此前无法取得全文的零散对话、未提供的TP原题及图示，不宣称逐字覆盖。完整性以这里列出的七份文件可读取内容、章节映射和明确标出的补充内容为边界。</p></div>`;}
function empty(t){return`<div class="empty">${esc(t)}</div>`;}
function missing(){return head('PAGE INTROUVABLE','该条目不存在','可返回目录或使用全站搜索定位知识点。')+`<a class="btn" href="#home">返回首页</a>`;}
function render(){const [r,id]=route();renderNav();let html;switch(r){case'home':html=home();break;case'learn':html=learn();break;case'chapter':html=chapter(id);break;case'lesson':html=lesson(id);break;case'algorithms':html=algorithms();break;case'algo':html=algo(id);break;case'api':html=api(id);break;case'vocabulary':html=vocabulary();break;case'cards':html=flash();break;case'practice':html=practice();break;case'wrong':html=practice(true);break;case'question':html=question(id);break;case'mock':html=mock();break;case'errors':html=errors();break;case'checklist':html=checklist();break;case'records':html=records();break;case'sources':html=sourcePage();break;default:html=missing();}$('#main').innerHTML=html;if(r==='algorithms')drawAlgorithms();if(r==='api'&&!id)drawApis();if(r==='vocabulary')drawVocab();if(r==='practice'||r==='wrong')drawPractice();updateProgress();tick();document.title=($('#main h1')?.textContent||'Java')+' · Java中法复习';if(id&&r==='sources')setTimeout(()=>$('#source-'+CSS.escape(id))?.scrollIntoView({block:'start'}),0);if(id&&r==='errors')setTimeout(()=>$('#error-'+CSS.escape(id))?.scrollIntoView({block:'start'}),0);if(id&&r==='vocabulary')setTimeout(()=>$('#vocab-'+CSS.escape(id))?.scrollIntoView({block:'center'}),0);}
function refresh(){const y=scrollY;render();window.scrollTo(0,y);}
/* Unified accent-insensitive search index, built once from the offline content. */
const searchItems=[];
function addSearch(type,id,title,sub,text,url){searchItems.push({type,id,title,sub,text,url,nTitle:norm(title+' '+sub),nText:norm(text)});}
D.lessons.forEach(l=>addSearch('lesson',l.id,l.title,l.fr,l.summary+' '+l.body.join(' ')+' '+l.code+' '+l.pitfall+' '+l.exam,'#lesson/'+l.id));
D.algorithms.forEach(a=>addSearch('algo',a.id,a.title,a.fr,a.prompt+' '+a.steps.join(' ')+' '+a.edge+' '+a.code,'#algo/'+a.id));
D.apis.forEach(a=>addSearch('api',a.id,a.group+' · '+a.title,a.fr,a.signature+' '+a.meaning+' '+a.example+' '+a.trap,'#api/'+a.id));
D.vocabulary.forEach(v=>addSearch('vocab',v.id,v.fr,v.zh,v.usage+' '+v.group,'#vocabulary/'+v.id));
D.questions.forEach(q=>addSearch('question',q.id,q.id.toUpperCase()+' · '+q.title,q.fr,q.code+' '+lm.get(q.lesson).title,'#question/'+q.id));
D.corrections.forEach(e=>addSearch('error',e.id,e.new,e.where,e.old+' '+e.new,'#errors/'+e.id));
const typeNames={lesson:'知识',algo:'算法',api:'API',vocab:'法语',question:'练习',error:'勘误'};
function mark(text,term){if(!term)return esc(text);const n=norm(text),at=n.indexOf(term);if(at<0)return esc(text);return esc(text.slice(0,at))+'<mark>'+esc(text.slice(at,at+term.length))+'</mark>'+esc(text.slice(at+term.length));}
function doSearch(){const input=$('#globalSearch').value,terms=norm(input).trim().split(/\s+/).filter(Boolean),type=$('#globalType').value;if(!terms.length){$('#searchResults').innerHTML=`<p class="muted small">${searchItems.length} 条内容均可检索。建议：equals、généricité、泛型数组、au moins、链表。</p>`;return;}const matches=searchItems.filter(x=>(!type||x.type===type)&&terms.every(t=>x.nTitle.includes(t)||x.nText.includes(t))).map(x=>({...x,score:terms.reduce((n,t)=>n+(x.nTitle.includes(t)?4:1),0)})).sort((a,b)=>b.score-a.score);$('#searchResults').innerHTML=`<p class="result-count">找到 ${matches.length} 条${matches.length>50?' · 先显示前50条，请增加关键词缩小范围':''}</p>`+matches.slice(0,50).map(x=>{let start=x.nText.indexOf(terms[0]);start=Math.max(0,start-35);const snippet=x.text.slice(start,start+160);return`<a class="search-result" href="${x.url}" data-search-link="true"><span class="pill neutral">${typeNames[x.type]}</span><h3>${mark(x.title,terms[0])}</h3><p>${mark(x.sub,terms[0])}</p><p>${start?'…':''}${mark(snippet,terms[0])}${start+160<x.text.length?'…':''}</p></a>`;}).join('')+(matches.length?'':empty('没有匹配结果。尝试更短的关键词，或切换“全部内容”。'));}
function openSearch(){setMenu(false);const d=$('#searchDialog');if(!d.open)d.showModal();doSearch();$('#globalSearch').focus();}
/* All personal content is escaped before insertion. Only local, whitelisted records are imported. */
function updateChoice(el){const id=el.dataset.option,q=qm.get(id),mode=el.dataset.mode,store=mode==='mock'?S.mock.answers:S.answers;const a=store[id]||(store[id]={});if((mode==='mock'&&S.mock.submitted)||(mode!=='mock'&&a.done))return;const box=el.closest('.question-box');a.choice=$$('input[data-option]:checked',box).map(i=>Number(i.value));$$('.option',box).forEach(l=>l.classList.toggle('checked',!!$('input',l)?.checked));save();tick();}
function filterChanged(el){const [group,key]=el.dataset.filter.split(':');U[group][key]=el.type==='checkbox'?el.checked:el.value;if(group==='algo')drawAlgorithms();if(group==='api')drawApis();if(group==='vocab')drawVocab();if(group==='practice')drawPractice();if(group==='flash'){syncFlash();refresh();}}
document.addEventListener('input',e=>{const el=e.target;if(el.id==='globalSearch')doSearch();if(el.dataset.filter&&el.type!=='checkbox'&&el.tagName!=='SELECT')filterChanged(el);if(el.dataset.note){S.notes[el.dataset.note]=el.value;save();}if(el.dataset.write){const a=S.answers[el.dataset.write]||(S.answers[el.dataset.write]={});a.draft=el.value;save();}if(el.dataset.blank){const store=el.dataset.mode==='mock'?S.mock.answers:S.answers;const a=store[el.dataset.blank]||(store[el.dataset.blank]={});a.value=el.value;save();tick();}});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='globalType')doSearch();if(el.dataset.filter&&(el.type==='checkbox'||el.tagName==='SELECT'))filterChanged(el);if(el.dataset.option)updateChoice(el);if(el.dataset.check){S.checks[el.dataset.check]=el.checked;el.closest('label').classList.toggle('checked',el.checked);save();}if(el.dataset.selfCheck){S.selfChecks[el.dataset.selfCheck]=el.checked;save();}if(el.dataset.actChange==='fr-only'){S.frOnly=el.checked;save();$$('.question-box').forEach(b=>b.classList.toggle('question-fr-only',S.frOnly));$$('[data-act-change="fr-only"]').forEach(i=>i.checked=S.frOnly);}});
document.addEventListener('click',async e=>{const link=e.target.closest('[data-search-link]');if(link){$('#searchDialog').close();if(link.hash.startsWith('#vocabulary/')){U.vocab.term='';U.vocab.group='';}}const b=e.target.closest('[data-act]');if(!b)return;const act=b.dataset.act,id=b.dataset.id;switch(act){
case'menu':setMenu(!document.body.classList.contains('menu-open'));break;
case'search':openSearch();break;
case'close-search':$('#searchDialog').close();break;
case'theme':S.theme=S.theme==='dark'?'light':'dark';appearance();save();break;
case'font':S.large=!S.large;appearance();save();toast(S.large?'已切换较大正文字号':'已恢复标准正文字号');break;
case'copy-code':{const text=$('pre code',b.closest('.codebox')).textContent;try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.append(t);t.select();if(!document.execCommand('copy'))throw Error('copy');t.remove();}toast('已复制代码');}catch(err){toast('当前浏览器不允许自动复制，请选中代码手动复制。');}break;}
case'learned':if(itemKeys.has(id)){S.learned[id]=!S.learned[id];save();refresh();toast(S.learned[id]?'已标记掌握；可随时取消。':'已取消掌握标记。');}break;
case'bookmark':if(itemKeys.has(id)){S.bookmarks[id]=!S.bookmarks[id];save();refresh();toast(S.bookmarks[id]?'已加入收藏':'已取消收藏');}break;
case'download-file':{const f=D.files.find(x=>x.name===id);if(f)download(f.name,f.content);break;}
case'known':S.known[id]=!S.known[id];save();if($('#vocabResults'))drawVocab();break;
case'flash-flip':U.flash.reveal=!U.flash.reveal;refresh();break;
case'flash-next':if(U.flash.ids.length)U.flash.index=(U.flash.index+1)%U.flash.ids.length;U.flash.reveal=false;refresh();break;
case'flash-prev':if(U.flash.ids.length)U.flash.index=(U.flash.index-1+U.flash.ids.length)%U.flash.ids.length;U.flash.reveal=false;refresh();break;
case'flash-known':S.known[id]=!S.known[id];save();if(U.flash.unknown)syncFlash();refresh();break;
case'flash-reverse':U.flash.reverse=!U.flash.reverse;U.flash.reveal=false;refresh();break;
case'flash-shuffle':U.flash.ids=shuffle(U.flash.ids);U.flash.index=0;U.flash.reveal=false;refresh();break;
case'grade':{const q=qm.get(id),a=S.answers[id]||(S.answers[id]={});if(!attemptedAnswer(q,a)){toast('请先填写或选择答案。');break;}a.done=true;a.ok=correct(q,a);a.attempts=(a.attempts||0)+1;a.time=new Date().toISOString();if(a.ok)delete S.wrong[id];else S.wrong[id]=true;save();refresh();break;}
case'retry':{const prev=S.answers[id]||{};S.answers[id]={attempts:prev.attempts||0};save();refresh();break;}
case'remove-wrong':delete S.wrong[id];save();refresh();toast('已从待复习错题中移出。');break;
case'reveal-write':{const a=S.answers[id]||(S.answers[id]={});a.reveal=!a.reveal;save();refresh();break;}
case'self-done':S.selfDone[id]=!S.selfDone[id];save();refresh();toast('已保存自查状态；这不是自动代码判分。');break;
case'start-mock':startMock();break;
case'submit-mock':submitMock();break;
case'jump-q':$('#question-'+CSS.escape(id))?.scrollIntoView({block:'start',behavior:'smooth'});break;
case'export':download('Java学习记录_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({format:'miage-java-review',version:1,exportedAt:new Date().toISOString(),state:S},null,2),'application/json;charset=utf-8');toast('学习记录已导出。');break;
case'import':$('#importFile').click();break;
case'reset':if(confirm('确定清空本网站在当前浏览器的全部学习进度、笔记、草稿与成绩吗？建议先导出备份。')){S=init();save();appearance();refresh();toast('本地学习记录已清空。');}break;
case'print':printCurrent();break;
case'print-all':printFull();break;
}});
$('#importFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>10*1024*1024)throw Error('文件超过10MB');const obj=JSON.parse(await file.text());if(obj.format!=='miage-java-review'||obj.version!==1||!obj.state)throw Error('不是本网站支持的记录格式');if(confirm('导入会替换当前浏览器的学习记录。继续吗？')){S=cleanState(obj.state);save();appearance();refresh();toast('学习记录已导入。');}}catch(err){toast('导入失败：'+err.message);}e.target.value='';});
let printDetails=[];
function printCurrent(){printDetails=$$('details').filter(d=>!d.open);printDetails.forEach(d=>d.open=true);window.print();}
function printFull(){if(!confirm('将准备包含全部知识、算法、API、词汇、练习答案和勘误的长篇打印资料，页数较多。继续吗？'))return;const parts=[];parts.push(`<div class="print-cover"><div class="eyebrow">M1 MIAGE · JAVA 21</div><h1>Java 中法复习手册</h1><p>知识 · 算法 · 标准库 · 法语词汇 · 练习与勘误</p><p>2026-10-07 · 七份课程文件 · 自编复习资料</p><p>${esc(D.meta.scope)}</p><p>${esc(D.meta.validation)}</p></div>`);for(const c of D.chapters){parts.push(`<h1 class="print-chapter">${esc(c.zh)} / ${esc(c.fr)}</h1>`);for(const l of D.lessons.filter(l=>l.chapter===c.id))parts.push(`<section class="print-lesson"><h2>${esc(l.title)}</h2><p lang="fr">${esc(l.fr)}</p><p><b>${esc(l.summary)}</b></p><div class="prose">${l.body.map(p=>`<p>${esc(p)}</p>`).join('')}</div>${code(l.code)}<p><b>易错：</b>${esc(l.pitfall)}</p><p lang="fr"><b>Examen :</b> ${esc(l.exam)}</p>${sources(l.src)}</section>`);}parts.push('<h1 class="print-chapter">算法与完整实现</h1>');for(const a of D.algorithms)parts.push(`<section class="print-lesson"><h2>${esc(a.title)} / ${esc(a.fr)}</h2><p lang="fr">${esc(a.prompt)}</p>${a.steps.map(t=>`<p>${esc(t)}</p>`).join('')}<p>时间：${esc(a.time)}；额外空间：${esc(a.space)}</p><p>边界：${esc(a.edge)}</p>${code(a.code,a.file)}<table>${a.cases.map(([x,y])=>`<tr><td>${esc(x)}</td><td>${esc(y)}</td></tr>`).join('')}</table>${sources(a.src)}</section>`);parts.push('<h1 class="print-chapter">标准库与 API 速查</h1>');for(const a of D.apis)parts.push(`<section class="print-lesson"><h2>${esc(a.group+' · '+a.title)}</h2>${apiBody(a)}</section>`);parts.push(`<h1 class="print-chapter">法语词汇</h1><table><thead><tr><th>法语</th><th>中文与提醒</th></tr></thead><tbody>${D.vocabulary.map(vocabRow).join('')}</tbody></table><h1 class="print-chapter">练习、答案与自查</h1>`);for(const q of D.questions)parts.push(`<section class="print-lesson"><h2>${q.id.toUpperCase()} · ${esc(q.title)}</h2><p lang="fr">${esc(q.fr)}</p>${code(q.code)}${q.options?q.options.map((x,i)=>`<p>${String.fromCharCode(65+i)}. ${esc(x)}</p>`).join(''):''}${q.kind==='write'?`<p>${q.criteria.map(esc).join('；')}</p>${code(q.solution)}`:`<p><b>答案：</b>${esc(answerText(q))}</p>`}<p>${esc(q.explanation)}</p></section>`);parts.push('<h1 class="print-chapter">勘误与来源</h1>');for(const e of D.corrections)parts.push(`<h3>${esc(e.where)}</h3><p>原表述：${esc(e.old)}</p><p>精确理解：${esc(e.new)}</p>${sources(e.src)}`);parts.push(`<p>${esc(D.coverage_note)}</p>${D.sources.map(s=>`<p><b>${s.id} · ${esc(s.title)}</b><br>${esc(s.detail)}${s.url?'<br>'+esc(s.url):''}</p>`).join('')}`);$('#printAll').innerHTML=parts.join('');document.body.classList.add('printing-all');setTimeout(()=>window.print(),100);}
window.addEventListener('afterprint',()=>{document.body.classList.remove('printing-all');$('#printAll').innerHTML='';printDetails.forEach(d=>d.open=false);printDetails=[];});
document.addEventListener('keydown',e=>{const inInput=['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)||e.target.isContentEditable;if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch();return;}if(e.key==='/'&&!inInput&&!$('#searchDialog').open){e.preventDefault();openSearch();return;}if($('#searchDialog').open&&e.key==='Enter'&&e.target.id==='globalSearch'){e.preventDefault();$('.search-result')?.click();return;}if(route()[0]==='cards'&&!inInput&&!$('#searchDialog').open){if(e.key===' '&&!e.target.closest('button')){e.preventDefault();U.flash.reveal=!U.flash.reveal;refresh();}else if(e.key==='ArrowRight'){e.preventDefault();$('[data-act="flash-next"]')?.click();}else if(e.key==='ArrowLeft'){e.preventDefault();$('[data-act="flash-prev"]')?.click();}}if(e.key==='Tab'&&e.target.classList.contains('write-input')){e.preventDefault();const t=e.target,a=t.selectionStart,b=t.selectionEnd;t.setRangeText('    ',a,b,'end');t.dispatchEvent(new Event('input',{bubbles:true}));}});
$('#searchDialog').addEventListener('click',e=>{if(e.target===$('#searchDialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close();}});
window.addEventListener('hashchange',()=>{setMenu(false,false);if($('#searchDialog').open)$('#searchDialog').close();render();window.scrollTo(0,0);});
render();setInterval(tick,1000);
})();
