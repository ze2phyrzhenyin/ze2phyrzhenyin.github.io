e，否则递归 g+1,d−1。","不创建子串，避免每层复制。此处是精确UTF-16比较，不忽略空格、大小写、重音。"],"time":"O(n)","space":"O(n) 栈","edge":"空串与单字符为true；null 拒绝；完整 Unicode 字素回文需要额外规范化，不在此题契约。","cases":[["\"radar\"","true"],["\"abca\"","false"],["\"\"","true"]],"src":["C6 · p.30"],"level":"core","file":"RevisionAlgorithms.java","code":"/** Comparaison exacte des unites UTF-16 ; pas de normalisation. */\npublic static boolean palindrome(String s) {\n    Objects.requireNonNull(s, \"s\");\n    return palindrome(s, 0, s.length() - 1);\n}\nprivate static boolean palindrome(String s, int g, int d) {\n    if (g >= d) return true;\n    return s.charAt(g) == s.charAt(d) && palindrome(s, g + 1, d - 1);\n}"},{"id":"sortedrecursive","title":"递归判断数组是否升序","fr":"Vérifier récursivement l’ordre croissant","prompt":"Retourner si le tableau est trié par ordre croissant.","steps":["把 croissant 明确为非递减：允许相邻元素相等。","剩余元素不足两个时true。","比较 a[i]≤a[i+1] 并递归检查剩余部分，利用短路早停。"],"time":"最坏O(n)，最好O(1)","space":"最坏O(n) 栈","edge":"空数组true、单元素true；严格递增需改为 <，题目要求必须确认。","cases":[["[1,2,2]","true"],["[1,3,2]","false"],["[]","true"]],"src":["C6 · p.30"],"level":"core","file":"RevisionAlgorithms.java","code":"/** Croissant au sens large : les valeurs egales sont acceptees. */\npublic static boolean estTrie(int[] a) {\n    Objects.requireNonNull(a, \"a\");\n    return estTrie(a, 0);\n}\nprivate static boolean estTrie(int[] a, int i) {\n    if (i >= a.length - 1) return true;\n    return a[i] <= a[i + 1] && estTrie(a, i + 1);\n}"},{"id":"maxrecursive","title":"递归求最大值","fr":"Déterminer récursivement le maximum","prompt":"Retourner le maximum d’un tableau non vide.","steps":["递归参数 i 表示当前前缀末端。","i=0 时最大值就是 a[0]，不能随意从0开始。","取 max(a[i], maximum(前缀i−1))，不用拷贝数组。"],"time":"O(n)","space":"O(n) 栈","edge":"空数组无最大值，此实现抛 IllegalArgumentException；全负数组同样正确。","cases":[["[-8,-2,-5]","-2"],["[7]","7"],["[]","IllegalArgumentException"]],"src":["C6 · p.30"],"level":"core","file":"RevisionAlgorithms.java","code":"public static int maximumR(int[] a) {\n    Objects.requireNonNull(a, \"a\");\n    if (a.length == 0) throw new IllegalArgumentException(\"tableau vide\");\n    return maximumR(a, a.length - 1);\n}\nprivate static int maximumR(int[] a, int i) {\n    if (i == 0) return a[0];\n    return Math.max(a[i], maximumR(a, i - 1));\n}"},{"id":"linearsearch","title":"顺序查找","fr":"Recherche séquentielle","prompt":"Retourner le premier indice de la cible, ou −1.","steps":["从0依次比较；首次相等立即返回下标。","全部不命中返回−1，空数组自动走此分支。"],"time":"最坏O(n)，最好O(1)","space":"O(1)","edge":"无需排序；多个重复返回第一个；不修改输入。","cases":[["([4,8,4],4)","0"],["([4,8],9)","-1"]],"src":["C6 · 数组遍历的补充"],"level":"extra","file":"RevisionAlgorithms.java","code":"/** Premier indice ou -1 ; le tableau n'a pas besoin d'etre trie. */\npublic static int rechercheLineaire(int[] a, int cible) {\n    Objects.requireNonNull(a, \"a\");\n    for (int i = 0; i < a.length; i++) {\n        if (a[i] == cible) return i;\n    }\n    return -1;\n}"},{"id":"binarysearch","title":"二分查找","fr":"Recherche dichotomique","prompt":"Rechercher dans un tableau déjà trié.","steps":["维护闭区间 [gauche,droite]，初始[0,n−1]。","mid=g+(d−g)/2 避免 g+d 溢出。","每轮排除中点所在一半，更新 mid+1 或 mid−1，避免区间不缩小。"],"time":"O(log n)","space":"O(1)","edge":"输入必须已按同序排序；重复时返回某个匹配位置；本方法失败返回−1，与Arrays.binarySearch契约不同。","cases":[["([1,3,5,7],5)","2"],["([],5)","-1"]],"src":["C6 · 查找补充","AArrays"],"level":"extra","file":"RevisionAlgorithms.java","code":"/** Precondition : a trie en ordre croissant. Un indice quelconque ou -1. */\npublic static int rechercheDichotomique(int[] a, int cible) {\n    Objects.requireNonNull(a, \"a\");\n    int gauche = 0, droite = a.length - 1;\n    while (gauche <= droite) {\n        int milieu = gauche + (droite - gauche) / 2;\n        if (a[milieu] == cible) return milieu;\n        if (a[milieu] < cible) gauche = milieu + 1;\n        else droite = milieu - 1;\n    }\n    return -1;\n}"},{"id":"bubble","title":"冒泡排序","fr":"Tri à bulles","prompt":"Trier le tableau sur place en échangeant des voisins.","steps":["每趟把当前未排序区最大值冒到右端。","外层缩短右端，内层只比较 i 与 i+1。","一趟没有交换可提前结束；只在 > 时交换以保持稳定性。"],"time":"最好O(n)，平均/最坏O(n²)","space":"O(1)","edge":"原地修改；稳定；空/单元素自然不执行；每趟结束右侧后缀已就位。","cases":[["[3,1,2]","第一趟[1,2,3] → 完成"],["[]","[]"]],"src":["C6 · p.25"],"level":"core","file":"RevisionAlgorithms.java","code":"public static void triBulle(int[] a) {\n    Objects.requireNonNull(a, \"a\");\n    for (int fin = a.length - 1; fin > 0; fin--) {\n        boolean echange = false;\n        for (int i = 0; i < fin; i++) {\n            if (a[i] > a[i + 1]) {\n                int tmp = a[i]; a[i] = a[i + 1]; a[i + 1] = tmp;\n                echange = true;\n            }\n        }\n        if (!echange) return;\n    }\n}"},{"id":"selection","title":"选择排序","fr":"Tri par sélection","prompt":"Choisir le minimum de la zone non triée à chaque étape.","steps":["位置i之前是已就位前缀。","扫描i…n−1找最小值下标min，再与i交换。","比较次数不因原数组已排序而降到线性；一般交换式实现不稳定。"],"time":"最好/平均/最坏O(n²)","space":"O(1)","edge":"原地修改；示例 [2a,2b,1] 首次交换后成为[1,2b,2a]，说明不稳定。","cases":[["[3,1,2]","[1,3,2] → [1,2,3]"]],"src":["C6 · p.25"],"level":"core","file":"RevisionAlgorithms.java","code":"public static void triSelection(int[] a) {\n    Objects.requireNonNull(a, \"a\");\n    for (int i = 0; i < a.length - 1; i++) {\n        int min = i;\n        for (int j = i + 1; j < a.length; j++) {\n            if (a[j] < a[min]) min = j;\n        }\n        int tmp = a[i]; a[i] = a[min]; a[min] = tmp;\n    }\n}"},{"id":"insertion","title":"插入排序","fr":"Tri par insertion","prompt":"Insérer chaque nouvelle valeur dans le préfixe trié.","steps":["从i=1开始，保存a[i]，避免后移覆盖它。","从i−1向左把比value大的元素后移。","写回a[j+1]；条件先j≥0再a[j]，避免负下标。"],"time":"最好O(n)，平均/最坏O(n²)","space":"O(1)","edge":"原地修改，稳定；接近有序时通常较有效；只后移严格大于的元素。","cases":[["[3,1,2]","[1,3,2] → [1,2,3]"]],"src":["C6 · p.25"],"level":"core","file":"RevisionAlgorithms.java","code":"public static void triInsertion(int[] a) {\n    Objects.requireNonNull(a, \"a\");\n    for (int i = 1; i < a.length; i++) {\n        int valeur = a[i], j = i - 1;\n        while (j >= 0 && a[j] > valeur) {\n            a[j + 1] = a[j];\n            j--;\n        }\n        a[j + 1] = valeur;\n    }\n}"},{"id":"merge","title":"归并排序","fr":"Tri fusion","prompt":"Diviser, trier récursivement puis fusionner.","steps":["采用半开区间[g,d)，长度<2返回。","递归排序[g,m)与[m,d)。","双指针归并到辅助数组，补剩余元素，再拷回；相等时优先左边以保持稳定。"],"time":"O(n log n)","space":"O(n) 辅助数组 + O(log n) 栈","edge":"原数组最终改变；辅助数组只申请一次；不要丢掉任意一边未消耗的尾部。","cases":[["[4,1,3,2]","[1,4] 与 [2,3] 合并为 [1,2,3,4]"]],"src":["C6 · p.25"],"level":"core","file":"RevisionAlgorithms.java","code":"public static void triFusion(int[] a) {\n    Objects.requireNonNull(a, \"a\");\n    int[] aide = new int[a.length];\n    trier(a, aide, 0, a.length); // intervalles [g,d)\n}\nprivate static void trier(int[] a, int[] aide, int g, int d) {\n    if (d - g < 2) return;\n    int m = g + (d - g) / 2;\n    trier(a, aide, g, m);\n    trier(a, aide, m, d);\n    int i = g, j = m, k = g;\n    while (i < m && j < d) {\n        aide[k++] = a[i] <= a[j] ? a[i++] : a[j++];\n    }\n    while (i < m) aide[k++] = a[i++];\n    while (j < d) aide[k++] = a[j++];\n    System.arraycopy(aide, g, a, g, d - g);\n}"},{"id":"gcd","title":"最大公约数 PGCD","fr":"Algorithme d’Euclide","prompt":"Calculer le plus grand commun diviseur.","steps":["先转 long 再绝对值，覆盖 Integer.MIN_VALUE。","反复把(x,y)变成(y,x%y)。","y=0 时返回x；约定pgcd(0,0)=0。"],"time":"正数情形 O(log min(|a|,|b|))","space":"O(1)","edge":"支持负整数与0；int最小值绝对值超int范围，返回long。","cases":[["(48,18)","6"],["(-12,18)","6"],["(0,0)","0"]],"src":["扩展算法 · 取余与循环练习"],"level":"extra","file":"RevisionAlgorithms.java","code":"/** PGCD >= 0 ; convention pgcd(0,0)=0, valeurs int completes admises. */\npublic static long pgcd(int a, int b) {\n    long x = Math.abs((long) a), y = Math.abs((long) b);\n    while (y != 0) {\n        long reste = x % y;\n        x = y;\n        y = reste;\n    }\n    return x;\n}"},{"id":"luhn","title":"Luhn 校验","fr":"Vérification d’une somme de contrôle","prompt":"Vérifier une chaîne de chiffres avec l’algorithme de Luhn.","steps":["从右向左，最右边校验位不翻倍；隔一个数字翻倍。","翻倍后大于9减9，再累加。","总和模10为0通过；此实现只累计余数以避免长字符串求和溢出。"],"time":"O(n)","space":"O(1)","edge":"仅ASCII数字，空串false、非数字false；这是校验和，不保证号码真实有效或属于任何具体业务。","cases":[["\"79927398713\"","true"],["\"79927398714\"","false"],["\"12a\"","false"]],"src":["扩展算法 · 字符与循环练习"],"level":"extra","file":"RevisionAlgorithms.java","code":"/** Chiffres ASCII seulement ; chaine vide invalide ; checksum, pas validation commerciale. */\npublic static boolean luhn(String s) {\n    Objects.requireNonNull(s, \"s\");\n    if (s.isEmpty()) return false;\n    int sommeModulo = 0;\n    boolean doubler = false;\n    for (int i = s.length() - 1; i >= 0; i--) {\n        char c = s.charAt(i);\n        if (c < '0' || c > '9') return false;\n        int n = c - '0';\n        if (doubler) {\n            n *= 2;\n            if (n > 9) n -= 9;\n        }\n        sommeModulo = (sommeModulo + n) % 10;\n        doubler = !doubler;\n    }\n    return sommeModulo == 0;\n}"},{"id":"bfs","title":"网格最短路 BFS","fr":"Parcours en largeur","prompt":"Trouver la distance minimale dans une grille non pondérée.","steps":["使用FIFO队列，距离数组初始−1，起点距离0。","首次发现节点即标记并入队，不等到出队，避免重复。","出队检查四邻，限制行列边界与障碍；目标首次出队即有最短步数。"],"time":"O(R×C)","space":"O(R×C)","edge":"0可走、其他值障碍；四方向每步权重相同；不可达−1，起终点相同且可走为0；矩阵须矩形。","cases":[["5×5全0，从(0,0)到(4,4)","8"],["起终点相同","0"],["目标封闭","-1"]],"src":["扩展算法 · 队列和二维数组练习"],"level":"extra","file":"RevisionAlgorithms.java","code":"/** Grille rectangulaire : 0 libre, autre valeur bloquee ; quatre voisins. */\npublic static int distanceBfs(int[][] grille, int sr, int sc, int tr, int tc) {\n    Objects.requireNonNull(grille, \"grille\");\n    if (grille.length == 0 || grille[0] == null || grille[0].length == 0)\n        throw new IllegalArgumentException(\"grille vide\");\n    int lignes = grille.length, colonnes = grille[0].length;\n    for (int[] ligne : grille)\n        if (ligne == null || ligne.length != colonnes)\n            throw new IllegalArgumentException(\"grille non rectangulaire\");\n    if (sr<0 || sr>=lignes || sc<0 || sc>=colonnes ||\n        tr<0 || tr>=lignes || tc<0 || tc>=colonnes)\n        throw new IllegalArgumentException(\"coordonnees\");\n    if (grille[sr][sc]!=0 || grille[tr][tc]!=0) return -1;\n    int[][] distances = new int[lignes][colonnes];\n    for (int[] ligne : distances) Arrays.fill(ligne, -1);\n    Deque<int[]> file = new ArrayDeque<>();\n    file.offerLast(new int[]{sr,sc});\n    distances[sr][sc] = 0; // marquer a l'entree dans la file\n    int[] dr={1,-1,0,0}, dc={0,0,1,-1};\n    while (!file.isEmpty()) {\n        int[] p = file.pollFirst();\n        int r=p[0], c=p[1];\n        if (r==tr && c==tc) return distances[r][c];\n        for (int k=0;k<4;k++) {\n            int nr=r+dr[k], nc=c+dc[k];\n            if (nr>=0 && nr<lignes && nc>=0 && nc<colonnes &&\n                grille[nr][nc]==0 && distances[nr][nc]==-1) {\n                distances[nr][nc]=distances[r][c]+1;\n                file.offerLast(new int[]{nr,nc});\n            }\n        }\n    }\n    return -1;\n}"},{"id":"horner","title":"多项式 Horner 求值","fr":"Évaluation d’un polynôme","prompt":"Évaluer un polynôme sans recalculer chaque puissance.","steps":["约定coefficients[i]是x^i系数。","从最高次向常数项推进r=r*x+c[i]。","P(x)=c0+x(c1+x(c2+…))，省掉每项pow调用。"],"time":"O(n)","space":"O(1)","edge":"空数组此函数定义为零；浮点运算可能有舍入与溢出，精确相等与数值近似应分开处理。","cases":[["([1,2,3],2)","17.0"],["([],5)","0.0"]],"src":["C0 · Polynôme 应用补充"],"level":"extra","file":"RevisionAlgorithms.java","code":"/** coefficients[i] correspond a x^i ; tableau vide represente 0 ici. */\npublic static double horner(double[] coefficients, double x) {\n    Objects.requireNonNull(coefficients, \"coefficients\");\n    double resultat = 0;\n    for (int i = coefficients.length - 1; i >= 0; i--)\n        resultat = resultat * x + coefficients[i];\n    return resultat;\n}"},{"id":"frequency","title":"词频表","fr":"Compter les occurrences","prompt":"Construire une Map associant chaque mot à son nombre d’occurrences.","steps":["选择LinkedHashMap保留首次出现顺序。","merge(mot,1,Integer::sum) 首次存1，之后累加。","若题目要求无序也可用HashMap；若按词排序则选择TreeMap。"],"time":"通常O(n)，依哈希与字符串长度","space":"O(k) 不同词","edge":"此实现不接受null词；区分大小写，未自动去重音或分词。","cases":[["[\"a\",\"b\",\"a\"]","{a=2, b=1}"]],"src":["AMap","C5 · 分组练习补充"],"level":"extra","file":"RevisionAlgorithms.java","code":"/** Ordre de premiere apparition preserve ; mots non null. */\npublic static Map<String,Integer> frequences(List<String> mots) {\n    Objects.requireNonNull(mots, \"mots\");\n    Map<String,Integer> resultat = new LinkedHashMap<>();\n    for (String mot : mots) {\n        Objects.requireNonNull(mot, \"mot\");\n        resultat.merge(mot, 1, Integer::sum);\n    }\n    return resultat;\n}"},{"id":"genericfunctional","title":"手写 filter/map/reduce","fr":"Programmer filter, map et reduce","prompt":"Implémenter les opérations avec des boucles et interfaces fonctionnelles.","steps":["filter保留满足Predicate的元素，不修改来源结构。","map把T转换为R，返回新列表。","reduce从initial顺序累积，调用BinaryOperator；此处不进行并行化。"],"time":"回调O(1)时，各O(n)","space":"filter/map O(n)输出；reduce O(1)累积状态","edge":"返回列表中的可变元素仍可能与来源共享；不深拷贝。标准Predicate.test对应课件Filter.matches。","cases":[["filter [1,2,3], x>1","[2,3]"],["map [\"a\",\"bb\"], length","[1,2]"],["reduce [1,2,3],0,sum","6"]],"src":["C4 · p.1","AFunctions"],"level":"core","file":"RevisionAlgorithms.java","code":"public static <T> List<T> filterList(List<T> source, Predicate<? super T> filtre) {\n    Objects.requireNonNull(source); Objects.requireNonNull(filtre);\n    List<T> resultat = new ArrayList<>();\n    for (T x : source) if (filtre.test(x)) resultat.add(x);\n    return resultat;\n}\npublic static <T,R> List<R> mapList(List<T> source, Function<? super T,? extends R> f) {\n    Objects.requireNonNull(source); Objects.requireNonNull(f);\n    List<R> resultat = new ArrayList<>();\n    for (T x : source) resultat.add(f.apply(x));\n    return resultat;\n}\npublic static <T> T reduceList(List<T> source, T initial, BinaryOperator<T> op) {\n    Objects.requireNonNull(source); Objects.requireNonNull(op);\n    T resultat = initial;\n    for (T x : source) resultat = op.apply(resultat, x);\n    return resultat;\n}"},{"id":"benchmark","title":"比较四种排序的正确性与耗时","fr":"Comparer les tris","prompt":"Comparer les tris sur des copies du même tableau.","steps":["给每个算法原始数据的独立clone，复制本身放测时之外。","nanoTime前后做差；不能预先写死哪种算法耗时多少。","用标准排序生成参考结果，逐一核对。正式基准还需预热、重复与隔离测量。"],"time":"由所选排序决定","space":"O(n) 副本","edge":"随机数据用同一seed可复现；避免把一个算法排序后的结果传给下一个。","cases":[["输入[3,1,2]","四种排序结果均应为[1,2,3]；耗时不固定"]],"src":["C6 · pp.25,27"],"level":"core","file":"RevisionAlgorithms.java","code":"/** Petit banc pedagogique ; pas un benchmark de production. */\npublic static void comparerTris(int[] original) {\n    Objects.requireNonNull(original);\n    String[] noms={\"bulle\",\"selection\",\"insertion\",\"fusion\"};\n    List<Consumer<int[]>> tris=List.of(\n        RevisionAlgorithms::triBulle, RevisionAlgorithms::triSelection,\n        RevisionAlgorithms::triInsertion, RevisionAlgorithms::triFusion);\n    int[] attendu=original.clone(); Arrays.sort(attendu);\n    for (int i=0;i<tris.size();i++) {\n        int[] copie=original.clone(); // copie en dehors de la mesure\n        long debut=System.nanoTime();\n        tris.get(i).accept(copie);\n        long duree=System.nanoTime()-debut;\n        if (!Arrays.equals(copie,attendu)) throw new AssertionError(noms[i]);\n        System.out.printf(\"%s : %d ns%n\",noms[i],duree);\n    }\n}"},{"id":"pairtuple","title":"Paire / Tuple 完整实现","fr":"Classes génériques à un ou deux paramètres","prompt":"Définir une paire homogène et un tuple hétérogène.","steps":["声明<T>或<T,U>。","字段、构造参数、getter/setter沿用类型参数。","Tuple示例字段final无setter，Paire保留课件可修改两个位置的写法。"],"time":"访问/修改O(1)","space":"每对象O(1)，不含其引用对象","edge":"允许null；泛型并不自动复制元素。作为Modeles内部static类方便单文件编译，独立成文件时去掉static并匹配文件名。","cases":[["new Paire<>(7,19).getSecond()","19"]],"src":["C2 · pp.1–2"],"level":"core","file":"Modeles.java","code":"public static final class Paire<T> {\n    private T first, second;\n    public Paire(T first, T second) { this.first=first; this.second=second; }\n    public T getFirst() { return first; }\n    public T getSecond() { return second; }\n    public void setFirst(T value) { first=value; }\n    public void setSecond(T value) { second=value; }\n}\npublic static final class Tuple<T,U> {\n    private final T first;\n    private final U second;\n    public Tuple(T first, U second) { this.first=first; this.second=second; }\n    public T getFirst() { return first; }\n    public U getSecond() { return second; }\n}"},{"id":"singly","title":"泛型单链表修正版","fr":"Liste simplement chaînée","prompt":"Écrire ajout en tête/en queue, suppression en tête et affichage.","steps":["节点内部保存T与next，不向调用方暴露节点可变链接。","维护空表head/tail同时null，尾节点next为null。","删除最后一个节点后清空tail；toString从当前节点非null开始循环，String.valueOf支持null值。"],"time":"头插/尾插/头删/size O(1)；contains/toString O(n)","space":"O(n) 节点","edge":"本版空表删除抛NoSuchElementException，而课件返回null；此差异明确保留。支持null元素，因此抛异常可区分空表与取到null。","cases":[["新空表toString","{}"],["addLast(1), addLast(2), removeFirst()","返回1，表{2}"],["删除后空表再addLast(3)","{3}"]],"src":["C2 · pp.4–5"],"level":"core","file":"Modeles.java","code":"/** Valeurs null admises ; suppression a vide => NoSuchElementException. */\npublic static final class ListeChainee<T> {\n    private static final class Element<E> {\n        final E valeur;\n        Element<E> suivant;\n        Element(E valeur) { this.valeur=valeur; }\n    }\n    private Element<T> tete, queue;\n    private int taille;\n    public boolean isEmpty() { return tete==null; }\n    public int size() { return taille; }\n    public void addLast(T valeur) {\n        Element<T> e=new Element<>(valeur);\n        if (isEmpty()) tete=e;\n        else queue.suivant=e;\n        queue=e;\n        taille++;\n    }\n    public void addFirst(T valeur) {\n        Element<T> e=new Element<>(valeur);\n        e.suivant=tete;\n        tete=e;\n        if (queue==null) queue=e;\n        taille++;\n    }\n    public T removeFirst() {\n        if (isEmpty()) throw new NoSuchElementException(\"liste vide\");\n        T valeur=tete.valeur;\n        tete=tete.suivant;\n        if (tete==null) queue=null;\n        taille--;\n        return valeur;\n    }\n    public boolean contains(T valeur) {\n        for (Element<T> e=tete;e!=null;e=e.suivant)\n            if (Objects.equals(e.valeur,valeur)) return true;\n        return false;\n    }\n    @Override public String toString() {\n        StringJoiner j=new StringJoiner(\",\",\"{\",\"}\");\n        for (Element<T> e=tete;e!=null;e=e.suivant)\n            j.add(String.valueOf(e.valeur));\n        return j.toString();\n    }\n}"},{"id":"doubly","title":"泛型双链表","fr":"Liste doublement chaînée","prompt":"Étendre le modèle pour supprimer en tête ou en queue.","steps":["节点含prev与next；增加时同时连接两个方向。","头删后新头prev=null；尾删后新尾next=null。","只有一个节点时，任何端删除后头尾都变null；size与节点数同步。"],"time":"两端增删O(1)，遍历O(n)","space":"O(n)","edge":"没有暴露任意节点删除；“已定位节点处O(1)删除”不含寻找节点的代价。","cases":[["addLast(1),addFirst(0),removeLast()","返回1，表{0}"]],"src":["C0 · p.3 双链表思考题","C2"],"level":"core","file":"Modeles.java","code":"public static final class ListeDouble<T> {\n    private static final class Noeud<E> {\n        final E valeur;\n        Noeud<E> precedent, suivant;\n        Noeud(E valeur) { this.valeur=valeur; }\n    }\n    private Noeud<T> tete, queue;\n    private int taille;\n    public int size() { return taille; }\n    public boolean isEmpty() { return taille==0; }\n    public void addLast(T valeur) {\n        Noeud<T> e=new Noeud<>(valeur);\n        e.precedent=queue;\n        if (queue==null) tete=e;\n        else queue.suivant=e;\n        queue=e;\n        taille++;\n    }\n    public void addFirst(T valeur) {\n        Noeud<T> e=new Noeud<>(valeur);\n        e.suivant=tete;\n        if (tete==null) queue=e;\n        else tete.precedent=e;\n        tete=e;\n        taille++;\n    }\n    public T removeFirst() {\n        if (isEmpty()) throw new NoSuchElementException(\"liste vide\");\n        T v=tete.valeur;\n        tete=tete.suivant;\n        if (tete==null) queue=null;\n        else tete.precedent=null;\n        taille--;\n        return v;\n    }\n    public T removeLast() {\n        if (isEmpty()) throw new NoSuchElementException(\"liste vide\");\n        T v=queue.valeur;\n        queue=queue.precedent;\n        if (queue==null) tete=null;\n        else queue.suivant=null;\n        taille--;\n        return v;\n    }\n    @Override public String toString() {\n        StringJoiner j=new StringJoiner(\",\",\"{\",\"}\");\n        for (Noeud<T> e=tete;e!=null;e=e.suivant)\n            j.add(String.valueOf(e.valeur));\n        return j.toString();\n    }\n}"},{"id":"studentmodel","title":"Etudiant 完整封装实现","fr":"Classe Etudiant avec validation","prompt":"Concevoir un étudiant et protéger son tableau de notes.","steps":["将姓名/年龄/email/成绩声明private，只开放必要方法。","构造复制数组并校验成绩；getter再次复制；setNote独立校验下标和值。","moyenne使用OptionalDouble表达没有成绩；不擅自把空平均数定义成0。"],"time":"构造/getNotes/平均O(n)；单项访问修改O(1)","space":"O(n) 成绩数组","edge":"成绩有限且在[0,20]，年龄≥0；email只要求非null，未声称完成真实邮箱格式验证。","cases":[["成绩[10,20]","平均15.0"],["外部修改构造器参数","内部成绩不变"],["空成绩数组","OptionalDouble.empty"]],"src":["C0 · pp.1–2"],"level":"core","file":"Modeles.java","code":"public static final class Etudiant {\n    private String nom, prenom, email;\n    private int age;\n    private final double[] notes;\n    public Etudiant(String nom, String prenom, int age, String email, double[] notes) {\n        setNom(nom); setPrenom(prenom); setAge(age); setEmail(email);\n        Objects.requireNonNull(notes,\"notes\");\n        this.notes=Arrays.copyOf(notes,notes.length);\n        for (double n:this.notes) verifierNote(n);\n    }\n    private static void verifierNote(double n) {\n        if (!Double.isFinite(n) || n<0 || n>20)\n            throw new IllegalArgumentException(\"note hors [0,20]\");\n    }\n    public String getNom() { return nom; }\n    public String getPrenom() { return prenom; }\n    public int getAge() { return age; }\n    public String getEmail() { return email; }\n    public double[] getNotes() { return Arrays.copyOf(notes,notes.length); }\n    public void setNom(String v) { nom=Objects.requireNonNull(v); }\n    public void setPrenom(String v) { prenom=Objects.requireNonNull(v); }\n    public void setAge(int v) {\n        if (v<0) throw new IllegalArgumentException(\"age < 0\");\n        age=v;\n    }\n    /** Seulement non null ; pas de validation complete d'adresse email. */\n    public void setEmail(String v) { email=Objects.requireNonNull(v); }\n    public void setNote(int index,double n) {\n        Objects.checkIndex(index,notes.length);\n        verifierNote(n);\n        notes[index]=n;\n    }\n    public OptionalDouble moyenne() {\n        return Arrays.stream(notes).average();\n    }\n    @Override public String toString() {\n        return prenom+\" \"+nom+\" \"+Arrays.toString(notes);\n    }\n}"},{"id":"polynomialmodel","title":"Polynôme：规范化 equals/hashCode","fr":"Polynôme immuable et normalisé","prompt":"Comparer la valeur du polynôme plutôt qu’un tableau non normalisé.","steps":["复制输入、拒绝非有限系数，把−0.0归一化。","去掉最高次端多余零，零多项式统一为[0]。","equals比较规范化数组，hashCode用同一数组规则；final类避免子类对相等性的扩展歧义。"],"time":"构造/equals/hashCode/求值O(n)","space":"O(n)","edge":"使用精确double相等，不做epsilon近似；getter复制。该数学语义是明确设计选择，并非课件已提供完整契约。","cases":[["new Polynome(1,2) 与 new Polynome(1,2,0)","equals true / hashCode相同"],["new Polynome(-0.0) 与 new Polynome()","equals true"]],"src":["C0 · p.3","AObject","AArrays"],"level":"core","file":"Modeles.java","code":"/** Coefficients finis ; c[i] = coefficient de x^i ; egalite exacte normalisee. */\npublic static final class Polynome {\n    private final double[] coefficients;\n    public Polynome(double... valeurs) {\n        Objects.requireNonNull(valeurs,\"coefficients\");\n        double[] c=Arrays.copyOf(valeurs,Math.max(1,valeurs.length));\n        for (int i=0;i<c.length;i++) {\n            if (!Double.isFinite(c[i])) throw new IllegalArgumentException(\"non fini\");\n            if (c[i]==0.0) c[i]=0.0; // -0.0 => +0.0\n        }\n        int n=c.length;\n        while (n>1 && c[n-1]==0.0) n--;\n        coefficients=Arrays.copyOf(c,n);\n    }\n    public double[] getCoefficients() { return coefficients.clone(); }\n    public double evaluer(double x) {\n        return RevisionAlgorithms.horner(coefficients,x);\n    }\n    @Override public boolean equals(Object o) {\n        if (this==o) return true;\n        if (!(o instanceof Polynome p)) return false;\n        return Arrays.equals(coefficients,p.coefficients);\n    }\n    @Override public int hashCode() { return Arrays.hashCode(coefficients); }\n    @Override public String toString() { return Arrays.toString(coefficients); }\n}"},{"id":"inheritanceexample","title":"接口＋抽象类＋具体类","fr":"Contrat, classe abstraite et implémentation","prompt":"Construire une hiérarchie simple de formes mesurables.","steps":["Mesurable仅声明aire契约。","Forme实现接口但保留未实现方法，因此abstract；共有状态nom通过构造器初始化。","Carre完成aire，Forme变量引用Carre时aire动态分派。getNom是final不能重写。"],"time":"本例各基本操作O(1)","space":"每实例O(1)","edge":"边长有限且非负；不能new Forme；父类toString调用aire会执行子类版本，注意不可在未初始化构造阶段误用。","cases":[["new Carre(3).aire()","9.0"]],"src":["C3"],"level":"core","file":"Modeles.java","code":"public interface Mesurable { double aire(); }\npublic abstract static class Forme implements Mesurable {\n    private final String nom;\n    protected Forme(String nom) { this.nom=Objects.requireNonNull(nom); }\n    public final String getNom() { return nom; }\n    @Override public String toString() { return nom+\"=\"+aire(); }\n}\npublic static final class Carre extends Forme {\n    private final double cote;\n    public Carre(double cote) {\n        super(\"Carre\");\n        if (!Double.isFinite(cote) || cote<0) throw new IllegalArgumentException(\"cote\");\n        this.cote=cote;\n    }\n    @Override public double aire() { return cote*cote; }\n}"}],"apis":[{"id":"api1","group":"String","title":"length","signature":"int length()","meaning":"返回UTF-16代码单元数量，不修改字符串。","example":"\"Java\".length() // 4","trap":"不是数组的length字段，也不是用户看到的字符个数的通用计数。","fr":"Longueur de la chaîne","level":"core","src":["AString"]},{"id":"api2","group":"String","title":"charAt","signature":"char charAt(int index)","meaning":"读取下标index的代码单元；0≤index<length。","example":"\"Java\".charAt(1) // 'a'","trap":"越界异常；null接收者会NPE。","fr":"Lire un caractère","level":"core","src":["AString"]},{"id":"api3","group":"String","title":"substring","signature":"String substring(int begin, int end)","meaning":"截取[begin,end)，begin可等于end，得到空串。","example":"\"Java\".substring(1,3) // \"av\"","trap":"end不包含；begin>end或越界非法。","fr":"Extraire une sous-chaîne","level":"extra","src":["AString"]},{"id":"api4","group":"String","title":"substring(begin)","signature":"String substring(int begin)","meaning":"截取begin到末尾，返回String。","example":"\"Java\".substring(2) // \"va\"","trap":"begin==length合法，得到空串。","fr":"Extraire jusqu’à la fin","level":"extra","src":["AString"]},{"id":"api5","group":"String","title":"equals","signature":"boolean equals(Object other)","meaning":"比较String内容；类型不同或other为null时false。","example":"\"abc\".equals(new String(\"abc\")) // true","trap":"调用null.equals会NPE；==不是内容比较。","fr":"Comparer le contenu","level":"core","src":["AString"]},{"id":"api6","group":"String","title":"equalsIgnoreCase","signature":"boolean equalsIgnoreCase(String other)","meaning":"不区分大小写地比较，返回boolean。","example":"\"Java\".equalsIgnoreCase(\"JAVA\") // true","trap":"不等同于去重音或所有语言的自然文本比较。","fr":"Comparer sans tenir compte de la casse","level":"extra","src":["AString"]},{"id":"api7","group":"String","title":"compareTo","signature":"int compareTo(String other)","meaning":"按自然字典序比较，返回负/零/正。","example":"\"a\".compareTo(\"b\") // 负数","trap":"不要求返回值仅为−1/0/1；不是长度排序。","fr":"Comparer dans l’ordre lexicographique","level":"extra","src":["AString"]},{"id":"api8","group":"String","title":"indexOf / lastIndexOf","signature":"int indexOf(String s) / int lastIndexOf(String s)","meaning":"返回首次/末次匹配的下标，没有则−1。","example":"\"banana\".indexOf(\"na\") // 2","trap":"没找到不是0。","fr":"Trouver la position","level":"extra","src":["AString"]},{"id":"api9","group":"String","title":"contains","signature":"boolean contains(CharSequence s)","meaning":"判断是否含连续子序列；按字面文本。","example":"\"bonjour\".contains(\"jour\") // true","trap":"不接受正则语义；大小写敏感。","fr":"Tester la présence","level":"extra","src":["AString"]},{"id":"api10","group":"String","title":"startsWith / endsWith","signature":"boolean startsWith(String prefix) / endsWith(String suffix)","meaning":"判断前缀/后缀。","example":"\"App.java\".endsWith(\".java\") // true","trap":"空前缀/后缀匹配；null参数非法。","fr":"Tester un préfixe ou suffixe","level":"extra","src":["AString"]},{"id":"api11","group":"String","title":"isEmpty / isBlank","signature":"boolean isEmpty() / boolean isBlank()","meaning":"isEmpty长度为0；isBlank为空或只含空白代码点（Java11+）。","example":"\"  \".isEmpty() // false\n\"  \".isBlank() // true","trap":"null不是空串，两者都不能在null接收者调用。","fr":"Chaîne vide ou blanche","level":"extra","src":["AString"]},{"id":"api12","group":"String","title":"trim / strip","signature":"String trim() / String strip()","meaning":"trim去两端≤U+0020代码单元；strip按Character.isWhitespace去两端空白（Java11+）。","example":"\"  x  \".strip() // \"x\"","trap":"都不修改原对象；strip也不是删除所有视觉空格的万能规则。","fr":"Supprimer les blancs aux extrémités","level":"extra","src":["AString"]},{"id":"api13","group":"String","title":"toUpperCase / toLowerCase","signature":"String toUpperCase() / toLowerCase()","meaning":"返回大小写转换的结果，可传Locale控制规则。","example":"\"java\".toUpperCase(java.util.Locale.ROOT) // \"JAVA\"","trap":"结果长度可能变化；原String不变。","fr":"Changer la casse","level":"core","src":["AString"]},{"id":"api14","group":"String","title":"replace","signature":"String replace(CharSequence target, CharSequence replacement)","meaning":"按字面量替换所有匹配，返回结果。","example":"\"a.b.a\".replace(\".\",\"-\") // \"a-b-a\"","trap":"与replaceAll的正则规则不同。","fr":"Remplacement littéral","level":"extra","src":["AString"]},{"id":"api15","group":"String","title":"replaceAll","signature":"String replaceAll(String regex, String replacement)","meaning":"正则替换；返回新结果，replacement也有$等特殊规则。","example":"\"a12b\".replaceAll(\"\\\\d+\", \"#\") // \"a#b\"","trap":"Java源码中反斜杠需转义：\"\\\\d+\"。","fr":"Remplacement par expression régulière","level":"extra","src":["AString"]},{"id":"api16","group":"String","title":"split","signature":"String[] split(String regex, int limit)","meaning":"按正则分割；limit<0保留尾部空项，默认重载相当于0。","example":"\"a,b,\".split(\",\", -1) // {\"a\",\"b\",\"\"}","trap":"点号是正则任意字符；字面点用\"\\\\.\"。","fr":"Découper une chaîne","level":"extra","src":["AString"]},{"id":"api17","group":"String","title":"join","signature":"static String join(CharSequence delimiter, CharSequence... elements)","meaning":"用分隔符连接元素，返回String。","example":"String.join(\"-\", \"a\", \"b\") // \"a-b\"","trap":"集合也有Iterable重载；它不是就地修改。","fr":"Joindre des éléments","level":"extra","src":["AString"]},{"id":"api18","group":"String","title":"valueOf","signature":"static String valueOf(int x) / valueOf(Object x)","meaning":"把数值/对象转String；Object重载null变\"null\"。","example":"String.valueOf((Object)null) // \"null\"","trap":"String.valueOf(null)可能选择char[]重载而NPE；要区分重载。","fr":"Convertir en chaîne","level":"extra","src":["AString"]},{"id":"api19","group":"String","title":"toCharArray","signature":"char[] toCharArray()","meaning":"创建新的char数组，修改数组不会改变原String。","example":"char[] a=\"abc\".toCharArray();","trap":"数组按UTF-16代码单元，不是完整字素。","fr":"Créer un tableau de caractères","level":"extra","src":["AString"]},{"id":"api20","group":"String","title":"codePoints","signature":"IntStream codePoints()","meaning":"返回Unicode代码点流；配合Character方法处理补充平面字符。","example":"\"É\".codePoints().anyMatch(Character::isUpperCase) // true","trap":"不同于chars()按UTF-16代码单元产生int。","fr":"Parcourir les points de code","level":"extra","src":["AString"]},{"id":"api21","group":"StringBuilder","title":"append","signature":"StringBuilder append(Object/int/char/String x)","meaning":"向当前builder追加，并返回自身以支持链式调用。","example":"new StringBuilder().append(\"n=\").append(3).toString() // \"n=3\"","trap":"会修改builder；append(null)要考虑重载歧义。","fr":"Ajouter à la fin","level":"extra","src":["AStringBuilder"]},{"id":"api22","group":"StringBuilder","title":"insert","signature":"StringBuilder insert(int offset, String s)","meaning":"在offset处插入并修改当前builder。","example":"new StringBuilder(\"ac\").insert(1,\"b\").toString() // \"abc\"","trap":"offset可等于length，不可超过。","fr":"Insérer du texte","level":"extra","src":["AStringBuilder"]},{"id":"api23","group":"StringBuilder","title":"delete","signature":"StringBuilder delete(int start, int end)","meaning":"删除[start,end)；修改builder。","example":"new StringBuilder(\"abcd\").delete(1,3).toString() // \"ad\"","trap":"结束位置不包含；检查开始位置合法。","fr":"Supprimer un intervalle","level":"extra","src":["AStringBuilder"]},{"id":"api24","group":"StringBuilder","title":"reverse / toString","signature":"StringBuilder reverse() / String toString()","meaning":"reverse原地反转；toString生成String结果。","example":"new StringBuilder(\"abc\").reverse().toString() // \"cba\"","trap":"StringBuilder.equals不是文本值相等。","fr":"Inverser puis obtenir une chaîne","level":"extra","src":["AStringBuilder"]},{"id":"api25","group":"Character","title":"isUpperCase / isLowerCase","signature":"static boolean isUpperCase(char/int c)","meaning":"判断Unicode大写/小写属性，int重载可处理代码点。","example":"Character.isUpperCase('É') // true","trap":"ASCII范围检测只识别A～Z；需求不同不可混用。","fr":"Tester la casse","level":"core","src":["ACharacter"]},{"id":"api26","group":"Character","title":"isDigit / isLetter / isLetterOrDigit","signature":"static boolean isDigit(char/int c)","meaning":"按Unicode字符类别判断；不只识别ASCII。","example":"Character.isDigit('7') // true","trap":"isDigit true不保证c-'0'得到正确数值；Luhn示例明确限ASCII。","fr":"Tester la catégorie du caractère","level":"extra","src":["ACharacter"]},{"id":"api27","group":"Integer","title":"parseInt","signature":"static int parseInt(String s) / parseInt(String s,int radix)","meaning":"返回基本类型int，可指定基数。","example":"Integer.parseInt(\"101\",2) // 5","trap":"非法格式/超范围抛NumberFormatException；不会自动trim。","fr":"Analyser un entier","level":"extra","src":["AInteger"]},{"id":"api28","group":"Integer","title":"valueOf","signature":"static Integer valueOf(String/int x)","meaning":"返回包装对象Integer。","example":"Integer x=Integer.valueOf(\"42\");","trap":"对象缓存不应作为值相等比较策略。","fr":"Obtenir un entier enveloppé","level":"extra","src":["AInteger"]},{"id":"api29","group":"Integer","title":"compare / sum / max","signature":"static int compare(int a,int b) / sum / max","meaning":"compare返回负零正；sum求和，max取大，可作方法引用。","example":"Integer.compare(3,8) // -1","trap":"compare避免用a-b比较造成溢出；sum本身仍可能溢出。","fr":"Comparer ou agréger des entiers","level":"extra","src":["AInteger"]},{"id":"api30","group":"Math","title":"min / max","signature":"static int/double/... min(a,b) / max(a,b)","meaning":"同类型数值重载返回较小/大值；混合参数按规则提升。","example":"Math.min(6,10.5) // 6.0","trap":"Java小数点用点；不是Math.min(2.5,9,25)。","fr":"Minimum et maximum","level":"core","src":["AMath"]},{"id":"api31","group":"Math","title":"abs","signature":"static int/long/float/double abs(x)","meaning":"返回绝对值，通常不修改输入。","example":"Math.abs(-7) // 7","trap":"Math.abs(Integer.MIN_VALUE)仍为负；可先转long。","fr":"Valeur absolue","level":"extra","src":["AMath"]},{"id":"api32","group":"Math","title":"sqrt / pow","signature":"static double sqrt(double x) / pow(double a,double b)","meaning":"平方根、乘方，返回double。","example":"Math.pow(2,3) // 8.0","trap":"^不是乘方；大整数用浮点pow可能失精度。","fr":"Racine carrée et puissance","level":"extra","src":["AMath"]},{"id":"api33","group":"Math","title":"floor / ceil","signature":"static double floor(double x) / ceil(double x)","meaning":"floor向负无穷，ceil向正无穷，返回double。","example":"Math.floor(-1.2) // -2.0","trap":"(int)-1.2为−1，向零截断而不是floor。","fr":"Arrondir vers le bas ou le haut","level":"extra","src":["AMath"]},{"id":"api34","group":"Math","title":"round","signature":"static long round(double x) / int round(float x)","meaning":"取最接近整数，半数按趋向正无穷处理。","example":"Math.round(2.5) // 3L\nMath.round(-2.5) // -2L","trap":"double重载返回long；不是银行家舍入。","fr":"Arrondir à l’entier le plus proche","level":"extra","src":["AMath"]},{"id":"api35","group":"Math","title":"random","signature":"static double random()","meaning":"返回[0.0,1.0)伪随机double。","example":"int x=1+(int)(Math.random()*6); // 1..6","trap":"(int)Math.random()*6恒为0；极端区间幅度需防溢出。","fr":"Nombre pseudo-aléatoire","level":"core","src":["AMath"]},{"id":"api36","group":"Math","title":"addExact / multiplyExact","signature":"static int/long addExact(a,b) / multiplyExact(a,b)","meaning":"整数运算，溢出时抛ArithmeticException。","example":"Math.addExact(Integer.MAX_VALUE,1) // 异常","trap":"普通+和*不会自动进行同样检查。","fr":"Détecter le débordement","level":"extra","src":["AMath"]},{"id":"api37","group":"Random","title":"nextInt / nextLong","signature":"int nextInt(int bound) / long nextLong(long bound)","meaning":"在[0,bound)生成伪随机值；bound必须>0。","example":"new java.util.Random(1).nextInt(6) // 0..5","trap":"不是加密随机；固定seed用于复现实验。","fr":"Générer un entier borné","level":"extra","src":["ARandom"]},{"id":"api38","group":"System","title":"arraycopy","signature":"static void arraycopy(Object src,int srcPos,Object dest,int destPos,int length)","meaning":"将length个元素复制到已分配的目标；支持同数组重叠范围。","example":"System.arraycopy(a,0,b,1,3);","trap":"length是数量；对象数组仍复制引用，长度/类型检查可能抛异常。","fr":"Copier une portion de tableau","level":"core","src":["ASystem"]},{"id":"api39","group":"System","title":"currentTimeMillis","signature":"static long currentTimeMillis()","meaning":"当前墙上时钟毫秒数，基于Unix纪元。","example":"long t=System.currentTimeMillis();","trap":"可受时钟调整影响，不适合精细比较算法耗时。","fr":"Lire l’heure en millisecondes","level":"core","src":["ASystem"]},{"id":"api40","group":"System","title":"nanoTime","signature":"static long nanoTime()","meaning":"高分辨率时间源，用于同一JVM内取时间差。","example":"long elapsed=System.nanoTime()-start;","trap":"绝对值不是日历时间；分辨率不保证每次变化1纳秒。","fr":"Mesurer une durée","level":"extra","src":["ASystem"]},{"id":"api41","group":"System","title":"out.print / println / printf","signature":"void print(...) / void println(...) / PrintStream printf(String format, Object... args)","meaning":"控制台输出；printf实际上返回PrintStream，可链式使用。","example":"System.out.printf(\"%.2f%n\", 3.14159); // 3.14换行","trap":"printf返回类型为PrintStream，不是void；%n比硬写平台换行清晰。","fr":"Afficher et formater","level":"core","src":["ASystem"]},{"id":"api42","group":"Arrays","title":"toString / deepToString","signature":"static String toString(int[]/Object[] a) / deepToString(Object[] a)","meaning":"一维/嵌套数组转可读文本；不修改输入。","example":"Arrays.toString(new int[]{1,2}) // \"[1, 2]\"","trap":"二维用deepToString；直接数组toString不遍历元素。","fr":"Décrire un tableau","level":"core","src":["AArrays"]},{"id":"api43","group":"Arrays","title":"equals / deepEquals","signature":"static boolean equals(int[]/double[]/Object[] a,b) / deepEquals(Object[] a,b)","meaning":"按元素内容比较；deepEquals处理嵌套数组。","example":"Arrays.equals(new int[]{1},new int[]{1}) // true","trap":"对象元素依各自equals；double版本对NaN、±0有特定规则。","fr":"Comparer des tableaux","level":"core","src":["AArrays"]},{"id":"api44","group":"Arrays","title":"hashCode / deepHashCode","signature":"static int hashCode(int[]/double[]/Object[] a)","meaning":"生成与对应数组内容相等性一致的哈希。","example":"Arrays.hashCode(new int[]{1,2})","trap":"数组对象默认hashCode不是逐元素哈希。","fr":"Hacher le contenu","level":"core","src":["AArrays"]},{"id":"api45","group":"Arrays","title":"copyOf","signature":"static T[] copyOf(T[] original,int newLength)","meaning":"返回新数组；截断或补默认值；有基本类型重载。","example":"Arrays.copyOf(new int[]{1,2},4) // [1,2,0,0]","trap":"对象数组是浅拷贝；负长度非法。","fr":"Copier et redimensionner","level":"core","src":["AArrays"]},{"id":"api46","group":"Arrays","title":"copyOfRange","signature":"static T[] copyOfRange(T[] a,int from,int to)","meaning":"复制[from,to)，to超过原长度时按规则补默认值。","example":"Arrays.copyOfRange(new int[]{1,2,3},1,3) // [2,3]","trap":"from须合法；不要当作视图。","fr":"Copier un intervalle","level":"extra","src":["AArrays"]},{"id":"api47","group":"Arrays","title":"fill","signature":"static void fill(int[]/Object[] a,value)","meaning":"用同一值填充所有位置，可选[from,to)重载。","example":"Arrays.fill(a,-1);","trap":"对象value被多个位置共享，不会每个位置new一个对象。","fr":"Remplir un tableau","level":"extra","src":["AArrays"]},{"id":"api48","group":"Arrays","title":"sort","signature":"static void sort(int[] a) / <T> void sort(T[] a,Comparator<? super T> c)","meaning":"就地升序/按比较器排序，返回void。","example":"Arrays.sort(a);","trap":"基本类型int[]不能直接配Comparator；对象数组排序稳定。","fr":"Trier sur place","level":"core","src":["AArrays"]},{"id":"api49","group":"Arrays","title":"binarySearch","signature":"static int binarySearch(int[] a,int key)","meaning":"已升序数组中搜索；命中下标，否则−(插入点)−1。","example":"Arrays.binarySearch(new int[]{1,3,5},4) // -3","trap":"数组必须同规则排序；重复项不保证最左。","fr":"Recherche dichotomique","level":"extra","src":["AArrays"]},{"id":"api50","group":"Arrays","title":"asList","signature":"static <T> List<T> asList(T... a)","meaning":"定长且由数组支持的列表视图。","example":"List<String> x=Arrays.asList(\"a\",\"b\"); x.set(0,\"c\");","trap":"add/remove不支持；int[]作为单个元素。","fr":"Créer une liste de taille fixe","level":"core","src":["AArrays"]},{"id":"api51","group":"Arrays","title":"stream","signature":"static IntStream stream(int[] a) / <T> Stream<T> stream(T[] a)","meaning":"从数组建立流；基本类型int、long、double有专门流重载。","example":"Arrays.stream(new int[]{1,2,3}).sum() // 6","trap":"不能把Stream.of(int[])当IntStream。","fr":"Créer un flux à partir d’un tableau","level":"core","src":["AArrays"]},{"id":"api52","group":"Objects","title":"equals","signature":"static boolean equals(Object a,Object b)","meaning":"null安全相等比较：两null为true；否则调用a.equals(b)。","example":"Objects.equals(null,null) // true","trap":"不会自动深比较所有数组内容。","fr":"Égalité tolérant null","level":"core","src":["AObjects"]},{"id":"api53","group":"Objects","title":"hash","signature":"static int hash(Object... values)","meaning":"组合多个字段生成哈希值。","example":"Objects.hash(nom,age)","trap":"传入基本类型数组时不是逐元素数组哈希；用Arrays.hashCode。","fr":"Combiner les champs dans un hash","level":"core","src":["AObjects"]},{"id":"api54","group":"Objects","title":"requireNonNull","signature":"static <T> T requireNonNull(T obj,String message)","meaning":"非null则原样返回，否则NPE，可直接用于字段赋值。","example":"this.nom=Objects.requireNonNull(nom,\"nom\");","trap":"只查null，不查空串、长度或业务合法性。","fr":"Exiger une référence non nulle","level":"extra","src":["AObjects"]},{"id":"api55","group":"Objects","title":"checkIndex","signature":"static int checkIndex(int index,int length)","meaning":"校验0≤index<length并返回index；否则越界异常。","example":"Objects.checkIndex(0,3) // 0","trap":"长度为0时没有合法index。","fr":"Vérifier un indice","level":"extra","src":["AObjects"]},{"id":"api56","group":"Object","title":"equals / hashCode / toString","signature":"boolean equals(Object) / int hashCode() / String toString()","meaning":"根类方法，常由值类重写；自定义equals与hashCode须一致。","example":"@Override public String toString(){ return \"...\"; }","trap":"hashCode大小写；equals参数应Object，不只写具体类。","fr":"Méthodes communes aux objets","level":"core","src":["AObject"]},{"id":"api57","group":"Object","title":"getClass","signature":"final Class<?> getClass()","meaning":"返回实际运行时类信息。","example":"\"abc\".getClass() // class java.lang.String","trap":"泛型实参通常不由getClass区别。","fr":"Obtenir la classe réelle","level":"core","src":["AObject"]},{"id":"api58","group":"List","title":"size / isEmpty","signature":"int size() / boolean isEmpty()","meaning":"元素数与是否无元素。","example":"List.of(1,2).size() // 2","trap":"ArrayList容量与size不同。","fr":"Nombre d’éléments","level":"extra","src":["AList"]},{"id":"api59","group":"List","title":"add","signature":"boolean add(E e) / void add(int index,E e)","meaning":"追加或插入；可变列表的size增加。","example":"xs.add(0,\"a\");","trap":"不可修改列表抛异常；插入index可等于size。","fr":"Ajouter un élément","level":"extra","src":["AList"]},{"id":"api60","group":"List","title":"get / set","signature":"E get(int index) / E set(int index,E e)","meaning":"读取/替换已有元素；set返回旧值且size不变。","example":"xs.set(0,\"b\");","trap":"get/set要求index<size，不能等于size。","fr":"Lire ou remplacer","level":"extra","src":["AList"]},{"id":"api61","group":"List","title":"remove(index)","signature":"E remove(int index)","meaning":"删除指定下标，返回被删元素。","example":"new ArrayList<>(List.of(10,20)).remove(1) // 20","trap":"List<Integer>的remove(1)是下标而不是值。","fr":"Supprimer par indice","level":"extra","src":["AList"]},{"id":"api62","group":"List","title":"remove(value)","signature":"boolean remove(Object value)","meaning":"删除第一个相等元素，是否改变列表作为返回值。","example":"xs.remove(Integer.valueOf(1));","trap":"按值删除要避免被int重载截获。","fr":"Supprimer par valeur","level":"extra","src":["AList"]},{"id":"api63","group":"List","title":"contains / indexOf","signature":"boolean contains(Object x) / int indexOf(Object x)","meaning":"按equals搜索；indexOf未找到−1。","example":"List.of(\"a\",\"b\").indexOf(\"b\") // 1","trap":"自定义元素需正确equals。","fr":"Chercher un élément","level":"extra","src":["AList"]},{"id":"api64","group":"List","title":"sort / replaceAll","signature":"void sort(Comparator<? super E> c) / void replaceAll(UnaryOperator<E> op)","meaning":"排序或逐元素替换，会修改列表。","example":"xs.replaceAll(String::trim);","trap":"不是Stream转换；不可修改实现可拒绝操作。","fr":"Modifier toute la liste","level":"extra","src":["AList"]},{"id":"api65","group":"List","title":"subList","signature":"List<E> subList(int from,int to)","meaning":"返回[from,to)视图，通常与原列表关联。","example":"List<Integer> part=xs.subList(1,3);","trap":"对原列表做未通过视图的结构修改后，视图行为可能未定义。","fr":"Vue d’une portion","level":"extra","src":["AList"]},{"id":"api66","group":"List","title":"of / copyOf","signature":"static <E> List<E> of(E... e) / copyOf(Collection<? extends E> c)","meaning":"不可修改列表，拒绝null；copyOf不承诺总创建新实例。","example":"List<String> x=List.of(\"a\",\"b\");","trap":"不可修改不等于元素对象不可变。","fr":"Construire une liste non modifiable","level":"extra","src":["AList"]},{"id":"api67","group":"List","title":"toArray","signature":"<T> T[] toArray(T[] a) / toArray(IntFunction<T[]> generator)","meaning":"按需要创建指定运行时元素类型的数组。","example":"String[] a=xs.toArray(String[]::new);","trap":"无参数toArray()返回Object[]，不能强转成任意String[]。","fr":"Convertir en tableau","level":"extra","src":["AList"]},{"id":"api68","group":"Collections","title":"sort","signature":"static <T extends Comparable<? super T>> void sort(List<T> list)","meaning":"按自然顺序就地排序，也有Comparator重载。","example":"Collections.sort(xs);","trap":"需要列表支持相应修改；返回void。","fr":"Trier une liste","level":"extra","src":["ACollections"]},{"id":"api69","group":"Collections","title":"reverse / shuffle / swap","signature":"static void reverse(List<?> x) / shuffle(List<?> x) / swap(List<?> x,int i,int j)","meaning":"反序、随机打乱、交换两个位置，均修改列表。","example":"Collections.swap(xs,0,1);","trap":"reverse仅反向当前顺序，不等同于按值降序排序。","fr":"Réorganiser une liste","level":"extra","src":["ACollections"]},{"id":"api70","group":"Collections","title":"min / max","signature":"static <T> T min(Collection<? extends T> c,Comparator<? super T> cmp)","meaning":"返回最小/最大元素；也有自然排序重载。","example":"Collections.max(List.of(1,3,2)) // 3","trap":"空集合抛NoSuchElementException，不是Optional。","fr":"Trouver un extrême","level":"extra","src":["ACollections"]},{"id":"api71","group":"Collections","title":"frequency","signature":"static int frequency(Collection<?> c,Object o)","meaning":"统计按equals相等的元素次数。","example":"Collections.frequency(List.of(1,2,1),1) // 2","trap":"多次对每个候选调用可能产生重复遍历，词频表可用Map。","fr":"Compter les occurrences","level":"extra","src":["ACollections"]},{"id":"api72","group":"Collections","title":"unmodifiableList","signature":"static <T> List<T> unmodifiableList(List<? extends T> list)","meaning":"只读视图，底层列表仍可被其它引用改变。","example":"List<String> vue=Collections.unmodifiableList(xs);","trap":"不是独立快照或深拷贝。","fr":"Vue non modifiable","level":"extra","src":["ACollections"]},{"id":"api73","group":"Set","title":"add / contains / remove","signature":"boolean add(E) / contains(Object) / remove(Object)","meaning":"添加是否改变集合、存在测试、删除是否改变集合。","example":"Set<Integer> s=new HashSet<>(); s.add(1); s.add(1); // size 1","trap":"HashSet依equals/hashCode；TreeSet依compare结果0。","fr":"Gérer un ensemble sans doublons","level":"extra","src":["ASet"]},{"id":"api74","group":"Set","title":"addAll / retainAll / removeAll","signature":"boolean addAll(Collection) / retainAll(Collection) / removeAll(Collection)","meaning":"对应并集加入、交集保留、差集删除；修改接收集合。","example":"Set<Integer> a=new HashSet<>(List.of(1,2)); a.retainAll(List.of(2,3));","trap":"需要可修改集合；不是自动创建新集合。","fr":"Union, intersection et différence","level":"extra","src":["ASet"]},{"id":"api75","group":"Map","title":"put / get","signature":"V put(K key,V value) / V get(Object key)","meaning":"put返回旧值或null；get返回映射值或null。","example":"Map<String,Integer> m=new HashMap<>(); m.put(\"a\",1);","trap":"get为null不必然表示无键，某些Map可存null值。","fr":"Associer et lire une valeur","level":"extra","src":["AMap"]},{"id":"api76","group":"Map","title":"containsKey / containsValue","signature":"boolean containsKey(Object k) / containsValue(Object v)","meaning":"分别判断键或值存在。","example":"m.containsKey(\"a\") // true","trap":"containsValue在HashMap一般需遍历，不能假设O(1)。","fr":"Tester une clé ou une valeur","level":"extra","src":["AMap"]},{"id":"api77","group":"Map","title":"getOrDefault","signature":"V getOrDefault(Object key,V defaultValue)","meaning":"不存在映射时返回默认值，不会插入键。","example":"m.getOrDefault(\"absent\",0) // 0","trap":"键存在且映射null时返回null，不是默认值。","fr":"Lire avec valeur par défaut","level":"extra","src":["AMap"]},{"id":"api78","group":"Map","title":"putIfAbsent","signature":"V putIfAbsent(K key,V value)","meaning":"没有值或映射null时放入，返回之前的值。","example":"m.putIfAbsent(\"a\",9);","trap":"和getOrDefault不同：可能改变Map。","fr":"Insérer en l’absence de valeur","level":"extra","src":["AMap"]},{"id":"api79","group":"Map","title":"merge","signature":"V merge(K key,V value,BiFunction<? super V,? super V,? extends V> f)","meaning":"无值则存非null value；有值则合并，合并结果null会删除键。","example":"m.merge(\"a\",1,Integer::sum);","trap":"value不能为null；回调不是总会执行。","fr":"Fusionner des valeurs","level":"extra","src":["AMap"]},{"id":"api80","group":"Map","title":"computeIfAbsent","signature":"V computeIfAbsent(K key,Function<? super K,? extends V> f)","meaning":"无非null值时用函数生成；生成null不建立映射。","example":"motsParLongueur.computeIfAbsent(3,k -> new ArrayList<>()).add(\"abc\");","trap":"普通HashMap不因此变得线程安全。","fr":"Calculer une valeur manquante","level":"extra","src":["AMap"]},{"id":"api81","group":"Map","title":"keySet / values / entrySet","signature":"Set<K> keySet() / Collection<V> values() / Set<Map.Entry<K,V>> entrySet()","meaning":"返回键、值、键值对视图，通常与Map关联。","example":"for(var e:m.entrySet()) System.out.println(e.getKey()+\"=\"+e.getValue());","trap":"values可有重复；视图不等于独立副本。","fr":"Parcourir les associations","level":"extra","src":["AMap"]},{"id":"api82","group":"Map","title":"remove / replace / clear","signature":"V remove(Object k) / V replace(K k,V v) / void clear()","meaning":"删除键、只替换已有键、清空Map。","example":"m.replace(\"a\",5);","trap":"replace不创建不存在键；remove也有键值同时匹配重载。","fr":"Mettre à jour ou supprimer","level":"extra","src":["AMap"]},{"id":"api83","group":"Map","title":"forEach","signature":"void forEach(BiConsumer<? super K,? super V> action)","meaning":"对每个键值对执行动作。","example":"m.forEach((k,v) -> System.out.println(k+\":\"+v));","trap":"默认HashMap顺序不保证；不要回调中随意结构修改。","fr":"Consommer les paires clé-valeur","level":"extra","src":["AMap"]},{"id":"api84","group":"Deque","title":"offerLast / pollFirst","signature":"boolean offerLast(E e) / E pollFirst()","meaning":"队尾入、队头出；pollFirst空时null。","example":"Deque<Integer> q=new ArrayDeque<>(); q.offerLast(1); q.pollFirst();","trap":"ArrayDeque禁止null，返回null可表示空。","fr":"Utiliser une file FIFO","level":"extra","src":["ADeque"]},{"id":"api85","group":"Deque","title":"push / pop / peek","signature":"void push(E e) / E pop() / E peek()","meaning":"作为栈；push在头部插入，pop头部删除，peek仅查看。","example":"q.push(1); q.push(2); q.pop(); // 2","trap":"pop空时异常，peek空时null。","fr":"Utiliser une pile LIFO","level":"extra","src":["ADeque"]},{"id":"api86","group":"Deque","title":"removeFirst / getFirst","signature":"E removeFirst() / E getFirst()","meaning":"删除并返回/仅返回队头；空时抛NoSuchElementException。","example":"q.getFirst();","trap":"与pollFirst/peekFirst返回null的版本区分。","fr":"Accès exceptionnel en cas de file vide","level":"extra","src":["ADeque"]},{"id":"api87","group":"Iterator","title":"hasNext / next / remove","signature":"boolean hasNext() / E next() / void remove()","meaning":"检查、前进并获取、删除上次next返回的元素。","example":"var it=xs.iterator(); while(it.hasNext()){ if(it.next()==null) it.remove(); }","trap":"remove可不被支持；调用时序不合法会异常。","fr":"Parcourir et supprimer","level":"extra","src":["AIterator"]},{"id":"api88","group":"Comparator","title":"comparing / comparingInt","signature":"static <T,U> Comparator<T> comparing(Function<T,U> key) / comparingInt(ToIntFunction<T> key)","meaning":"按提取出的关键字比较。","example":"Comparator.comparingInt(String::length)","trap":"comparing的键需可比较或另提供Comparator；null需显式规则。","fr":"Comparer selon une clé","level":"core","src":["AComparator"]},{"id":"api89","group":"Comparator","title":"thenComparing","signature":"Comparator<T> thenComparing(Comparator<? super T> other)","meaning":"当前比较为0时，使用下一个比较器。","example":"Comparator.comparingInt(String::length).thenComparing(Comparator.naturalOrder())","trap":"只有前一关键字相等才用次关键字。","fr":"Départager les égalités","level":"extra","src":["AComparator"]},{"id":"api90","group":"Comparator","title":"reversed / reverseOrder","signature":"Comparator<T> reversed() / static Comparator<T> reverseOrder()","meaning":"反转当前比较器/获取自然逆序比较器。","example":"Comparator.<Integer>naturalOrder().reversed()","trap":"reversed位置决定反转整个链还是一部分。","fr":"Inverser un ordre","level":"extra","src":["AComparator"]},{"id":"api91","group":"Comparator","title":"nullsFirst / nullsLast","signature":"static <T> Comparator<T> nullsFirst(Comparator<? super T> c)","meaning":"允许null并放最前；nullsLast放最后。","example":"Comparator.nullsLast(Comparator.<String>naturalOrder())","trap":"自然排序本身不能普遍处理null。","fr":"Ordonner les valeurs null","level":"extra","src":["AComparator"]},{"id":"api92","group":"Comparable","title":"compareTo","signature":"int compareTo(T other)","meaning":"实现类定义自然顺序，结果负/零/正。","example":"\"abc\".compareTo(\"abd\") // 负数","trap":"compareTo的0与equals最好保持一致，树集合依比较规则去重。","fr":"Définir l’ordre naturel","level":"extra","src":["AComparable"]},{"id":"api93","group":"Scanner","title":"next / nextLine","signature":"String next() / String nextLine()","meaning":"读取下一个token/当前行剩余部分。","example":"String nom=sc.nextLine();","trap":"nextInt后立即nextLine可能读取空行尾。","fr":"Lire un mot ou une ligne","level":"extra","src":["AScanner"]},{"id":"api94","group":"Scanner","title":"nextInt / nextDouble","signature":"int nextInt() / double nextDouble()","meaning":"读取下一个数值token，格式受Locale影响。","example":"int n=sc.nextInt();","trap":"非法格式InputMismatchException，输入结束NoSuchElementException。","fr":"Lire une valeur numérique","level":"extra","src":["AScanner"]},{"id":"api95","group":"Scanner","title":"hasNextInt / hasNextLine","signature":"boolean hasNextInt() / boolean hasNextLine()","meaning":"判断能否读取相应类型/下一行，不消费内容。","example":"if(sc.hasNextInt()) n=sc.nextInt();","trap":"失败后不消费错误token，循环可能卡在同一输入上。","fr":"Vérifier la disponibilité d’une entrée","level":"extra","src":["AScanner"]},{"id":"api96","group":"Scanner","title":"useLocale / close","signature":"Scanner useLocale(Locale locale) / void close()","meaning":"设置数字解析区域规则；close关闭Scanner及可关闭底层输入。","example":"sc.useLocale(java.util.Locale.US);","trap":"关闭System.in的Scanner会影响后续共享输入。","fr":"Configurer ou fermer la lecture","level":"extra","src":["AScanner"]},{"id":"api97","group":"Consumer","title":"accept / andThen","signature":"void accept(T t) / Consumer<T> andThen(Consumer<? super T> after)","meaning":"执行动作/组合先当前后after。","example":"Consumer<String> c=System.out::println; c.accept(\"x\");","trap":"前动作异常时后动作不执行。","fr":"Consommer puis enchaîner","level":"core","src":["AConsumer"]},{"id":"api98","group":"Predicate","title":"test / and / or / negate","signature":"boolean test(T t) / Predicate<T> and(...),or(...),negate()","meaning":"判断或创建短路逻辑组合。","example":"Predicate<Integer> p=x->x>0; p.negate().test(-1); // true","trap":"组合方法不会立刻对所有数据执行判断。","fr":"Tester et combiner des conditions","level":"core","src":["APredicate"]},{"id":"api99","group":"Function","title":"apply / andThen / compose","signature":"R apply(T t) / andThen(g) / compose(g)","meaning":"转换；andThen先自己再g，compose先g再自己。","example":"Function<Integer,Integer> f=x->x+1; f.apply(3); // 4","trap":"顺序分别g(f(x))与f(g(x))。","fr":"Transformer et composer","level":"core","src":["AFunction"]},{"id":"api100","group":"Supplier","title":"get","signature":"T get()","meaning":"没有参数，提供一个结果。","example":"Supplier<List<String>> s=ArrayList::new; s.get();","trap":"不保证每次都是新对象，取决于实现。","fr":"Fournir une valeur","level":"core","src":["ASupplier"]},{"id":"api101","group":"Functions","title":"BiFunction / BiConsumer / BiPredicate","signature":"R apply(T,U) / void accept(T,U) / boolean test(T,U)","meaning":"两个输入的转换、消费、判断。","example":"BiFunction<Integer,Integer,Integer> add=(a,b)->a+b;","trap":"Bi表示两个输入，不是两个输出。","fr":"Interfaces à deux arguments","level":"core","src":["AFunctions"]},{"id":"api102","group":"Functions","title":"UnaryOperator / BinaryOperator","signature":"T apply(T) / T apply(T,T)","meaning":"输入与输出同类型的Function/BiFunction特化。","example":"BinaryOperator<Integer> add=Integer::sum;","trap":"BinaryOperator不是Comparator，后者返回int表示顺序。","fr":"Opérateurs unaires et binaires","level":"core","src":["AFunctions"]},{"id":"api103","group":"Functions","title":"IntFunction / ToIntFunction","signature":"R apply(int x) / int applyAsInt(T x)","meaning":"分别为int输入和int输出的特化。","example":"ToIntFunction<String> len=String::length; len.applyAsInt(\"abc\"); // 3","trap":"名字类似但输入输出方向相反。","fr":"Spécialisation vers ou depuis int","level":"core","src":["AFunctions"]},{"id":"api104","group":"Functions","title":"IntConsumer / IntUnaryOperator","signature":"void accept(int x) / int applyAsInt(int x)","meaning":"基本类型消费和一元变换。","example":"IntUnaryOperator twice=x->2*x; twice.applyAsInt(4); // 8","trap":"没有装箱不代表运算绝不溢出。","fr":"Opérations primitives","level":"core","src":["AFunctions"]},{"id":"api105","group":"Stream","title":"of / empty / ofNullable","signature":"static <T> Stream<T> of(T... x) / empty() / ofNullable(T x)","meaning":"创建流；ofNullable(null)为空流（Java9+）。","example":"Stream.of(1,2,3).count() // 3L","trap":"Stream.of(int[])常是一元素数组流。","fr":"Créer un flux","level":"core","src":["AStream"]},{"id":"api106","group":"Stream","title":"filter","signature":"Stream<T> filter(Predicate<? super T> p)","meaning":"中间操作：保留符合条件元素，类型不变。","example":"Stream.of(1,2,3).filter(x->x>1).toList() // [2,3]","trap":"惰性；条件中的副作用不要作为正确性依赖。","fr":"Filtrer","level":"core","src":["AStream"]},{"id":"api107","group":"Stream","title":"map","signature":"<R> Stream<R> map(Function<? super T,? extends R> f)","meaning":"中间操作：逐元素一对一转换为R。","example":"Stream.of(\"a\",\"bb\").map(String::length).toList() // [1,2]","trap":"映射到null不等于删除元素。","fr":"Transformer","level":"core","src":["AStream"]},{"id":"api108","group":"Stream","title":"flatMap","signature":"<R> Stream<R> flatMap(Function<? super T,? extends Stream<? extends R>> f)","meaning":"将子流展开为单一流。","example":"List.of(List.of(1,2),List.of(3)).stream().flatMap(Collection::stream).toList()","trap":"map得到子流对象；flatMap才展开。","fr":"Aplatir les sous-flux","level":"core","src":["AStream"]},{"id":"api109","group":"Stream","title":"mapToInt","signature":"IntStream mapToInt(ToIntFunction<? super T> f)","meaning":"转成IntStream使用sum等数值API。","example":"Stream.of(\"a\",\"bb\").mapToInt(String::length).sum() // 3","trap":"Stream<Integer>本身没有sum方法。","fr":"Transformer en flux d’entiers","level":"extra","src":["AStream"]},{"id":"api110","group":"Stream","title":"distinct","signature":"Stream<T> distinct()","meaning":"有状态中间操作，按equals去重。","example":"Stream.of(2,1,2).distinct().toList() // [2,1]","trap":"自定义值对象需正确equals/hashCode。","fr":"Éliminer les doublons","level":"core","src":["AStream"]},{"id":"api111","group":"Stream","title":"sorted","signature":"Stream<T> sorted() / sorted(Comparator<? super T> c)","meaning":"中间排序，不就地重排源集合。","example":"Stream.of(3,1,2).sorted().toList() // [1,2,3]","trap":"无限流先sorted通常不能完成；默认自然顺序要求可比较。","fr":"Trier un flux","level":"core","src":["AStream"]},{"id":"api112","group":"Stream","title":"limit / skip","signature":"Stream<T> limit(long n) / skip(long n)","meaning":"限制最多前n个/丢弃前n个；n≥0。","example":"Stream.of(1,2,3,4).skip(1).limit(2).toList() // [2,3]","trap":"limit短路，skip本身不是短路。","fr":"Limiter et ignorer un préfixe","level":"core","src":["AStream"]},{"id":"api113","group":"Stream","title":"peek","signature":"Stream<T> peek(Consumer<? super T> action)","meaning":"中间观察操作，可被优化跳过。","example":"Stream.of(1,2).peek(System.out::println).toList();","trap":"不应用于必须执行的业务更新；count可能不触发peek。","fr":"Observer sans garantir un effet obligatoire","level":"extra","src":["AStream"]},{"id":"api114","group":"Stream","title":"forEach / forEachOrdered","signature":"void forEach(Consumer<? super T> c) / forEachOrdered(c)","meaning":"终端消费；有序版本遵守已定义的encounter order。","example":"Stream.of(1,2).forEach(System.out::println);","trap":"并行forEach输出顺序不保证。","fr":"Consommer les éléments","level":"core","src":["AStream"]},{"id":"api115","group":"Stream","title":"count","signature":"long count()","meaning":"终端操作，元素数；空流0。","example":"Stream.of(1,2,3).count() // 3L","trap":"结果long；可能优化跳过无关中间操作。","fr":"Compter","level":"core","src":["AStream"]},{"id":"api116","group":"Stream","title":"min / max","signature":"Optional<T> min(Comparator<? super T> c) / max(c)","meaning":"终端寻找最小/最大值，空流empty。","example":"Stream.of(1,3,2).max(Integer::compare).orElseThrow() // 3","trap":"不是直接返回T，也不是OptionalInt。","fr":"Trouver un extrême","level":"core","src":["AStream"]},{"id":"api117","group":"Stream","title":"findFirst / findAny","signature":"Optional<T> findFirst() / findAny()","meaning":"短路终端操作；首个/任意元素，空流empty。","example":"Stream.of(\"a\",\"b\").findFirst().orElse(\"?\") // \"a\"","trap":"findAny允许非确定选择；选中null元素可能NPE。","fr":"Chercher un élément","level":"core","src":["AStream"]},{"id":"api118","group":"Stream","title":"allMatch / anyMatch / noneMatch","signature":"boolean allMatch(Predicate) / anyMatch(Predicate) / noneMatch(Predicate)","meaning":"短路量词检查；空流分别true/false/true。","example":"Stream.<Integer>empty().allMatch(x->x>0) // true","trap":"allMatch真不说明流非空。","fr":"Vérifier tous, au moins un, aucun","level":"core","src":["AStream"]},{"id":"api119","group":"Stream","title":"reduce","signature":"Optional<T> reduce(BinaryOperator<T> op) / T reduce(T identity,BinaryOperator<T> op)","meaning":"聚合；无初始值版本空时empty，有初始值时返回identity。","example":"Stream.of(1,2,3).reduce(0,Integer::sum) // 6","trap":"并行需结合律及正确中性元，不能随意用减法。","fr":"Agréger par réduction","level":"core","src":["AStream"]},{"id":"api120","group":"Stream","title":"collect","signature":"<R,A> R collect(Collector<? super T,A,R> collector)","meaning":"终端收集，返回R。","example":"Stream.of(1,2).collect(Collectors.toCollection(ArrayList::new))","trap":"Collector对象与收集后的结果对象不同。","fr":"Collecter","level":"core","src":["AStream"]},{"id":"api121","group":"Stream","title":"toList","signature":"List<T> toList()","meaning":"Java16+，终端返回不可修改列表，保持已定义顺序。","example":"Stream.of(1,2).toList() // 不可修改List","trap":"不能承诺是ArrayList；不保证元素深不可变。","fr":"Collecter en liste non modifiable","level":"extra","src":["AStream"]},{"id":"api122","group":"Stream","title":"toArray","signature":"Object[] toArray() / <A> A[] toArray(IntFunction<A[]> generator)","meaning":"终端生成数组，工厂决定运行时数组类型。","example":"Stream.of(\"a\",\"b\").toArray(String[]::new)","trap":"无参版本为Object[]；工厂类型需兼容。","fr":"Collecter dans un tableau","level":"extra","src":["AStream"]},{"id":"api123","group":"IntStream","title":"range / rangeClosed","signature":"static IntStream range(int start,int end) / rangeClosed(int start,int end)","meaning":"分别为[start,end)和[start,end]；start>end为空。","example":"IntStream.range(1,4).toArray() // [1,2,3]","trap":"range最后一个参数不包含。","fr":"Générer une plage d’entiers","level":"core","src":["AIntStream"]},{"id":"api124","group":"IntStream","title":"sum / average / max","signature":"int sum() / OptionalDouble average() / OptionalInt max()","meaning":"数值终端运算；空sum为0，平均/极值empty。","example":"IntStream.of(1,2,3).average().orElseThrow() // 2.0","trap":"sum是int可溢出，必要时asLongStream().sum()。","fr":"Statistiques numériques","level":"extra","src":["AIntStream"]},{"id":"api125","group":"IntStream","title":"boxed / mapToObj","signature":"Stream<Integer> boxed() / <U> Stream<U> mapToObj(IntFunction<? extends U> f)","meaning":"装箱为对象流或映射为其它对象流。","example":"IntStream.range(0,3).boxed().toList() // [0,1,2]","trap":"IntStream本身的collect签名与对象Stream不同。","fr":"Passer aux objets","level":"extra","src":["AIntStream"]},{"id":"api126","group":"Collectors","title":"toList / toSet","signature":"static <T> Collector<...> toList() / toSet()","meaning":"产生收集器；toSet不保证顺序或具体类型。","example":"xs.stream().collect(Collectors.toSet())","trap":"toList不保证可修改性，明确需要可变时用toCollection。","fr":"Collecteurs de base","level":"core","src":["ACollectors"]},{"id":"api127","group":"Collectors","title":"toCollection","signature":"static <T,C extends Collection<T>> Collector<T,?,C> toCollection(Supplier<C> f)","meaning":"工厂指定结果集合实现。","example":"xs.stream().collect(Collectors.toCollection(LinkedHashSet::new))","trap":"集合自身的重复/顺序规则决定结果。","fr":"Choisir l’implémentation du résultat","level":"extra","src":["ACollectors"]},{"id":"api128","group":"Collectors","title":"groupingBy","signature":"static <T,K> Collector<T,?,Map<K,List<T>>> groupingBy(Function<? super T,? extends K> f)","meaning":"按分类键分组，下游可进一步统计。","example":"mots.stream().collect(Collectors.groupingBy(String::length))","trap":"默认结果Map的顺序无保证；不应依赖null分类键可接受。","fr":"Regrouper par clé","level":"core","src":["ACollectors"]},{"id":"api129","group":"Collectors","title":"toMap","signature":"static <T,K,U> Collector<...> toMap(keyMapper,valueMapper[,mergeFunction])","meaning":"把元素映射为键值；无合并函数时重复键异常。","example":"mots.stream().collect(Collectors.toMap(s->s,s->1,Integer::sum))","trap":"不是自动“最后一个覆盖”；结果值应避免null。","fr":"Construire une table d’associations","level":"core","src":["ACollectors"]},{"id":"api130","group":"Collectors","title":"counting / summingInt / averagingDouble","signature":"static <T> Collector<...> counting() / summingInt(ToIntFunction) / averagingDouble(ToDoubleFunction)","meaning":"下游统计，counting结果Long；空平均收集器返回0.0。","example":"mots.stream().collect(Collectors.groupingBy(String::length,Collectors.counting()))","trap":"averagingDouble与IntStream.average的空值契约不同。","fr":"Calculer des statistiques de groupe","level":"extra","src":["ACollectors"]},{"id":"api131","group":"Collectors","title":"joining","signature":"static Collector<CharSequence,?,String> joining(String sep,String prefix,String suffix)","meaning":"以分隔符和前后缀连接文本元素。","example":"Stream.of(\"a\",\"b\").collect(Collectors.joining(\",\",\"{\",\"}\")) // {a,b}","trap":"不是任意对象流直接可用；先map到String。","fr":"Joindre des chaînes","level":"extra","src":["ACollectors"]},{"id":"api132","group":"Collectors","title":"mapping / partitioningBy","signature":"static Collector<...> mapping(mapper,downstream) / partitioningBy(predicate)","meaning":"mapping转换后交下游；partitioningBy按true/false分两组。","example":"mots.stream().collect(Collectors.partitioningBy(s->s.length()>3))","trap":"groupingBy键可任意类型，partitioningBy固定Boolean。","fr":"Transformer les groupes ou partitionner","level":"extra","src":["ACollectors"]},{"id":"api133","group":"Optional","title":"of / ofNullable / empty","signature":"static <T> Optional<T> of(T x) / ofNullable(T x) / empty()","meaning":"of要求非null；ofNullable将null转empty。","example":"Optional.ofNullable(null).isEmpty() // true","trap":"Optional本身不该用null代表empty。","fr":"Construire une valeur optionnelle","level":"extra","src":["AOptional"]},{"id":"api134","group":"Optional","title":"isPresent / isEmpty / ifPresent","signature":"boolean isPresent() / isEmpty() / void ifPresent(Consumer<? super T> c)","meaning":"检查存在性/缺失，或仅在有值时执行。","example":"Optional.of(3).ifPresent(System.out::println);","trap":"ifPresent返回void，不能当转换后的值。","fr":"Tester ou consommer la présence","level":"extra","src":["AOptional"]},{"id":"api135","group":"Optional","title":"orElse / orElseGet","signature":"T orElse(T other) / T orElseGet(Supplier<? extends T> supplier)","meaning":"默认值/惰性生成默认值。","example":"Optional.of(3).orElseGet(()->99) // 3，不调用lambda","trap":"orElse(expensive())仍会先执行实参求值。","fr":"Fournir un résultat de remplacement","level":"extra","src":["AOptional"]},{"id":"api136","group":"Optional","title":"get / orElseThrow","signature":"T get() / T orElseThrow()","meaning":"有值时返回，无值时抛NoSuchElementException；orElseThrow有自定义异常工厂重载。","example":"Optional.<Integer>empty().orElseThrow() // 异常","trap":"不是安全无条件读取API。","fr":"Extraire ou signaler l’absence","level":"extra","src":["AOptional"]},{"id":"api137","group":"Optional","title":"map / flatMap / filter","signature":"<U> Optional<U> map(Function) / flatMap(Function) / Optional<T> filter(Predicate)","meaning":"有值才转换/过滤；flatMap消除嵌套Optional。","example":"Optional.of(\"abc\").map(String::length).orElse(0) // 3","trap":"map结果null转empty；flatMap函数应返回非null Optional。","fr":"Transformer une valeur optionnelle","level":"extra","src":["AOptional"]},{"id":"api138","group":"Files","title":"lines","signature":"static Stream<String> lines(Path path)","meaning":"读取文本行的资源流；默认UTF-8，需关闭，可能I/O异常。","example":"try(var lignes=Files.lines(Path.of(\"data.txt\"))){ long n=lignes.count(); }","trap":"代码需处理/声明IOException；消费流不代替关闭资源。","fr":"Lire un fichier sous forme de flux","level":"core","src":["AFiles"]},{"id":"api139","group":"Files","title":"readString / writeString","signature":"static String readString(Path) / Path writeString(Path,CharSequence,...)","meaning":"Java11+，读全部文本或写文本；默认UTF-8，可能I/O异常。","example":"String texte=Files.readString(Path.of(\"data.txt\"));","trap":"大文件全读会占内存；默认写入可能覆盖文件。","fr":"Lire ou écrire du texte","level":"extra","src":["AFiles"]}],"vocabulary":[{"id":"v1","group":"题目指令","fr":"écrire / programmer","zh":"编写程序","usage":"Écrire une méthode qui retourne le maximum
