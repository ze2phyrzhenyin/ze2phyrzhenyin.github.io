，再扩大转换为double的2.0。","src":["C6","J4","J5","J15"]},{"id":"q05","kind":"output","lesson":"conversion","chapter":"basics","title":"输出是什么？","fr":"Qu’affiche ce fragment ?","code":"System.out.println((double) 5 / 2);","options":["2","2.0","2.5","编译错误"],"correct":[2],"explanation":"强转发生在除法前，表达式以double计算。","src":["C6","J4","J5","J15"]},{"id":"q06","kind":"output","lesson":"conversion","chapter":"basics","title":"复合赋值有什么结果？","fr":"Quel est le résultat de l’affectation composée ?","code":"byte b = 127;\nb += 1;\nSystem.out.println(b);","options":["128","-128","编译错误","ArithmeticException"],"correct":[1],"explanation":"b+=1包含缩小转换，byte范围−128..127，因此结果回绕为−128。b=b+1则是不同的编译结论。","src":["C6","J4","J5","J15"]},{"id":"q07","kind":"output","lesson":"operators","chapter":"basics","title":"注意字符串拼接顺序。","fr":"Attention à l’ordre de concaténation.","code":"System.out.println(1 + 2 + \"x\" + 3 + 4);","options":["3x7","12x34","3x34","编译错误"],"correct":[2],"explanation":"从左向右：1+2先数值相加得到3，然后出现String，后面3与4按文本拼接。","src":["C6","J4","J15"]},{"id":"q08","kind":"output","lesson":"operators","chapter":"basics","title":"前置和后置自增。","fr":"Pré-incrémentation et post-incrémentation.","code":"int i = 2;\nint r = i++ + ++i;\nSystem.out.println(r + \":\" + i);","options":["5:4","6:4","5:3","6:3"],"correct":[1],"explanation":"左操作数先产生2，i变3；右操作数先把i变4并产生4；r=6，最终i=4。","src":["C6","J4","J15"]},{"id":"q09","kind":"output","lesson":"shortcircuit","chapter":"basics","title":"此代码会抛出异常吗？","fr":"Ce fragment lève-t-il une exception ?","code":"String s = null;\nSystem.out.println(s != null && s.length() > 0);","options":["true","false","NullPointerException","编译错误"],"correct":[1],"explanation":"&&左侧已经false，右侧不求值，所以不调用null的length。","src":["C6","J4","J15"]},{"id":"q10","kind":"output","lesson":"shortcircuit","chapter":"basics","title":"把&&换成&。","fr":"Que change l’opérateur & ?","code":"String s = null;\nSystem.out.println(s != null & s.length() > 0);","options":["true","false","NullPointerException","编译错误"],"correct":[2],"explanation":"布尔&不短路，右侧仍调用s.length()，在println完成前抛NPE。","src":["C6","J4","J15"]},{"id":"q11","kind":"output","lesson":"wrappers","chapter":"basics","title":"拆箱的风险。","fr":"Quel est le risque de l’unboxing (déballage automatique) ?","code":"Integer x = null;\nint y = x;\nSystem.out.println(y);","options":["0","null","编译错误","NullPointerException"],"correct":[3],"explanation":"Integer到int需要拆箱，不能对null调用intValue。","src":["C2","J5","AInteger","AObjects"]},{"id":"q12","kind":"qcm","lesson":"packages","chapter":"basics","title":"import java.util.*带来什么？","fr":"Que permet import java.util.* ?","code":"","options":["自动导入java.util.stream.Stream","可简写可访问的java.util类型名称","导入java.util.function.Predicate","使所有私有成员可访问"],"correct":[1],"explanation":"通配符不递归导入子包，也不会改变访问控制。","src":["C1","C6","J7"]},{"id":"q13","kind":"qcm","lesson":"switch","chapter":"control","title":"关于两种switch写法，正确的是？","fr":"Quelles affirmations sur switch sont correctes ?","code":"","options":["case x ->不会自然落入下一分支","case x:没有break时可能贯穿","switch表达式的块可用yield返回值","每个switch语句必须有default才能编译"],"correct":[0,1,2],"explanation":"箭头标签不贯穿；冒号标签可能贯穿；yield给switch表达式产生值。普通switch语句并非一概强制default。","src":["C6","J14"]},{"id":"q14","kind":"output","lesson":"switch","chapter":"control","title":"传统switch的贯穿。","fr":"Chute dans le cas suivant avec un switch classique.","code":"int x = 1;\nint r = 0;\nswitch (x) {\n  case 1: r += 2;\n  case 2: r += 3; break;\n  default: r = 9;\n}\nSystem.out.println(r);","options":["2","3","5","9"],"correct":[2],"explanation":"从case1进入，未break，继续case2得到5，然后break。","src":["C6","J14"]},{"id":"q15","kind":"output","lesson":"loops","chapter":"control","title":"for循环计数。","fr":"Combien d’itérations sont effectuées ?","code":"int s = 0;\nfor (int i=0; i<4; i++) s += i;\nSystem.out.println(s);","options":["4","6","10","无限循环"],"correct":[1],"explanation":"i依次0、1、2、3，累加得到6；i=4不进入循环体。","src":["C6","J14"]},{"id":"q16","kind":"output","lesson":"jumps","chapter":"control","title":"continue作用于哪一轮？","fr":"Quel est l’effet de continue ?","code":"int s = 0;\nfor (int i=1; i<=4; i++) {\n  if (i == 2) continue;\n  s += i;\n}\nSystem.out.println(s);","options":["1","3","8","10"],"correct":[2],"explanation":"跳过i=2的剩余循环体，for仍进行更新，求和1+3+4=8。","src":["C6","J14"]},{"id":"q17","kind":"qcm","lesson":"loops","chapter":"control","title":"哪种循环至少执行一次循环体？","fr":"Quelle boucle exécute son corps au moins une fois ?","code":"","options":["while","for","do...while","增强for"],"correct":[2],"explanation":"do...while先执行循环体，再检查条件；其他三种在条件不满足或容器为空时可执行零次。","src":["C6","J14"]},{"id":"q18","kind":"qcm","lesson":"jumps","chapter":"control","title":"void方法中哪些用法合法？","fr":"Quelles utilisations sont légales dans une méthode void ?","code":"","options":["return;","return 0;","完全没有return","return null;"],"correct":[0,2],"explanation":"void可以提前return;，也可正常运行到末尾，不能返回值。","src":["C6","J14"]},{"id":"q19","kind":"output","lesson":"arraybasics","chapter":"arrays","title":"数组元素的默认值。","fr":"Quelle est la valeur initiale d’un élément ?","code":"String[] a = new String[2];\nSystem.out.println(a[1]);","options":["空字符串","null","编译错误","ArrayIndexOutOfBoundsException"],"correct":[1],"explanation":"引用数组的元素默认null；println(String)能显示文本null。","src":["C6","C0","J10","AString","AArrays"]},{"id":"q20","kind":"output","lesson":"aliases","chapter":"arrays","title":"数组赋值会复制内容吗？","fr":"L’affectation copie-t-elle les éléments ?","code":"int[] a = {1,2};\nint[] b = a;\nb[0] = 9;\nSystem.out.println(a[0]);","options":["1","2","9","编译错误"],"correct":[2],"explanation":"a和b引用同一个数组，改b[0]也改变从a观察到的元素。","src":["C6","C0","J10","AString","AArrays"]},{"id":"q21","kind":"output","lesson":"aliases","chapter":"arrays","title":"Arrays.copyOf的作用。","fr":"Quel est l’effet de Arrays.copyOf ?","code":"int[] a = {1,2};\nint[] b = java.util.Arrays.copyOf(a, a.length);\nb[0] = 9;\nSystem.out.println(a[0]);","options":["1","9","null","编译错误"],"correct":[0],"explanation":"对int[]复制后得到独立元素存储；引用元素数组的复制则仍共享内部对象。","src":["C6","C0","J10","AString","AArrays"]},{"id":"q22","kind":"output","lesson":"matrix","chapter":"arrays","title":"二维数组的长度。","fr":"Quelles sont les longueurs du tableau et d’une ligne ?","code":"int[][] a = {{1,2},{3}};\nSystem.out.println(a.length + \":\" + a[1].length);","options":["2:2","2:1","3:1","编译错误"],"correct":[1],"explanation":"Java二维数组是数组的数组；外层2行，第二行1元素，允许不等长。","src":["C6","C0","J10","AString","AArrays"]},{"id":"q23","kind":"output","lesson":"arraybasics","chapter":"arrays","title":"增强for给变量赋值。","fr":"Réaffecter la variable d’une boucle for-each.","code":"int[] a = {1,2};\nfor (int x : a) x = 7;\nSystem.out.println(java.util.Arrays.toString(a));","options":["[7, 7]","[1, 2]","[7, 2]","编译错误"],"correct":[1],"explanation":"x是每轮获得的元素值副本，赋值x不会给a的对应槽位赋值。","src":["C6","C0","J10","AString","AArrays"]},{"id":"q24","kind":"output","lesson":"strings","chapter":"arrays","title":"字符串相等性。","fr":"Identité ou égalité de contenu ?","code":"String a = new String(\"java\");\nString b = new String(\"java\");\nSystem.out.println((a == b) + \":\" + a.equals(b));","options":["true:true","false:true","false:false","true:false"],"correct":[1],"explanation":"两个new产生不同对象，因此==false；String.equals按内容比较，为true。","src":["C6","C0","J10","AString","AArrays"]},{"id":"q25","kind":"output","lesson":"strings","chapter":"arrays","title":"不可变对象与被忽略的返回值。","fr":"Objet immuable et valeur de retour ignorée.","code":"String s = \"java\";\ns.toUpperCase(java.util.Locale.ROOT);\nSystem.out.println(s);","options":["JAVA","java","Java","编译错误"],"correct":[1],"explanation":"toUpperCase返回结果但不改变原String；没有把结果重新赋给s。","src":["C6","C0","J10","AString","AArrays"]},{"id":"q26","kind":"output","lesson":"strings","chapter":"arrays","title":"substring右端是否包含？","fr":"La borne supérieure de substring est-elle incluse ?","code":"System.out.println(\"abcdef\".substring(1, 4));","options":["abcd","bcd","bcde","abc"],"correct":[1],"explanation":"取下标1、2、3，右端4不包含，因此bcd。","src":["C6","C0","J10","AString","AArrays"]},{"id":"q27","kind":"qcm","lesson":"arraytools","chapter":"arrays","title":"下列哪些调用会修改传入数组a？","fr":"Quels appels modifient le tableau a ?","code":"int[] a = {3,1,2};","options":["java.util.Arrays.sort(a)","java.util.Arrays.toString(a)","java.util.Arrays.copyOf(a, a.length)","java.util.Arrays.fill(a, 0)"],"correct":[0,3],"explanation":"sort就地排序，fill就地填充；toString只返回描述，copyOf返回新数组。","src":["C6","C0","J10","AString","AArrays"]},{"id":"q28","kind":"qcm","lesson":"signature","chapter":"methods","title":"哪些差异可用于重载（忽略泛型擦除）？","fr":"Quelles différences permettent une surcharge, hors effacement générique ?","code":"","options":["只有返回类型不同","参数数量不同","参数类型序列不同","只有参数名称不同"],"correct":[1,2],"explanation":"常规重载依据方法名和参数类型序列，不以返回类型、参数名或访问修饰符单独区分。","src":["C1","C6","J8","J15"]},{"id":"q29","kind":"output","lesson":"passvalue","chapter":"methods","title":"基本类型参数会反向修改调用方吗？","fr":"Un paramètre primitif modifie-t-il la variable de l’appelant ?","code":"static void change(int x) { x = 9; }\n// Dans main :\nint a = 2;\nchange(a);\nSystem.out.println(a);","options":["2","9","0","编译错误"],"correct":[0],"explanation":"传递a值的副本，给形参x赋值不会修改调用方局部变量a。方法声明应放在类体。","src":["C6","J15"]},{"id":"q30","kind":"output","lesson":"passvalue","chapter":"methods","title":"对象引用也是按值传递。","fr":"Les références sont également passées par valeur.","code":"static void change(int[] x) {\n  x[0] = 9;\n  x = new int[]{7};\n}\n// Dans main :\nint[] a = {1};\nchange(a);\nSystem.out.println(a[0]);","options":["1","7","9","编译错误"],"correct":[2],"explanation":"第一次通过引用副本改共享数组为9；随后只重绑形参x，对调用方a无影响。","src":["C6","J15"]},{"id":"q31","kind":"qcm","lesson":"overload","chapter":"methods","title":"选择哪一个Math.min重载？","fr":"Quel résultat produit Math.min ?","code":"Math.min(6, 10.5)","options":["int 6","double 6.0","double 10.5","编译错误"],"correct":[1],"explanation":"6扩大为double，调用min(double,double)，返回double6.0。","src":["C0","C1","J8","J15","AMath"]},{"id":"q32","kind":"qcm","lesson":"recursion","chapter":"methods","title":"递归正确终止需要什么？","fr":"Quelles conditions sont nécessaires pour assurer la terminaison ici ?","code":"","options":["有可达的基本情形","递归调用向基本情形推进","所有方法都必须返回1","方法名必须含recursive"],"correct":[0,1],"explanation":"基本情形存在还不够，调用必须在有限步内到达。返回值与名字不是终止保证。","src":["C1","C6","J8","J15"]},{"id":"q33","kind":"output","lesson":"recursion","chapter":"methods","title":"跟踪递归返回值。","fr":"Suivre les valeurs retournées par la récursion.","code":"static int f(int n) {\n  return n == 0 ? 0 : n + f(n-1);\n}\n// Dans main :\nSystem.out.println(f(3));","options":["3","6","9","无限递归"],"correct":[1],"explanation":"f(3)=3+2+1+0=6。此函数需要n≥0；负数不满足终止条件。","src":["C1","C6","J8","J15"]},{"id":"q34","kind":"qcm","lesson":"complexity","chapter":"methods","title":"顺序扫描一个n元素数组的最坏时间。","fr":"Quelle est la complexité au pire d’une recherche séquentielle ?","code":"","options":["O(1)","O(log n)","O(n)","O(n²)"],"correct":[2],"explanation":"未找到时需要比较所有n元素，最坏O(n)，额外空间通常O(1)。","src":["C6","ASystem","AArrayList"]},{"id":"q35","kind":"qcm","lesson":"constructor","chapter":"objects","title":"声明了唯一有参构造器后，下面怎样？","fr":"Que se passe-t-il après la déclaration d’un unique constructeur paramétré ?","code":"class A { A(int n) {} }\n// Dans une méthode du même paquetage :\nA a = new A();","options":["合法且n=0","编译错误：没有无参构造器","运行时异常","自动调用A(0)"],"correct":[1],"explanation":"声明构造器后不再生成默认无参构造器；仍可自行增加A()。","src":["C0","C1","J8","AObject"]},{"id":"q36","kind":"qcm","lesson":"constructor","chapter":"objects","title":"哪一个真的是构造器？","fr":"Quelle déclaration est réellement un constructeur de A ?","code":"class A { /* ... */ }","options":["void A() {}","A() {}","static A() {}","int A() { return 0; }"],"correct":[1],"explanation":"构造器与类同名且没有返回类型，不可static；void A()是普通方法。","src":["C0","C1","J8","AObject"]},{"id":"q37","kind":"qcm","lesson":"visibility","chapter":"objects","title":"关于private，正确的是？","fr":"Quelle affirmation sur private est correcte ?","code":"","options":["任意同包类型都能访问private字段","private字段不会破坏通过公开方法进行受控访问","导入该类后private自动变public","子类总能直接访问父类private字段"],"correct":[1],"explanation":"private限制直接访问，公开方法仍可提供经过验证的行为；包、import、继承不自动开放private。","src":["C1","J6"]},{"id":"q38","kind":"qcm","lesson":"encapsulation","chapter":"objects","title":"哪些设计有助于保护内部double[]？","fr":"Quelles décisions protègent un tableau interne de double ?","code":"","options":["构造器复制传入数组","getter返回内部数组原引用","getter返回数组副本","只加final便不需复制"],"correct":[0,2],"explanation":"双向防御性复制既防止外部继续修改入参数组，也防止从getter拿到内部引用；final只禁止重绑引用。","src":["C0","C1","J8","AObject"]},{"id":"q39","kind":"output","lesson":"final","chapter":"objects","title":"final引用意味着什么？","fr":"Que signifie final pour une référence ?","code":"final int[] a = {1};\na[0] = 7;\nSystem.out.println(a[0]);","options":["1","7","编译错误","UnsupportedOperationException"],"correct":[1],"explanation":"a不能改指向另一个数组，但数组元素仍可修改。","src":["C0","C1","J8","AObject"]},{"id":"q40","kind":"qcm","lesson":"static","chapter":"objects","title":"static方法中哪些情况允许？","fr":"Quelles opérations sont autorisées dans une méthode static ?","code":"class A { int x; static int y; }","options":["不提供对象就直接访问x","通过A对象引用访问其可访问字段x","直接访问y","使用this.x"],"correct":[1,2],"explanation":"static上下文没有this，不能无对象地访问实例字段；显式对象引用访问是合法的。","src":["C0","C1","J8","AObject"]},{"id":"q41","kind":"output","lesson":"static","chapter":"objects","title":"类变量被几个对象共享？","fr":"Combien de valeurs possède ce champ de classe ?","code":"class A { static int n=0; A(){ n++; } }\n// Dans main :\nnew A(); new A();\nSystem.out.println(A.n);","options":["0","1","2","编译错误"],"correct":[2],"explanation":"n是类变量，两次构造累加的是同一个n。","src":["C0","C1","J8","AObject"]},{"id":"q42","kind":"qcm","lesson":"equals","chapter":"objects","title":"equals的正确重写签名。","fr":"Quelle signature redéfinit correctement equals ?","code":"","options":["boolean equals(A other)","public boolean equals(Object other)","public static boolean equals(Object other)","public int equals(Object other)"],"correct":[1],"explanation":"必须与Object.equals(Object)匹配；equals(A)通常只是重载，不是重写该契约。","src":["C0","C1","J8","AObject"]},{"id":"q43","kind":"qcm","lesson":"hashcode","chapter":"objects","title":"equals/hashCode必须满足哪些关系？","fr":"Quelles relations le contrat impose-t-il ?","code":"","options":["equals为true则hashCode相同","hashCode相同则equals必为true","hashCode不同则equals不能为true","任何两个不同对象都必须有不同hashCode"],"correct":[0,2],"explanation":"相等必同哈希；反过来相同哈希可能是碰撞。不同哈希可推出不相等，但依赖正确实现契约。","src":["C0","C1","J8","AObject"]},{"id":"q44","kind":"qcm","lesson":"polynomial","chapter":"objects","title":"多项式[1,2]和[1,2,0]代表相同值时，如何设计？","fr":"Comment traiter deux représentations du même polynôme ?","code":"","options":["只比较数组长度即可","先明确数学相等语义并做规范化，再一致实现equals/hashCode","只改equals，不改hashCode","必须按对象地址区分"],"correct":[1],"explanation":"根据约定删除高次零系数等，再用规范形式比较和散列；不能只依赖自动生成的数组长度/引用比较。","src":["C0","AObject","AArrays"]},{"id":"q45","kind":"qcm","lesson":"final","chapter":"objects","title":"final用于方法和类的含义。","fr":"Quel est l’effet de final sur une méthode et une classe ?","code":"","options":["final实例方法不能被子类重写","final类不能被继承","final类的所有字段都自动不可变","final方法不能被调用"],"correct":[0,1],"explanation":"禁止重写/继承不等于整个对象深度不可变，也不禁止调用。","src":["C0","C1","J8","AObject"]},{"id":"q46","kind":"qcm","lesson":"genericterms","chapter":"generics","title":"在Paire<String>中，String叫什么？","fr":"Comment nomme-t-on String dans Paire<String> ?","code":"","options":["un paramètre de type","un argument de type","un type brut","une méthode générique"],"correct":[1],"explanation":"Paire<T>声明中的T是paramètre de type；使用Paire<String>时String是argument de type。","src":["C2","J4","J8"]},{"id":"q47","kind":"qcm","lesson":"genericterms","chapter":"generics","title":"哪一个是原始类型用法？","fr":"Quel exemple utilise un type brut ?","code":"","options":["Paire<String> p;","Paire<?> p;","Paire p;","Paire<Integer> p;"],"correct":[2],"explanation":"Paire省略泛型实参是type brut；Paire<?>是通配参数化类型，不是原始类型。","src":["C2","J4","J8"]},{"id":"q48","kind":"qcm","lesson":"genericwhy","chapter":"generics","title":"哪些类型实参合法？","fr":"Quels arguments de type sont légaux ?","code":"","options":["Paire<int>","Paire<Integer>","Paire<int[]>","Paire<String>"],"correct":[1,2,3],"explanation":"泛型实参必须是引用类型；Integer、String和int[]数组都是引用类型，int不是。","src":["C2","J4","J8"]},{"id":"q49","kind":"qcm","lesson":"genericmethods","chapter":"generics","title":"哪一个是合法的泛型静态方法？","fr":"Quelle déclaration de méthode générique est correcte ?","code":"","options":["public static T id(T x) { return x; }（非泛型类内）","public static <T> T id(T x) { return x; }","public <T> static T id(T x) { return x; }","public static T<T> id(T x) { return x; }"],"correct":[1],"explanation":"方法自有的<T>写在修饰符之后、返回类型之前。","src":["C2","J4","J8"]},{"id":"q50","kind":"qcm","lesson":"genericarrays","chapter":"generics","title":"在class Boite<T>中，哪些写法可以编译？","fr":"Quelles écritures compilent dans class Boite<T> ?","code":"","options":["T[] a;","new T[10]","new T()","T x;"],"correct":[0,3],"explanation":"声明T变量或T[]引用合法；由于运行时类型信息等限制，不能直接new T或new T[]。","src":["C2","J4","J8"]},{"id":"q51","kind":"qcm","lesson":"erasure","chapter":"generics","title":"这两个方法为什么不能并存？","fr":"Pourquoi ces deux méthodes ne peuvent-elles pas coexister ?","code":"void f(java.util.List<String> a) {}\nvoid f(java.util.List<Integer> a) {}","options":["参数名相同","类型擦除后签名冲突","List不能当参数","返回void禁止重载"],"correct":[1],"explanation":"两者擦除后参数类型都是List，不能仅靠不同泛型实参重载。","src":["C2","J4","J8","J15"]},{"id":"q52","kind":"qcm","lesson":"genericwhy","chapter":"generics","title":"泛型是否协变？","fr":"Les types génériques sont-ils covariants ici ?","code":"java.util.List<Integer> a = new java.util.ArrayList<>();\njava.util.List<Number> b = a;","options":["合法，Integer是Number子类","编译错误，List<Integer>不是List<Number>子类","只能运行时检测","自动复制并转换所有元素"],"correct":[1],"explanation":"Java泛型通常不变；需要只读上界视角时可考虑List<? extends Number>。","src":["C2","J4","J8"]},{"id":"q53","kind":"qcm","lesson":"bounds","chapter":"generics","title":"读取上界通配符。","fr":"Que peut-on lire et ajouter avec une borne supérieure ?","code":"java.util.List<? extends Number> a = java.util.List.of(1,2);","options":["可将get(0)赋给Number","可安全add(Integer.valueOf(3))","未知具体元素类型，不能这样添加Integer","只能读取Object，不能读取Number"],"correct":[0,2],"explanation":"元素某个未知Number子类型，读取至少可当Number；不能断定它恰是Integer容器，因此add(3)编译失败。","src":["J4","J8","AList"]},{"id":"q54","kind":"qcm","lesson":"linkedmodel","chapter":"generics","title":"删除单链表唯一一个元素后，哪些状态必须成立？","fr":"Après la suppression de l’unique élément, quels invariants maintenir ?","code":"","options":["head为null","tail为null","size为0（若维护size）","tail继续指向已删除元素最好"],"correct":[0,1,2],"explanation":"空表头尾应一致，size应0。课件实现漏清tail，修正版修复此不变量。","src":["C2"]},{"id":"q55","kind":"qcm","lesson":"abstract","chapter":"inheritance","title":"抽象类能做什么？","fr":"Qu’est-ce qui est possible pour une classe abstraite ?","code":"","options":["声明构造器","完全没有抽象方法","直接new该抽象类","作为变量的声明类型"],"correct":[0,1,3],"explanation":"abstract类可有构造器，也可没有abstract方法，可作声明类型；不能直接实例化该抽象类。","src":["C3","J8","J9"]},{"id":"q56","kind":"qcm","lesson":"inherit","chapter":"inheritance","title":"关于继承，正确的是？","fr":"Quelles affirmations sur l’héritage sont correctes ?","code":"","options":["一个类只能直接extends一个类","子类继承父类所有构造器","一个类可以implements多个接口","子类可调用可访问的super构造器"],"correct":[0,2,3],"explanation":"构造器不继承；单类继承与多接口实现并存。","src":["C3","J8","J9"]},{"id":"q57","kind":"output","lesson":"dispatch","chapter":"inheritance","title":"实例方法使用哪个实现？","fr":"Quelle implémentation de méthode d’instance est appelée ?","code":"class A { String f(){ return \"A\"; } }\nclass B extends A { @Override String f(){ return \"B\"; } }\n// Dans main :\nA x = new B();\nSystem.out.println(x.f());","options":["A","B","编译错误","随机"],"correct":[1],"explanation":"引用静态类型A允许调用f；运行时实际对象B决定重写实例方法的实现。","src":["C3","J8","J9"]},{"id":"q58","kind":"output","lesson":"dispatch","chapter":"inheritance","title":"字段隐藏不是动态分派。","fr":"Le masquage d’un champ n’est pas une liaison dynamique.","code":"class A { int x=1; }\nclass B extends A { int x=2; }\n// Dans main :\nA a = new B();\nSystem.out.println(a.x);","options":["1","2","编译错误","ClassCastException"],"correct":[0],"explanation":"字段访问按引用静态类型选择，a类型A所以取A.x。","src":["C3","J8","J9"]},{"id":"q59","kind":"qcm","lesson":"override","chapter":"inheritance","title":"重写实例方法必须遵守什么？","fr":"Quelles règles faut-il respecter pour redéfinir une méthode d’instance ?","code":"","options":["不缩小访问权限","可任意增加受检异常","引用返回类型可协变","可以重写final方法"],"correct":[0,2],"explanation":"重写不能降低可见性，受检异常不能随意扩大；返回类型允许合法协变，final禁止重写。","src":["C3","J8","J9"]},{"id":"q60","kind":"output","lesson":"casting","chapter":"inheritance","title":"转换不会改变实际对象。","fr":"Un transtypage ne change pas l’objet réel.","code":"class A {}\nclass B extends A {}\n// Dans main :\nA a = new A();\nB b = (B) a;","options":["安全变成B对象","编译错误","ClassCastException","b为null"],"correct":[2],"explanation":"静态允许该强转，但真实对象只是A，不是B，运行时转换失败。","src":["C3","J8","J9"]},{"id":"q61","kind":"qcm","lesson":"interfaces","chapter":"inheritance","title":"Java21接口中允许哪些成员？","fr":"Quels membres une interface Java 21 peut-elle déclarer ?","code":"","options":["default方法","static方法","private辅助方法","普通可变实例字段"],"correct":[0,1,2],"explanation":"接口可有这些方法，但其字段隐含public static final，不提供普通可变实例字段。","src":["C3","J8","J9"]},{"id":"q62","kind":"qcm","lesson":"functionalinterface","chapter":"functional","title":"增加哪种成员不会直接破坏函数式接口身份？","fr":"Quels ajouts ne créent pas une deuxième méthode abstraite ?","code":"@FunctionalInterface\ninterface F { int apply(int x); }","options":["default int twice(int x) { return 2*x; }","static int zero() { return 0; }","int other(int x);","boolean equals(Object o);"],"correct":[0,1,3],"explanation":"default/static不计抽象方法；与Object公共方法等价的equals不计入函数式接口的抽象契约。另加无关other会破坏。","src":["C4","J9","J15","AFunctions"]},{"id":"q63","kind":"qcm","lesson":"listusage","chapter":"collections","title":"删除Integer的哪一个重载？","fr":"Quelle surcharge de remove est appelée ?","code":"java.util.List<Integer> a = new java.util.ArrayList<>(java.util.List.of(10,20,30));\na.remove(1);","options":["删值1，没有变化","删下标1的20","删第一个10","编译错误"],"correct":[1],"explanation":"int实参1优先选择remove(int index)。按值删除应传Integer对象，例如remove(Integer.valueOf(20))。","src":["AList","AArrayList"]},{"id":"q64","kind":"qcm","lesson":"immutablelists","chapter":"collections","title":"Arrays.asList的结果能做什么？","fr":"Quelles opérations sont possibles sur Arrays.asList ?","code":"String[] a = {\"a\",\"b\"};\njava.util.List<String> l = java.util.Arrays.asList(a);","options":["l.set(0,\"x\")并反映到a[0]","l.add(\"c\")扩容","l.remove(0)缩容","读取l.get(0)"],"correct":[0,3],"explanation":"返回由数组支撑的固定大小列表；可set已有位置，但不支持改变大小的add/remove。","src":["AList","ACollections","AArrays","AStream","ACollectors"]},{"id":"q65","kind":"qcm","lesson":"immutablelists","chapter":"collections","title":"List.of是什么性质？","fr":"Quelles propriétés caractérisent List.of ?","code":"","options":["不可修改列表结构和槽位","允许null元素","所有内部对象自动深度不可变","创建时遇到null会抛NullPointerException"],"correct":[0,3],"explanation":"List.of不允许修改，也拒绝null，但不会冻结其中可变对象的内部状态。","src":["AList","ACollections","AArrays","AStream","ACollectors"]},{"id":"q66","kind":"output","lesson":"setmap","chapter":"collections","title":"Map重复键的行为。","fr":"Que se passe-t-il lorsqu’une clé est réutilisée ?","code":"java.util.Map<String,Integer> m = new java.util.HashMap<>();\nm.put(\"a\",1);\nm.put(\"a\",2);\nSystem.out.println(m.size()+\":\"+m.get(\"a\"));","options":["2:1","2:2","1:2","IllegalStateException"],"correct":[2],"explanation":"Map每个键只有一个映射，put相同键替换旧值，size仍1。不同于无合并函数的Collectors.toMap重复键行为。","src":["AMap","AHashMap","ASet","AComparator"]},{"id":"q67","kind":"qcm","lesson":"choosecollection","chapter":"collections","title":"需要元素唯一且保留首次插入顺序，应选什么？","fr":"Quelle structure conserve l’unicité et l’ordre d’insertion ?","code":"","options":["HashSet","TreeSet","LinkedHashSet","ArrayList"],"correct":[2],"explanation":"LinkedHashSet同时保留插入顺序并去重；HashSet不承诺顺序，TreeSet按比较排序，ArrayList可重复。","src":["C6","C2","AList","ASet","AMap","ADeque"]},{"id":"q68","kind":"output","lesson":"deque","chapter":"collections","title":"FIFO队列的访问。","fr":"Ordre FIFO d’une file.","code":"java.util.Deque<Integer> q = new java.util.ArrayDeque<>();\nq.addLast(1); q.addLast(2);\nSystem.out.println(q.removeFirst());","options":["1","2","null","编译错误"],"correct":[0],"explanation":"尾部入队、头部出队，先进先出；同端push/pop则可实现栈。","src":["C2","ADeque","AArrayDeque"]},{"id":"q69","kind":"qcm","lesson":"comparison","chapter":"collections","title":"哪种整数比较更稳妥？","fr":"Quelle comparaison évite un débordement de soustraction ?","code":"","options":["(a,b) -> a-b","Integer::compare","(a,b) -> a==b ? 0 : 1","(a,b) -> 1"],"correct":[1],"explanation":"a-b可能溢出并破坏比较器契约。Integer.compare返回正确符号且不依赖溢出减法。","src":["C4","AComparator","AComparable"]},{"id":"q70","kind":"qcm","lesson":"fourfunctions","chapter":"functional","title":"输入T、返回boolean的标准接口。","fr":"Quelle interface prend T et retourne boolean ?","code":"","options":["Consumer<T>","Predicate<T>","Supplier<T>","Function<T,T>"],"correct":[1],"explanation":"Predicate<T>的抽象方法是boolean test(T)。","src":["C4","J9","J15","AFunctions"]},{"id":"q71","kind":"qcm","lesson":"fourfunctions","chapter":"functional","title":"四个方法名的对应。","fr":"Quelle correspondance est correcte ?","code":"","options":["Consumer.get / Supplier.accept","Function.test / Predicate.apply","Consumer.accept / Supplier.get","Function.accept / Predicate.get"],"correct":[2],"explanation":"必须背熟Consumer.accept、Predicate.test、Function.apply、Supplier.get。","src":["C4","J9","J15","AFunctions"]},{"id":"q72","kind":"output","lesson":"composition","chapter":"functional","title":"andThen先做哪一个？","fr":"Dans quel ordre andThen compose-t-il les fonctions ?","code":"java.util.function.Function<Integer,Integer> f = x -> x+1;\njava.util.function.Function<Integer,Integer> g = x -> x*2;\nSystem.out.println(f.andThen(g).apply(3));","options":["7","8","9","编译错误"],"correct":[1],"explanation":"先f(3)=4，再g(4)=8。","src":["C4","AFunction","APredicate","AConsumer"]},{"id":"q73","kind":"output","lesson":"composition","chapter":"functional","title":"compose先做哪一个？","fr":"Dans quel ordre compose compose-t-il les fonctions ?","code":"java.util.function.Function<Integer,Integer> f = x -> x+1;\njava.util.function.Function<Integer,Integer> g = x -> x*2;\nSystem.out.println(f.compose(g).apply(3));","options":["7","8","9","编译错误"],"correct":[0],"explanation":"f.compose(g)先g(3)=6，再f(6)=7。","src":["C4","AFunction","APredicate","AConsumer"]},{"id":"q74","kind":"qcm","lesson":"capture","chapter":"functional","title":"捕获的局部变量还可以重赋值吗？","fr":"Une variable locale capturée peut-elle être réaffectée ?","code":"int n = 2;\njava.util.function.IntUnaryOperator f = x -> x+n;\nn++;","options":["可以，f自动使用新n","可以，f使用旧n","编译错误：n不是effectively final","运行时异常"],"correct":[2],"explanation":"方法局部变量被Lambda捕获时必须final或事实上final。后面n++破坏该条件，整段不能编译。","src":["J4","J15"]},{"id":"q75","kind":"qcm","lesson":"references","chapter":"functional","title":"哪个方法引用等价于s -> s.length()？","fr":"Quelle référence équivaut à s -> s.length() ?","code":"java.util.function.Function<String,Integer> f = /* ... */;","options":["String::length","String.length()","s::length（s未声明）","String::new"],"correct":[0],"explanation":"String::length是未绑定实例方法引用，参数s作为接收对象。","src":["J15","AFunctions"]},{"id":"q76","kind":"output","lesson":"lazy","chapter":"streams","title":"没有终端操作时。","fr":"Que se passe-t-il en l’absence d’opération terminale ?","code":"java.util.stream.Stream.of(1,2,3)\n  .filter(x -> { System.out.print(x); return true; });","options":["输出123","输出1","没有输出","编译错误"],"correct":[2],"explanation":"只组装管道，中间filter的行为还未被终端操作驱动执行。","src":["C5","AStream","ACollectors"]},{"id":"q77","kind":"qcm","lesson":"pipeline","chapter":"streams","title":"同一个Stream能消费两次吗？","fr":"Peut-on consommer deux fois le même Stream ?","code":"var s = java.util.stream.Stream.of(1,2,3);\ns.count();\ns.count();","options":["返回两次3","第二次通常抛IllegalStateException","第二次返回0","编译错误"],"correct":[1],"explanation":"流一次性消费；此常规管道实现第二次count抛IllegalStateException。需要从source重新建立流。","src":["C5","AStream","ACollectors"]},{"id":"q78","kind":"output","lesson":"filtermap","chapter":"streams","title":"filter与map处理结果。","fr":"Quel est le résultat du pipeline ?","code":"var r = java.util.stream.Stream.of(1,2,3,4)\n  .filter(x -> x%2 == 0).map(x -> x*10).toList();\nSystem.out.println(r);","options":["[10, 20, 30, 40]","[2, 4]","[20, 40]","[10, 30]"],"correct":[2],"explanation":"filter先保留2和4；map将它们变20和40，toList消费结果。","src":["C5","AStream","ACollectors"]},{"id":"q79","kind":"qcm","lesson":"streamorder","chapter":"streams","title":"哪些是真正的短路操作？","fr":"Quelles opérations sont court-circuitantes ?","code":"","options":["limit(3)","skip(3)","findFirst()","allMatch(predicate)"],"correct":[0,2,3],"explanation":"limit短路中间操作；findFirst/allMatch短路终端操作；skip虽然丢前n个，但不是短路操作。","src":["C5","AStream","ACollectors"]},{"id":"q80","kind":"output","lesson":"terminal","chapter":"streams","title":"空流上的全称判断。","fr":"Quelle est la valeur de allMatch sur un flux vide ?","code":"System.out.println(java.util.stream.Stream.<Integer>empty()\n  .allMatch(x -> x>0));","options":["true","false","Optional.empty","异常"],"correct":[0],"explanation":"空集合上没有反例，所以allMatch为true；同样noneMatch为true，anyMatch为false。","src":["C5","AStream","ACollectors"]},{"id":"q81","kind":"output","lesson":"reduce","chapter":"streams","title":"没有初始值的reduce。","fr":"Quel résultat retourne reduce sans valeur initiale ?","code":"var r = java.util.stream.Stream.<Integer>empty().reduce(Integer::sum);\nSystem.out.println(r.isPresent());","options":["true","false","0","编译错误"],"correct":[1],"explanation":"无identity且空流返回Optional.empty，isPresent为false。","src":["C5","AStream","ACollectors"]},{"id":"q82","kind":"qcm","lesson":"reduce","chapter":"streams","title":"并行归约的运算性质。","fr":"Quelles propriétés conviennent à une réduction parallèle par somme ?","code":"","options":["加法中性元为0","组合运算应满足结合性","减法适合作为任意分组的归约操作","可以随意修改共享可变外部累加器"],"correct":[0,1],"explanation":"reduce依赖中性元和结合操作；减法不结合。浮点加法还存在舍入顺序差异，不能一概假设位级结果相同。","src":["C5","AStream","ACollectors"]},{"id":"q83","kind":"qcm","lesson":"collectors","chapter":"streams","title":"toMap的重复键问题。","fr":"Quel problème cause une clé dupliquée avec toMap sans fusion ?","code":"java.util.stream.Stream.of(\"a\",\"b\")\n .collect(java.util.stream.Collectors.toMap(String::length, x -> x));","o ams","title":"填写分组收集器名称。","fr":"Compléter le nom du collecteur de regroupement.","code":"var r = mots.stream().collect(java.util.stream.Collectors.____(String::length));","answers":["groupingBy"],"explanation":"groupingBy按分类函数分组，默认每组值是List。","src":["C5","AStream","ACollectors"]},{"id":"b18","kind":"blank","lesson":"recursion","chapter":"methods","title":"补全支持n=0的求和递归基本情形。","fr":"Compléter le cas de base de la somme pour n=0.","code":"static int somme(int n) { // précondition : 0<=n<=1000\n  if (n == 0) return ____;\n  return n + somme(n-1);\n}","answers":["0"],"explanation":"空的前0个正整数之和为0；基本情形不是1。","src":["C1","C6","J8","J15"]},{"id":"b19","kind":"blank","lesson":"comparison","chapter":"collections","title":"填入避免减法溢出的整数比较方法名。","fr":"Compléter la méthode de comparaison sûre des entiers.","code":"java.util.Comparator<Integer> c = Integer::____;","answers":["compare"],"explanation":"Integer.compare比较两个int，不用可能溢出的a-b。","src":["C4","AComparator","AComparable"]},{"id":"b20","kind":"blank","lesson":"linkedmodel","chapter":"generics","title":"删除唯一元素后补全tail值。","fr":"Compléter la nouvelle valeur de la queue après avoir vidé la liste.","code":"head = head.next;\nif (head == null) tail = ____;","answers":["null"],"explanation":"空表头尾均为null，维持不变量。","src":["C2"]},{"id":"w01","kind":"write","lesson":"switch","chapter":"control","title":"根据课件工资表实现calculSalaire。","fr":"Écrire calculSalaire(String grade, int anciennete), selon le tableau du cours. Retourner 0 pour une entrée invalide.","code":"// Unité : k€\n// Concepteur : 15,17,19 ; Ingénieur : 23,25,27 ; Développeur : 35,40,45\n// anciennete : 1,2,3\npublic static double calculSalaire(String grade, int anciennete) {\n    // Votre réponse\n}","algorithm":"salary","solution":"/** Retour en kEUR ; grade inconnu / anciennete invalide => 0. */\npublic static double calculSalaire(String grade, int anciennete) {\n    if (grade == null) return 0;\n    return switch (grade) {\n        case \"Concepteur\" -> switch (anciennete) {\n            case 1 -> 15; case 2 -> 17; case 3 -> 19; default -> 0;\n        };\n        case \"Ingénieur\" -> switch (anciennete) {\n            case 1 -> 23; case 2 -> 25; case 3 -> 27; default -> 0;\n        };\n        case \"Développeur\" -> switch (anciennete) {\n            case 1 -> 35; case 2 -> 40; case 3 -> 45; default -> 0;\n        };\n        default -> 0;\n    };\n}","criteria":["使用正确grade文本和1～3映射。","返回double数值而非只打印。","null/未知grade/非法年资按题意返回0。","箭头switch不贯穿，或传统switch正确break。"],"explanation":"先独立完成，再对照参考实现。允许等价正确解法；网站不在浏览器中编译或自动判定任意 Java 代码。","src":["C6","J14"]},{"id":"w02","kind":"write","lesson":"loops","chapter":"control","title":"实现完全数判断。","fr":"Écrire estParfait(int n). Un entier positif est parfait si la somme de ses diviseurs positifs stricts vaut n.","code":"public static boolean estParfait(int n) {\n    // Votre réponse\n}","algorithm":"perfect","solution":"public static boolean estParfait(int n) {\n    if (n <= 1) return false;\n    long somme = 1; // somme des diviseurs propres positifs\n    for (int d = 2; d <= n / d; d++) { // evite d*d qui deborde\n        if (n % d == 0) {\n            somme += d;\n            int autre = n / d;\n            if (autre != d) somme += autre; // carre parfait : pas deux fois\n        }\n    }\n    return somme == n;\n}\npublic static List<Integer> parfaits(int min, int max) {\n    if (min > max) throw new IllegalArgumentException(\"min > max\");\n    List<Integer> resultat = new ArrayList<>();\n    for (long n = Math.max(2, min); n <= max; n++) {\n        if (estParfait((int)n)) resultat.add((int)n);\n    }\n    return resultat;\n}","criteria":["n<=1返回false。","不要把n自身加进严格因数和。","正确处理平方根配对不重复相加。","说明朴素O(n)或配对O(√n)；使用long防累加溢出。"],"explanation":"先独立完成，再对照参考实现。允许等价正确解法；网站不在浏览器中编译或自动判定任意 Java 代码。","src":["C6","J14"]},{"id":"w03","kind":"write","lesson":"shortcircuit","chapter":"basics","title":"判断字符串是否含ASCII大写字母。","fr":"Écrire uneMajusculeAscii(String s), sans Stream. Le domaine est A à Z.","code":"public static boolean uneMajusculeAscii(String s) {\n    // Votre réponse\n}","algorithm":"uppercase","solution":"public static boolean uneMajusculeAscii(String s) {\n    Objects.requireNonNull(s, \"s\");\n    int i = 0;\n    while (i < s.length() && (s.charAt(i) < 'A' || s.charAt(i) > 'Z')) i++;\n    return i < s.length();\n}\npublic static boolean uneMajusculeUnicode(String s) {\n    Objects.requireNonNull(s, \"s\");\n    return s.codePoints().anyMatch(Character::isUpperCase);\n}","criteria":["空串返回false。","先检查边界，再charAt。","区分c在区间内&&与不在区间||。","找到一个即可提前返回；明确null处理契约。"],"explanation":"先独立完成，再对照参考实现。允许等价正确解法；网站不在浏览器中编译或自动判定任意 Java 代码。","src":["C6","J4","J15"]},{"id":"w04","kind":"write","lesson":"recursion","chapter":"methods","title":"递归判断回文。","fr":"Écrire un test récursif de palindrome, sensible à la casse. Ne pas inverser la chaîne avec une bibliothèque.","code":"public static boolean palindrome(String s) {\n    // Votre réponse\n}","algorithm":"palindrome","solution":"/** Comparaison exacte des unites UTF-16 ; pas de normalisation. */\npublic static boolean palindrome(String s) {\n    Objects.requireNonNull(s, \"s\");\n    return palindrome(s, 0, s.length() - 1);\n}\nprivate static boolean palindrome(String s, int g, int d) {\n    if (g >= d) return true;\n    return s.charAt(g) == s.charAt(d) && palindrome(s, g + 1, d - 1);\n}","criteria":["使用两端下标，递归规模缩小。","左右交叉或相等时返回true。","发现不等立即false。","空串与单字符为true；说明此实现按UTF-16代码单元。"],"explanation":"先独立完成，再对照参考实现。允许等价正确解法；网站不在浏览器中编译或自动判定任意 Java 代码。","src":["C1","C6","J8","J15"]},{"id":"w05","kind":"write","lesson":"recursion","chapter":"methods","title":"递归检查数组是否非递减有序。","fr":"Écrire un test récursif vérifiant si un tableau est trié par ordre croissant au sens large.","code":"public static boolean estTrie(int[] a) {\n    // Votre réponse\n}","algorithm":"sortedrecursive","solution":"/** Croissant au sens large : les valeurs egales sont acceptees. */\npublic static boolean estTrie(int[] a) {\n    Objects.requireNonNull(a, \"a\");\n    return estTrie(a, 0);\n}\nprivate static boolean estTrie(int[] a, int i) {\n    if (i >= a.length - 1) return true;\n    return a[i] <= a[i + 1] && estTrie(a, i + 1);\n}","criteria":["空数组/单元素返回true。","相邻比较用<=允许重复。","每次推进下标。","不为了验证而排序原数组。"],"explanation":"先独立完成，再对照参考实现。允许等价正确解法；网站不在浏览器中编译或自动判定任意 Java 代码。","src":["C1","C6","J8","J15"]},{"id":"w06","kind":"write","lesson":"recursion","chapter":"methods","title":"递归查找数组最大值。","fr":"Déterminer récursivement le maximum d’un tableau non vide.","code":"public static int maximumR(int[] a) {\n    // Votre réponse\n}","algorithm":"maxrecursive","solution":"public static int maximumR(int[] a) {\n    Objects.requireNonNull(a, \"a\");\n    if (a.length == 0) throw new IllegalArgumentException(\"tableau vide\");\n    return maximumR(a, a.length - 1);\n}\nprivate static int maximumR(int[] a, int i) {\n    if (i == 0) return a[0];\n    return Math.max(a[i], maximumR(a, i - 1));\n}","criteria":["拒绝null与空数组或明确前置条件。","不能把最大值默认初始化为0而漏负数。","基本情形对应真实元素。","每次递归覆盖少一个元素，返回最大值。"],"explanation":"先独立完成，再对照参考实现。允许等价正确解法；网站不在浏览器中编译或自动判定任意 Java 代码。","src":["C1","C6","J8","J15"]},{"id":"w07","kind":"write","lesson":"complexity","chapter":"methods","title":"手写稳定的插入排序。","fr":"Implémenter le tri par insertion en place, sans Arrays.sort.","code":"public static void triInsertion(int[] a) {\n    // Votre réponse\n}","algorithm":"insertion","solution":"public static void triInsertion(int[] a) {\n    Objects.requireNonNull(a, \"a\");\n    for (int i = 1; i < a.length; i++) {\n        int valeur = a[i], j = i - 1;\n        while (j >= 0 && a[j] > valeur) {\n            a[j + 1] = a[j];\n            j--;\n        }\n        a[j + 1] = valeur;\n    }\n}","criteria":["外层从1开始。","保存当前值再右移大于它的元素。","先检查j>=0再访问a[j]。","用>保留等值元素稳定性，最后写回a[j+1]。"],"explanation":"先独立完成，再对照参考实现。允许等价正确解法；网站不在浏览器中编译或自动判定任意 Java 代码。","src":["C6","ASystem","AArrayList"]},{"id":"w08","kind":"write","lesson":"linkedmodel","chapter":"generics","title":"实现泛型单链表并维护头尾。","fr":"Implémenter une liste simplement chaînée générique avec addLast, removeFirst et toString.","code":"// Tête, queue, taille ; cas vide et dernier élément.\n// removeFirst sur liste vide : lever NoSuchElementException.","algorithm":"singly","solution":"/** Valeurs null admises ; suppression a vide => NoSuchElementException. */\npublic static final class ListeChainee<T> {\n    private static final class Element<E> {\n        final E valeur;\n        Element<E> suivant;\n        Element(E valeur) { this.valeur=valeur; }\n    }\n    private Element<T> tete, queue;\n    private int taille;\n    public boolean isEmpty() { return tete==null; }\n    public int size() { return taille; }\n    public void addLast(T valeur) {\n        Element<T> e=new Element<>(valeur);\n        if (isEmpty()) tete=e;\n        else queue.suivant=e;\n        queue=e;\n        taille++;\n    }\n    public void addFirst(T valeur) {\n        Element<T> e=new Element<>(valeur);\n        e.suivant=tete;\n        tete=e;\n        if (queue==null) queue=e;\n        taille++;\n    }\n    public T removeFirst() {\n        if (isEmpty()) throw new NoSuchElementException(\"liste vide\");\n        T valeur=tete.valeur;\n        tete=tete.suivant;\n        if (tete==null) queue=null;\n        taille--;\n        return valeur;\n    }\n    public boolean contains(T valeur) {\n        for (Element<T> e=tete;e!=null;e=e.suivant)\n            if (Objects.equals(e.valeur,valeur)) return true;\n        return false;\n    }\n    @Override public String toString() {\n        StringJoiner j=new StringJoiner(\",\",\"{\",\"}\");\n        for (Element<T> e=tete;e!=null;e=e.suivant)\n            j.add(String.valueOf(e.valeur));\n        return j.toString();\n    }\n}","criteria":["节点类型参数完整；不用原始类型逃避检查。","空表插入同时设置head/tail。","删除末元素后tail=null。","toString覆盖空表与null元素，不越过末尾。"],"explanation":"先独立完成，再对照参考实现。允许等价正确解法；网站不在浏览器中编译或自动判定任意 Java 代码。","src":["C2"]},{"id":"w09","kind":"write","lesson":"student","chapter":"objects","title":"实现学生类的封装。","fr":"Concevoir Etudiant avec un tableau de notes protégé par des copies défensives.","code":"// Attributs privés ; constructeur ; getNotes ; calcul de moyenne.\n// Notes finies, entre 0 et 20.","algorithm":"studentmodel","solution":"public static final class Etudiant {\n    private String nom, prenom, email;\n    private int age;\n    private final double[] notes;\n    public Etudiant(String nom, String prenom, int age, String email, double[] notes) {\n        setNom(nom); setPrenom(prenom); setAge(age); setEmail(email);\n        Objects.requireNonNull(notes,\"notes\");\n        this.notes=Arrays.copyOf(notes,notes.length);\n        for (double n:this.notes) verifierNote(n);\n    }\n    private static void verifierNote(double n) {\n        if (!Double.isFinite(n) || n<0 || n>20)\n            throw new IllegalArgumentException(\"note hors [0,20]\");\n    }\n    public String getNom() { return nom; }\n    public String getPrenom() { return prenom; }\n    public int getAge() { return age; }\n    public String getEmail() { return email; }\n    public double[] getNotes() { return Arrays.copyOf(notes,notes.length); }\n    public void setNom(String v) { nom=Objects.requireNonNull(v); }\n    public void setPrenom(String v) { prenom=Objects.requireNonNull(v); }\n    public void setAge(int v) {\n        if (v<0) throw new IllegalArgumentException(\"age < 0\");\n        age=v;\n    }\n    /** Seulement non null ; pas de validation complete d'adresse email. */\n    public void setEmail(String v) { email=Objects.requireNonNull(v); }\n    public void setNote(int index,double n) {\n        Objects.checkIndex(index,notes.length);\n        verifierNote(n);\n        notes[index]=n;\n    }\n    public OptionalDouble moyenne() {\n        return Arrays.stream(notes).average();\n    }\n    @Override public String toString() {\n        return prenom+\" \"+nom+\" \"+Arrays.toString(notes);\n    }\n}","criteria":["构造器复制数组，getter再次复制。","final数组引用不意味着数组内容不可变。","合法性验证覆盖null、NaN和越界成绩。","空成绩平均值有明确语义，而不是无意除零。"],"explanation":"先独立完成，再对照参考实现。允许等价正确解法；网站不在浏览器中编译或自动判定任意 Java 代码。","src":["C0","C1","AArrays"]},{"id":"w10","kind":"write","lesson":"polynomial","chapter":"objects","title":"实现多项式的值相等性。","fr":"Définir equals et hashCode pour un polynôme dont les coefficients sont rangés par degré croissant.","code":"// [1,2] et [1,2,0] représentent le même polynôme.\n// Normaliser les zéros de fin ; refuser les coefficients non finis.","algorithm":"polynomialmodel","solution":"/** Coefficients finis ; c[i] = coefficient de x^i ; egalite exacte normalisee. */\npublic static final class Polynome {\n    private final double[] coefficients;\n    public Polynome(double... valeurs) {\n        Objects.requireNonNull(valeurs,\"coefficients\");\n        double[] c=Arrays.copyOf(valeurs,Math.max(1,valeurs.length));\n        for (int i=0;i<c.length;i++) {\n            if (!Double.isFinite(c[i])) throw new IllegalArgumentException(\"non fini\");\n            if (c[i]==0.0) c[i]=0.0; // -0.0 => +0.0\n        }\n        int n=c.length;\n        while (n>1 && c[n-1]==0.0) n--;\n        coefficients=Arrays.copyOf(c,n);\n    }\n    public double[] getCoefficients() { return coefficients.clone(); }\n    public double evaluer(double x) {\n        return RevisionAlgorithms.horner(coefficients,x);\n    }\n    @Override public boolean equals(Object o) {\n        if (this==o) return true;\n        if (!(o instanceof Polynome p)) return false;\n        return Arrays.equals(coefficients,p.coefficients);\n    }\n    @Override public int hashCode() { return Arrays.hashCode(coefficients); }\n    @Override public String toString() { return Arrays.toString(coefficients); }\n}","criteria":["先决定规范表示和允许输入。","不暴露内部数组。","equals(Object)签名正确，null和类型检查正确。","hashCode使用同一规范化数据，遵守相等必同哈希。"],"explanation":"先独立完成，再对照参考实现。允许等价正确解法；网站不在浏览器中编译或自动判定任意 Java 代码。","src":["C0","AObject","AArrays"]},{"id":"w11","kind":"write","lesson":"genericmethods","chapter":"generics","title":"手写泛型filter/map/reduce。","fr":"Écrire des méthodes génériques de filtrage, transformation et réduction d’une List.","code":"// Utiliser Predicate, Function et BinaryOperator.\n// Ne pas remplacer les boucles par Stream dans cet exercice.","algorithm":"genericfunctional","solution":"public static <T> List<T> filterList(List<T> source, Predicate<? super T> filtre) {\n    Objects.requireNonNull(source); Objects.requireNonNull(filtre);\n    List<T> resultat = new ArrayList<>();\n    for (T x : source) if (filtre.test(x)) resultat.add(x);\n    return resultat;\n}\npublic static <T,R> List<R> mapList(List<T> source, Function<? super T,? extends R> f) {\n    Objects.requireNonNull(source); Objects.requireNonNull(f);\n    List<R> resultat = new ArrayList<>();\n    for (T x : source) resultat.add(f.apply(x));\n    return resultat;\n}\npublic static <T> T reduceList(List<T> source, T initial, BinaryOperator<T> op) {\n    Objects.requireNonNull(source); Objects.requireNonNull(op);\n    T resultat = initial;\n    for (T x : source) resultat = op.apply(resultat, x);\n    return resultat;\n}","criteria":["<T>或<T,R>放在返回类型前。","filter保留满足条件的原元素，map产生映射结果。","reduce从中性初始值逐项合并。","不修改来源列表，说明空输入与null参数。"],"explanation":"先独立完成，再对照参考实现。允许等价正确解法；网站不在浏览器中编译或自动判定任意 Java 代码。","src":["C2","J4","J8"]},{"id":"w12","kind":"write","lesson":"inherit","chapter":"inheritance","title":"抽象类、接口与动态分派。","fr":"Concevoir Mesurable, une classe abstraite Forme et une classe Carre, puis expliquer le polymorphisme.","code":"// Mesurable : double aire()\n// Forme : nom privé, constructeur, méthode abstraite aire()\n// Carre : côté non négatif, aire = côté * côté","algorithm":"inheritanceexample","solution":"public interface Mesurable { double aire(); }\npublic abstract static class Forme implements Mesurable {\n    private final String nom;\n    protected Forme(String nom) { this.nom=Objects.requireNonNull(nom); }\n    public final String getNom() { return nom; }\n    @Override public String toString() { return nom+\"=\"+aire(); }\n}\npublic static final class Carre extends Forme {\n    private final double cote;\n    public Carre(double cote) {\n        super(\"Carre\");\n        if (!Double.isFinite(cote) || cote<0) throw new IllegalArgumentException(\"cote\");\n        this.cote=cote;\n    }\n    @Override public double aire() { return cote*cote; }\n}","criteria":["implements和extends用对。","抽象方法与具体重写可见性正确。","子类构造器正确调用super。","通过Forme引用调用Carre.aire体现动态分派。"],"explanation":"先独立完成，再对照参考实现。允许等价正确解法；网站不在浏览器中编译或自动判定任意 Java 代码。","src":["C3","J8","J9"]}],"corrections":[{"id":"err1","where":"C1 · p.4","old":"声明引用后总是初始化为null","new":"字段/数组元素有默认null；局部引用变量在读取前必须确定赋值。","lesson":"primitives","src":["J4"]},{"id":"err2","where":"C1 · p.2","old":"void方法不能有return","new":"void方法允许裸return;，只是不返回值。","lesson":"jumps","src":["J14"]},{"id":"err3","where":"C1 · p.2","old":"static final必须在声明处初始化","new":"可以在静态初始化块中完成一次赋值。","lesson":"final","src":["J8"]},{"id":"err4","where":"C1 · p.3","old":"静态方法不能访问任何实例属性","new":"不能无对象地直接访问；可以通过明确的对象引用访问可访问的实例成员。","lesson":"static","src":["J8"]},{"id":"err5","where":"C1 · p.1","old":"类名必须首字母大写；文件名总等于每个类名","new":"首字母大写是约定；普通javac文件中public顶层类型需匹配文件名，同文件可有非public辅助类。","lesson":"program","src":["J7"]},{"id":"err6","where":"C1 · p.3","old":"有了有参构造器，无参构造器便不再可用","new":"准确说法是“不再自动生成无参构造器”，仍可显式声明一个。","lesson":"constructor","src":["J8"]},{"id":"err7","where":"C1 / C0","old":"hashcode() 与 Math.min(2.5,9,25)","new":"正确名称hashCode()；小数写9.25，逗号分隔参数，Math.min没有这里暗示的三参数重载。","lesson":"overload","src":["AMath"]},{"id":"err8","where":"C3 · p.1","old":"抽象类至少有一个抽象方法","new":"抽象类允许零个抽象方法；有未实现抽象方法的普通类则必须abstract。","lesson":"abstract","src":["J8"]},{"id":"err9","where":"C3 · p.2","old":"接口只包含抽象方法、静态方法、常量","new":"Java21还可有default、private方法；具体类必须完成的是仍未实现的抽象契约。","lesson":"interfaces","src":["J9"]},{"id":"err10","where":"C4 · p.1","old":"@FunctionnalInterface","new":"正确拼写是@FunctionalInterface；default/static/private不计为抽象方法，Object公共方法有特殊计数规则。","lesson":"functionalinterface","src":["J9"]},{"id":"err11","where":"C2 · p.3","old":"(Paire<String>[])new Paire[10] 标作“OK”","new":"可编译但存在unchecked警告与堆污染风险；推荐List<Paire<String>>或类型安全数组工厂。","lesson":"genericarrays","src":["J4"]},{"id":"err12","where":"C2 · pp.3–4","old":"instanceof绝不能带参数化类型","new":"不能任意检查未知对象的泛型实参；List<?>合法，Java16+还允许一些静态可证的参数化类型测试。","lesson":"erasure","src":["J15"]},{"id":"err13","where":"C2 · pp.4–5","old":"链表removeFirst与toString示例","new":"删除最后元素后应queue=null；空表toString不能解引用null，null元素显示也应安全。修正版空表删除改用异常，已标出契约差异。","lesson":"linkedmodel","src":["C2"]},{"id":"err14","where":"C5 · p.2","old":"skip被标为短路操作","new":"skip是有状态中间操作，不是短路；limit是短路中间操作，findFirst/allMatch等是短路终端操作。","lesson":"streamorder","src":["AStream"]},{"id":"err15","where":"C5 · p.1","old":"流处理必定不修改来源","new":"API不自动就地修改来源，但行为参数仍可能修改源或元素；必须遵守non-interference与无状态要求。","lesson":"pipeline","src":["AStream"]},{"id":"err16","where":"C6 · p.28","old":"递归求和n≤1都返回1","new":"原式对应n≥1前置条件；若支持n=0，必须使S(0)=0，并拒绝负输入或说明其语义。","lesson":"recursion","src":["C6"]},{"id":"err17","where":"C6 · p.17","old":"大写字母示例中的弯引号与ASCII边界","new":"Java字符引号应使用ASCII单引号；A～Z仅是ASCII大写，不包含É等Unicode大写。","lesson":"builder","src":["ACharacter"]},{"id":"err18","where":"C6 · p.6","old":"课程幻灯片的“最新版本发布日期”","new":"不将该动态信息作为语法结论背诵。网站统一使用课件明确要求的Java21基线，不以幻灯片该行判断当前最新发行版。","lesson":"program","src":["C6"]}],"checklists":[{"title":"先打通主干 · 约90分钟","fr":"Parcours prioritaire","items":[["program","能写main骨架，区分编译错误与运行时异常。"],["conversion","能解释整数除法、类型提升、字符串拼接。"],["shortcircuit","能利用短路避免null和数组越界。"],["aliases","能画出数组别名与复制后的引用关系。"],["signature","能区分形参、实参、返回值、重载签名。"],["student","能手写Etudiant双向防御性复制。"],["static","能区分static与实例成员。"],["final","能解释final变量/方法/类三种作用。"],["equals","能写equals(Object)并解释契约。"],["hashcode","能说明相等对象为什么必须同hashCode。"]]},{"title":"泛型和数据结构 · 约90分钟","fr":"Types et structures","items":[["genericterms","背清五个泛型法语术语。"],["genericmethods","能在返回类型前正确写<T>。"],["genericarrays","能判断T[]声明、新建和数组强转风险。"],["erasure","能解释擦除与重载冲突。"],["linkedmodel","能维护链表空表、头尾和最后元素删除。"],["listusage","能区分remove(index)和remove(value)。"],["immutablelists","能区分定长、不可修改、视图和副本。"],["comparison","能使用Comparator多关键字
