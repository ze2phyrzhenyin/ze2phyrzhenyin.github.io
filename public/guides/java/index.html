回类型、异常与版本说明。","url":"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/function/Function.html","kind":"official"},{"id":"APredicate","title":"Java 21 API · Predicate","detail":"方法契约、返回类型、异常与版本说明。","url":"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/function/Predicate.html","kind":"official"},{"id":"AConsumer","title":"Java 21 API · Consumer","detail":"方法契约、返回类型、异常与版本说明。","url":"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/function/Consumer.html","kind":"official"},{"id":"ASupplier","title":"Java 21 API · Supplier","detail":"方法契约、返回类型、异常与版本说明。","url":"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/function/Supplier.html","kind":"official"},{"id":"ARandom","title":"Java 21 API · Random","detail":"方法契约、返回类型、异常与版本说明。","url":"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/Random.html","kind":"official"},{"id":"AFunctions","title":"Java 21 API · java.util.function","detail":"函数式接口及基本类型特化。","url":"https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/function/package-summary.html","kind":"official"},{"id":"G","title":"Oracle · Generics","detail":"泛型教程用于入门；关于 instanceof 的绝对化措辞以 Java 21 JLS 为准。","url":"https://docs.oracle.com/javase/tutorial/java/generics/restrictions.html","kind":"official"}],"chapters":[{"id":"basics","zh":"语言基础与类型","fr":"Langage & types","desc":"程序结构、类型、运算、输入输出。","src":["C6","J4","J15"]},{"id":"control","zh":"控制流程","fr":"Structures de contrôle","desc":"条件、switch、循环与终止。","src":["C6","J14"]},{"id":"arrays","zh":"数组与字符串","fr":"Tableaux & chaînes","desc":"引用、复制、多维数组、不可变字符串。","src":["C6","C0","J10","AString","AArrays"]},{"id":"methods","zh":"方法与问题分解","fr":"Méthodes & décomposition","desc":"签名、传参、重载、递归与复杂度。","src":["C1","C6","J8","J15"]},{"id":"objects","zh":"对象、封装与相等性","fr":"Objets & encapsulation","desc":"构造器、权限、static/final、equals/hashCode。","src":["C0","C1","J8","AObject"]},{"id":"generics","zh":"泛型与类型安全","fr":"Généricité","desc":"Paire、Tuple、数组、类型擦除、通配符。","src":["C2","J4","J8"]},{"id":"inheritance","zh":"继承、接口与多态","fr":"Héritage & polymorphisme","desc":"重写、动态分派、抽象类与接口契约。","src":["C3","J8","J9"]},{"id":"collections","zh":"集合与数据结构","fr":"Collections","desc":"List、Set、Map、队列、迭代器与排序。","src":["C0","C2","C6","AList","AMap"]},{"id":"functional","zh":"函数式接口与 Lambda","fr":"Interfaces fonctionnelles","desc":"四类接口、方法引用、捕获与组合。","src":["C4","J9","J15","AFunctions"]},{"id":"streams","zh":"Stream 与数据处理","fr":"Flux de données","desc":"管道、惰性、终端操作、归约、收集器。","src":["C5","AStream","ACollectors"]},{"id":"robustness","zh":"可靠性与考试方法","fr":"Robustesse & examen","desc":"异常、资源管理、边界测试、手写规范。","src":["J11","J14","C6"]}],"lessons":[{"id":"program","chapter":"basics","title":"程序骨架、编译与运行","fr":"Structure, compilation et exécution","summary":"源文件经 javac 编译为字节码，再由 JVM 运行。","body":["区分类名、文件名、包名和 main 方法。考试采用传统入口 public static void main(String[] args)，不需要预览特性。普通 javac 文件编译中，public 顶层类 App 应放在 App.java。一个文件可以包含额外的非 public 顶层类。","JDK 提供开发工具（javac 等）；JVM 执行字节码。JRE 指运行环境这一概念，不等于编译器。错误要分编译错误、运行时异常和结果不正确三类。","类名首字母大写是命名约定，不是编译器强制。Java 区分大小写：String、System、main 的拼写不能随意改变。语句以分号结尾；类、方法、if 等块不能简单地理解成“每一行都加分号”。"],"code":"public class App {\n    public static void main(String[] args) {\n        System.out.println(\"Bonjour Java\");\n    }\n}\n// 终端：javac -encoding UTF-8 App.java\n// 然后：java App   （不写 App.class）","pitfall":"void Main() 不是这里使用的标准入口；编译失败时不要继续推测程序输出。","exam":"Le code source est compilé en bytecode, exécuté par une machine virtuelle Java.","src":["C6","J4","J15"],"level":"core"},{"id":"packages","chapter":"basics","title":"包、导入与 Javadoc","fr":"Paquetage, importation et documentation","summary":"package 组织类型；import 只简化名字，不复制代码。","body":["文件通常依次写 package、import、类型声明。相同包中的可访问类型，以及 java.lang 中的公开类型，通常不需要显式导入；java.util 与 java.util.stream 不是同一个包。","import java.util.* 不会导入 java.util.function.* 或 java.util.stream.*。也可直接写 java.util.ArrayList<String>。两个包出现同名类时，使用全限定名消除歧义。","阅读 Javadoc 先看所属类、static 与否、类型参数、参数含义、返回值、异常、是否修改接收对象。/** ... */ 是文档注释，可用 @param、@return、@throws。"],"code":"package fr.ut1.miage;\nimport java.util.List;\nimport java.util.ArrayList;\nimport java.util.stream.Collectors;\n// List<String> noms = new ArrayList<>();","pitfall":"泛型尖括号不是注释；import 不会使 private 成员变得可访问。","exam":"Un paquetage organise les classes ; une importation permet de les désigner par leur nom simple.","src":["C1","C6","J7"],"level":"core"},{"id":"primitives","chapter":"basics","title":"八种基本类型与默认值","fr":"Types primitifs et valeurs par défaut","summary":"基本类型存值；引用类型变量存对对象的引用。","body":["整数：byte 8 位、short 16 位、int 32 位、long 64 位，有符号；char 是 16 位无符号 UTF-16 代码单元，范围 0～65535，不是“任何 Unicode 字符都只占一个 char”。","float 为 32 位浮点、double 为 64 位浮点；boolean 只有 true/false，Java 语言不规定其存储必须是 1 字节。String 和数组都不是基本类型。","字段和数组元素自动初始化：数值为 0、boolean 为 false、char 为 \\u0000、引用为 null。方法中的局部变量没有可直接读取的默认值，必须先确定赋值。参数由调用方提供。"],"code":"int[] nombres = new int[2];      // [0, 0]\nString[] mots = new String[2];    // [null, null]\nint x;\n// System.out.println(x);         // 编译错误：尚未初始化\nlong distance = 3_000_000_000L;\nfloat taux = 1.5F;","pitfall":"null 不等于空字符串、空数组或数字 0；访问 null 引用的实例方法通常触发 NullPointerException。","exam":"Une variable locale doit être initialisée avant d’être lue, contrairement aux champs et aux éléments d’un tableau.","src":["C6","J4","J15"],"level":"core"},{"id":"conversion","chapter":"basics","title":"类型转换与数值提升","fr":"Conversions et promotion numérique","summary":"先判断表达式类型，再看赋值目标类型。","body":["常见扩大转换 byte → short → int → long → float → double；char 可转 int。扩大转换不保证数值完全精确，例如大 long 转 double 可能丢失精度。boolean 不参与数值转换。","缩小转换通常需要显式强制转换，如 (int)3.9 得到 3（向零截断）。byte/short/char 参与普通算术运算通常先提升为 int；byte b=1; b=b+1 不通过，但 b+=1 带有隐式缩小转换。","用小范围 int 常量可初始化 byte，例如 byte b=127；超范围不能。long r=a*b 中如果 a、b 均为 int，乘法先以 int 做，可能已经溢出；写 (long)a*b。"],"code":"System.out.println(5 / 2);           // 2\nSystem.out.println(5 / 2.0);         // 2.5\nSystem.out.println((double)(5 / 2)); // 2.0\nSystem.out.println((double)5 / 2);   // 2.5\nbyte b = 127;\nb += 1;                             // -128","pitfall":"给 double 赋值不会“倒回去”把先前的整数除法改成小数除法。","exam":"Le type de l’expression est déterminé avant son affectation.","src":["C6","J4","J5","J15"],"level":"core"},{"id":"operators","chapter":"basics","title":"运算符、优先级与求值顺序","fr":"Opérateurs et ordre d’évaluation","summary":"算式不能只看最终赋给什么变量。","body":["常用：+ - * / %，== != < <= > >=，&& || !，赋值 = 和复合赋值 += 等。优先级大致是括号、单目、乘除余、加减、比较、相等、&&、||、?:、赋值；复杂式子主动加括号。","整数除以零会抛 ArithmeticException；浮点除以零可能得到 Infinity 或 NaN。-5 % 2 为 -1，余数符号随被除数。int 溢出不会自动抛异常，Math.addExact 可检测溢出。","字符串拼接与加法共享 +，从左向右结合：\"x\"+1+2 是 \"x12\"，1+2+\"x\" 是 \"3x\"。i++ 先产生旧值再增加，++i 先增加再产生新值。读取程序时逐步写变量值。"],"code":"int i = 2;\nint a = i++;        // a=2, i=3\nint b = ++i;        // b=4, i=4\nSystem.out.println(\"R=\" + 1 + 2);   // R=12\nSystem.out.println(\"R=\" + (1 + 2)); // R=3","pitfall":"= 是赋值，== 才是比较。if (b = true) 对 boolean 变量甚至可以编译，但逻辑很可能错。","exam":"L’incrémentation postfixée produit l’ancienne valeur ; la préfixée produit la nouvelle valeur.","src":["C6","J4","J15"],"level":"core"},{"id":"shortcircuit","chapter":"basics","title":"短路与安全访问顺序","fr":"Évaluation en court-circuit","summary":"&& 左边为 false、|| 左边为 true 时，不执行右边。","body":["安全访问必须先判空，再访问对象；先检查下标，再读取元素。s != null && !s.isEmpty() 安全，反过来就可能 NPE。","& 和 | 用于 boolean 时不短路，两边都会求值；用于整数时是按位操作。^ 表示按位异或或布尔异或，不表示乘方，乘方用 Math.pow。","“至少一个”通常用 OR/anyMatch；“所有”通常用 AND/allMatch。字符不在 A～Z 内应写 c < 'A' || c > 'Z'，不是 &&。德摩根：!(a && b) 等价于 !a || !b。"],"code":"String s = null;\nboolean ok = s != null && s.length() > 0; // false，无异常\nint[] a = {4};\nint i = 1;\nboolean trouve = i < a.length && a[i] == 4; // false","pitfall":"将 && 改为 &，看似条件相同，却可能多执行右侧并抛异常。","exam":"Le court-circuit peut empêcher l’évaluation d’une expression dangereuse.","src":["C6","J4","J15"],"level":"core"},{"id":"wrappers","chapter":"basics","title":"包装类型、装箱与拆箱","fr":"Classes enveloppes, boxing et unboxing","summary":"泛型容器使用 Integer 等引用类型，而不是 int。","body":["对应包装类：Byte、Short、Integer、Long、Float、Double、Boolean、Character。List<Integer> 会自动将 int 装箱；从 Integer 取 int 会拆箱。","Integer x=null; int n=x 会在拆箱时 NPE。两个包装对象的 == 比较身份，不宜用于数值相等判断；缓存会让部分 == 看起来正确，不能据此推广。用 Objects.equals(x,y) 或合适的数值比较。","Integer.parseInt(\"42\") 返回 int；Integer.valueOf(\"42\") 返回 Integer。非法数字字符串可能抛 NumberFormatException。Double.parseDouble 使用点号小数，不自动接受法语逗号。"],"code":"Integer a = 1000;\nInteger b = 1000;\nSystem.out.println(a.equals(b));   // true\nint n = Integer.parseInt(\"42\");\nString t = String.valueOf(n);      // \"42\"","pitfall":"Integer 与 Long 的 equals 即使数值都是 1 也不相等，因为类型不同。","exam":"L’auto-unboxing d’une référence null provoque une NullPointerException.","src":["C2","J5","AInteger","AObjects"],"level":"core"},{"id":"io","chapter":"basics","title":"控制台输入输出","fr":"Entrées et sorties","summary":"Scanner 按 token 读与按行读是两套规则。","body":["print 不自动换行；println 自动换行；printf 使用格式串，%d 整数、%f 浮点、%s 字符串、%n 平台换行。需要 2 位小数可用 %.2f。","Scanner.next() 读取下一个 token；nextLine() 读取当前行剩余内容并越过行分隔符；nextInt()/nextDouble() 读取数字 token，不自动消费其后的整行换行。先 nextInt 再 nextLine 时常先读到空的行尾。","解决方案：读完数字后消费行尾，再读下一行；或始终 nextLine 然后解析。hasNextInt 可检查能否读取整数；Scanner 的数字格式受 Locale 影响。一个应用通常共用一个 System.in Scanner，关闭它也会关闭底层输入。"],"code":"java.util.Scanner sc = new java.util.Scanner(System.in);\nint age = sc.nextInt();\nsc.nextLine();                // 消费当前行余下部分\nString nom = sc.nextLine();\nSystem.out.printf(\"%s : %d ans%n\", nom, age);","pitfall":"next() 不能完整读取带空格的姓名；在反复调用的工具方法里不要随便关闭 System.in。","exam":"nextLine() lit le reste de la ligne courante, pas nécessairement la ligne suivante.","src":["AScanner","C6"],"level":"extra"},{"id":"var","chapter":"basics","title":"var、枚举与 record 的识别","fr":"var, enum et record","summary":"补充识别现代写法，不替代课程基础写法。","body":["var 是局部变量类型推断，不是动态类型。var x=1 推断为 int，之后不能 x=\"a\"。不能只写 var x; 或 var x=null；普通方法返回类型/字段声明不能用 var。","enum 表示有限个命名常量，例如 enum Grade { CONCEPTEUR, INGENIEUR }。可在 switch 中使用；比较同一枚举类型的值通常可用 ==。","record Point(int x,int y) 是简洁的数据载体，会生成访问器 x()/y()、构造器、equals/hashCode/toString；record 隐式 final，但其组件指向可变对象时不等于深不可变。考试没要求时继续写普通类。"],"code":"var noms = new java.util.ArrayList<String>();\nnoms.add(\"Lea\");\nrecord Point(int x, int y) { }\nPoint p = new Point(2, 3);\nSystem.out.println(p.x()); // 2","pitfall":"var list = new ArrayList<>(); 缺少目标类型信息时常推断成 ArrayList<Object>，不是任意类型自动跟随。","exam":"var infère un type statique ; il ne rend pas Java dynamiquement typé.","src":["J14","J8"],"level":"extra"},{"id":"conditions","chapter":"control","title":"if / else 与三元运算","fr":"Conditionnelles","summary":"分支条件必须是 boolean，不能用 0/1 代替。","body":["if ... else if ... else 从上到下找第一个为 true 的分支，不是每个分支都执行。没有大括号时只控制紧接的一条语句，else 关联最近的未匹配 if。手写统一保留大括号。","条件运算符 condition ? a : b 是表达式，有值；只有被选中的分支被求值。适合简单选择，不宜嵌套过深。注意两个分支间的数值类型提升。","边界先定义清楚：age >= 18 包含 18；区间 [a,b] 写 x>=a && x<=b，不能写 a<=x<=b。"],"code":"static String mention(double note) {\n    if (note >= 16) return \"Très bien\";\n    else if (note >= 10) return \"Admis\";\n    else return \"Ajourné\";\n}\n// int max = a >= b ? a : b;","pitfall":"if (condition); 后的分号会构成空语句，后面的块可能无条件执行。","exam":"Une seule branche d’une chaîne if / else if / else est exécutée.","src":["C6","J14"],"level":"core"},{"id":"switch","chapter":"control","title":"switch 语句与表达式","fr":"Instruction et expression switch","summary":"区别传统冒号分支的贯穿与箭头分支。","body":["case ...: 的传统分组如果没有 break，可能继续执行后面的分组，称为 fall-through。case ... -> 不会自然贯穿到下一个 case。","switch 表达式产生值，需覆盖可能情况；通常用 default。箭头右侧单个表达式可直接返回值，块中通过 yield 提供该 switch 的值，不用 return 代替。","本课程工资题用 String grade 和 int anciennete 的嵌套 switch。Java 21 中可使用 case null 等现代特性，但没有处理 null 的常见 String switch，输入 null 会 NPE。不要把 double 当成普通课程 switch 的选择器。"],"code":"int niveau = 2;\nString libelle = switch (niveau) {\n    case 1 -> \"Débutant\";\n    case 2, 3 -> \"Intermédiaire\";\n    default -> {\n        String autre = \"Inconnu\";\n        yield autre;\n    }\n};","pitfall":"break 退出 switch 或循环；yield 产生 switch 表达式的值；return 退出整个方法。","exam":"Avec une règle fléchée, il n’y a pas de passage implicite au case suivant.","src":["C6","J14"],"level":"core"},{"id":"loops","chapter":"control","title":"for、while 与 do-while","fr":"Boucles bornées et non bornées","summary":"选循环方式时先确定条件、状态变化和终止。","body":["for(init;condition;update) 顺序是初始化一次 → 判断 → 循环体 → 更新 → 再判断。常用于已知范围遍历，但语法本身不保证次数固定。","while 先判断，可能执行零次；do { ... } while(condition); 先执行，至少一次。课件的 bornée / non bornée 指迭代次数是否预先知道，不是两种不同的 Java 类型。","for-each 写 for(Type e : source)，适合逐元素读取。给循环变量重新赋值不会替换数组/列表中的原元素；通过引用修改元素对象的内部状态则可能影响原对象。"],"code":"int[] a = {1, 2, 3};\nfor (int x : a) x *= 2;           // a 没有改变\nfor (int i=0; i<a.length; i++) {\n    a[i] *= 2;                    // a 变为 [2,4,6]\n}","pitfall":"下标循环通常 i < a.length，不是 <=；do-while 尾部的分号不能漏。","exam":"while peut ne jamais s’exécuter ; do-while s’exécute au moins une fois.","src":["C6","J14"],"level":"core"},{"id":"jumps","chapter":"control","title":"break、continue 与 return","fr":"Contrôle de l’exécution","summary":"先明确跳出的是哪一层。","body":["break 默认退出最近的一层循环或 switch。continue 跳过本轮循环余下部分；在 for 中仍会执行 update，在 while 中直接回到条件检查。","return 退出当前方法，不只退出当前循环。非 void 方法 return expression；void 方法允许裸 return;，但不能返回普通值。","嵌套循环中的 break 只退出内层。Java 支持标签 break/continue，但考试无明确需要时可用布尔变量或辅助方法让流程更清晰。"],"code":"static int premierPair(int[] a) {\n    for (int x : a) {\n        if (x % 2 != 0) continue;\n        return x;\n    }\n    throw new java.util.NoSuchElementException(\"aucun pair\");\n}","pitfall":"在 while 中将 i++ 放在可能被 continue 跳过的位置会导致死循环。","exam":"return termine la méthode ; break termine la boucle ou le switch le plus proche.","src":["C6","J14"],"level":"core"},{"id":"invariants","chapter":"control","title":"循环不变式、边界与证明","fr":"Invariant et terminaison","summary":"不变式说明每次迭代前后一直成立什么。","body":["求和循环：开始第 i 次迭代时，s 等于前 i 个元素之和。初始化 i=0、s=0 满足；加上 a[i] 后不变式推进到 i+1；终止 i=n 时得到全数组之和。","终止性需有向边界推进的量，例如剩余元素 n-i 每轮减少且不低于 0。循环条件写对，但更新方向相反，仍不终止。","测试至少覆盖空输入、单元素、正常、多重复、未找到、最大/最小边界。算法给出的“找不到”返回值必须与合法结果区分，比如下标用 -1，不要用 0。"],"code":"long somme = 0;\nfor (int i=0; i<a.length; i++) {\n    // 不变式：somme = a[0] + ... + a[i-1]\n    somme += a[i];\n}","pitfall":"发现几个例子正确不等于算法正确；说明初始、保持、终止三个阶段更有说服力。","exam":"Un invariant est vrai avant et après chaque itération.","src":["C6"],"level":"extra"},{"id":"arraybasics","chapter":"arrays","title":"数组声明、分配与访问","fr":"Déclarer et utiliser un tableau","summary":"数组长度创建后固定，元素可修改。","body":["int[] a; 只声明引用；new int[3] 分配并初始化数组；int[] a={1,2,3} 合并声明与初始化。已有变量重新赋值时用 a=new int[]{1,2}，不能单独 a={1,2}。","合法下标为 0 到 length-1；a.length 是字段，没有括号。零长度数组合法，但没有 a[0]。负长度会抛 NegativeArraySizeException。","String[] 的元素初始为 null，不会自动创建空字符串；某个元素必须非 null 才能调用它的 length()。数组可以存子类对象，但运行时会检查真实元素类型。"],"code":"int[] a = new int[3];\na[0] = 7;\nint[] vide = {};\nSystem.out.println(a.length); // 3\n// a[3] = 9;                 // ArrayIndexOutOfBoundsException","pitfall":"数组不能通过 a.size() 或 a.length() 获取长度。","exam":"Un tableau a une taille fixe, accessible par le champ length.","src":["C6","C0","J10","AString","AArrays"],"level":"core"},{"id":"aliases","chapter":"arrays","title":"别名与防御性复制","fr":"Références, alias et copie défensive","summary":"b=a 是复制引用，不是复制数组内容。","body":["两个引用指向同一数组时，通过任意一个改元素都会被另一个看到。重新将其中一个引用赋给新数组，不会自动改变另一个引用。","Arrays.copyOf(a,a.length)、a.clone() 或新数组加 System.arraycopy 可以复制一维数组。arraycopy 的目标数组须提前分配，其参数 length 是复制元素数量。","基本类型数组的元素复制后互不影响；对象数组复制的是元素引用，仍共享元素对象。把可变数组存入对象或从 getter 返回时，两端都需要考虑防御性复制。"],"code":"int[] a = {17, 9, 11};\nint[] b = a;\nint[] c = java.util.Arrays.copyOf(a, a.length);\na[1] = 7;\nSystem.out.println(b[1]); // 7\nSystem.out.println(c[1]); // 9","pitfall":"private final int[] a 只限制字段不能重新指向别处，不禁止 a[0]=...。","exam":"Une affectation de tableau copie la référence, pas les éléments.","src":["C6","C0","J10","AString","AArrays"],"level":"core"},{"id":"matrix","chapter":"arrays","title":"二维数组与浅拷贝","fr":"Tableaux multidimensionnels","summary":"二维数组是数组的数组，不保证每一行等长。","body":["int[][] m=new int[4][12]：m.length=4，每行长度通常为 12。m[2] 是 int[] 引用，m[2][3] 才是 int。课件 morpion[1][0] 为 \"O\"，morpion.length 为 3。","锯齿数组可有不同长度行，甚至 null 行。遍历行时使用 m[i].length，不能把外层长度当内层长度。二维数组 clone/copyOf 默认只复制外层数组，行仍共享。","独立复制每一行：新建外层，再逐行 clone；若行元素仍是可变对象，仍需要更深入的复制。Arrays.deepToString 展示嵌套数组，deepEquals 比较嵌套内容。"],"code":"int[][] a = {{1,2}, {3}};\nint[][] b = a.clone();\nb[0][0] = 9;              // a[0][0] 也变为9\nint[][] c = new int[a.length][];\nfor (int i=0; i<a.length; i++) {\n    c[i] = a[i] == null ? null : a[i].clone();\n}","pitfall":"二维数组不是一定连续的“矩形表”；外层复制不等于深拷贝。","exam":"La copie du tableau extérieur conserve les références vers les mêmes lignes.","src":["C6","C0","J10","AString","AArrays"],"level":"core"},{"id":"strings","chapter":"arrays","title":"String 不可变、比较与子串","fr":"Chaînes immuables","summary":"String 操作一般产生结果值，不会修改原字符串内容。","body":["s.toUpperCase()、replace、substring 返回结果；未接收结果时 s 不变。变量 s 可以重新赋值，这不违反 String 对象本身不可变。","== 比较引用身份；equals 比较文本内容；Objects.equals(a,b) 处理 null。字面量共享及常量折叠可能使某些 == 为 true，但文本相等仍使用 equals。","length() 是 UTF-16 代码单元数；charAt(i) 也返回代码单元。substring(begin,end) 左闭右开；indexOf 找不到为 -1。String 可为空 \"\"，但 null 不是字符串。"],"code":"String s = \"java\";\ns.toUpperCase();\nSystem.out.println(s);                  // java\nSystem.out.println(s.substring(1, 3)); // av\nSystem.out.println(s.equals(new String(\"java\"))); // true","pitfall":"char 用单引号，String 用双引号；\"A\" 与 'A' 的类型不同。","exam":"String est immuable : une transformation ne modifie pas la chaîne d’origine.","src":["C6","C0","J10","AString","AArrays"],"level":"core"},{"id":"builder","chapter":"arrays","title":"StringBuilder、字符分类与拆分","fr":"Construction et traitement de chaînes","summary":"循环大量拼接优先用 StringBuilder。","body":["StringBuilder 是可变字符序列：append、insert、delete、reverse 修改自身，最后 toString 得到 String。不要把 builder 的 equals 当作 String 内容比较。","Character.isUpperCase/isDigit/isLetter 比 ASCII 区间判断支持更广泛的 Unicode 字符。题目只要求 A～Z 时可用 ASCII 范围；要求任意 Unicode 大写时可遍历 codePoints。","split 参数是正则，不是普通文本；点号应写 \"\\\\.\"，竖线应转义。split(\",\") 默认丢弃尾部空项，split(\",\",-1) 保留。String.replace 是字面替换，replaceAll 是正则替换。"],"code":"StringBuilder b = new StringBuilder();\nfor (int i=0; i<3; i++) b.append(i);\nString s = b.toString();  // \"012\"\nString[] parts = \"a,b,\".split(\",\", -1); // [\"a\",\"b\",\"\"]","pitfall":"逐次 s += ... 可能反复复制越来越长的文本，累积代价可到平方级。","exam":"StringBuilder est mutable et convient à la construction progressive d’une chaîne.","src":["C6","AString","AStringBuilder","ACharacter"],"level":"core"},{"id":"arraytools","chapter":"arrays","title":"数组工具与排序契约","fr":"Outils pour les tableaux","summary":"排序、查找、比较和转换各有不同副作用。","body":["Arrays.sort(a) 就地排序，返回 void；Arrays.toString(a) 得到可读字符串；数组自身的 equals 默认不是逐元素比较，用 Arrays.equals。","Arrays.binarySearch 的前提是按相同规则排好序；未找到返回 -(插入位置)-1，不只是 -1。重复值时不保证返回第一个下标。","Arrays.asList(T...) 是定长、通常由原数组支持的 List 视图：可 set，不可 add/remove。传入 int[] 会成为只有一个 int[] 元素的 List，而不是 List<Integer>。"],"code":"int[] a = {3,1,2};\njava.util.Arrays.sort(a);\nint p = java.util.Arrays.binarySearch(a, 4); // -4\njava.util.List<int[]> x = java.util.Arrays.asList(a);\nSystem.out.println(x.size()); // 1","pitfall":"Arrays.sort 与 Stream.sorted 不同：前者改数组，后者构造流操作。","exam":"binarySearch exige un tableau préalablement trié selon le même ordre.","src":["C6","C0","J10","AString","AArrays"],"level":"core"},{"id":"signature","chapter":"methods","title":"方法声明、签名与返回值","fr":"Signature, définition et appel","summary":"Java 的技术性“方法签名”不包含返回类型。","body":["声明常写 可见性 static? 类型参数? 返回类型 名称(形参)；方法体实现处理。课程有时将整段声明称为 spécification/signature；判重载时按 Java 严格规则：方法名、类型参数及参数类型等，而不是返回类型。","形参是定义中的占位变量，实参是调用时提供的表达式。非 void 方法的可正常结束路径应返回兼容结果；也可通过 throw 不正常结束。","函数在课程中指有返回值的子程序，过程指 void 方法；这不是 Java 的 function/procedure 关键字。返回数组/对象时返回的是引用值。"],"code":"static int carre(int x) {\n    return x * x;\n}\nstatic void afficher(int x) {\n    if (x < 0) return;  // 合法\n    System.out.println(x);\n}\n// int r = carre(5);","pitfall":"构造器没有返回类型；写 void App() 就成了普通方法，不是构造器。","exam":"Le type de retour ne permet pas de distinguer deux surcharges.","src":["C1","C6","J8","J15"],"level":"core"},{"id":"passvalue","chapter":"methods","title":"Java 只有值传递","fr":"Passage par valeur","summary":"传对象时复制的是“引用的值”，不是按引用传递变量。","body":["基本类型形参接收到实参值的副本；修改形参不会改变调用方变量。引用类型也复制引用值，形参与实参可指向同一个对象。","通过形参修改共享对象内部状态，调用方可以看到；让形参改指向另一个对象，不会重新赋值调用方变量。不要把前者说成 Java 有引用传递。","想交换调用方两个整数变量，不能只写 swap(int a,int b)。可返回新结构或修改数组中的两个位置；必须明确你交换的是哪些存储单元。"],"code":"static void changer(int[] a) {\n    a[0] = 9;             // 修改共享数组\n    a = new int[]{7};     // 仅改变局部形参\n}\n// int[] x={1}; changer(x); 之后 x[0] == 9","pitfall":"final 形参禁止重新给形参赋值，不禁止修改其所指对象。","exam":"Java passe toujours les arguments par valeur ; pour un objet, cette valeur est une référence.","src":["C6","J15"],"level":"core"},{"id":"overload","chapter":"methods","title":"重载与编译期选择","fr":"Surcharge et résolution","summary":"同名方法的参数列表不同，才可能构成重载。","body":["重载可改变参数数量、类型、类型顺序，不能只改参数名或返回类型。编译器根据实参的静态类型选择适用方法，不按对象运行时实际类型重新挑选重载。","优先考虑不需要装箱/可变参数的适用方法，再考虑装箱，最后可变参数；例如 m(long) 与 m(Integer) 对 int 实参优先 m(long)。存在多个同样合适的方法可能歧义。","Math.min(6,10.5) 选择 double 版本，结果 6.0。Java 小数写 9.25，不写 9,25；逗号是参数分隔符。泛型擦除后签名相同的两个方法也不能重载。"],"code":"static String f(Object x) { return \"Object\"; }\nstatic String f(String x) { return \"String\"; }\n// Object x = \"texte\";\n// f(x) 返回 \"Object\"；f(\"texte\") 返回 \"String\"。","pitfall":"f(String) 和 f(Integer) 同时存在时，f(null) 可能无法判定更具体方法而编译失败。","exam":"La surcharge est résolue à la compilation à partir des types déclarés des arguments.","src":["C0","C1","J8","J15","AMath"],"level":"core"},{"id":"varargs","chapter":"methods","title":"可变参数与方法组织","fr":"Paramètres variables et décomposition","summary":"T... 在方法中按数组使用，必须位于参数列表最后。","body":["static int somme(int... xs) 可以用 somme()、somme(1,2) 或 somme(new int[]{1,2}) 调用。一个方法只能有一个可变参数位置，且必须最后。","int... 与 int[] 在签名层面不能拿来互相重载；注意 null 调用可能被当成 null 数组而非一个元素。","拆分问题时，一个方法尽量做一个明确任务：生成数据、处理数据、格式化、测时。不要把输入、算法与输出全塞在一起，这也更易测试。"],"code":"static long somme(int... xs) {\n    java.util.Objects.requireNonNull(xs);\n    long s = 0;\n    for (int x : xs) s += x;\n    return s;\n}","pitfall":"泛型可变参数可能产生堆污染警告；考试基础代码优先使用 List<T> 或明确的 T[]。","exam":"Un paramètre variable est représenté par un tableau dans le corps de la méthode.","src":["C6","J8"],"level":"extra"},{"id":"recursion","chapter":"methods","title":"递归、基本情形与调用栈","fr":"Récursivité et cas de base","summary":"递归必须有可达的结束情形，并让问题规模减小。","body":["三个问题：最小问题如何直接返回？当前问题如何由更小问题解出？每次调用是否确实接近结束？求和可用 S(0)=0，S(n)=n+S(n-1)。课件 S(n≤1)=1 的代码只适用于 n≥1。","函数调用会保留各层局部状态。递归最大值、是否有序、回文都可使用下标而不是每次复制子数组/子串，避免不必要分配。","递归不是必然比循环快。线性递归常额外占 O(n) 调用栈；深度太大可能 StackOverflowError；Java 不保证尾递归优化。朴素 Fibonacci 有重复子问题。"],"code":"static long sommeR(int n) {\n    if (n < 0) throw new IllegalArgumentException(\"n < 0\");\n    if (n == 0) return 0;\n    return n + sommeR(n - 1);\n}\n// sommeR(3) = 3 + (2 + (1 + 0)) = 6","pitfall":"有 base case 但递归参数不朝它靠近，仍可能无限递归。","exam":"Il faut un cas terminal et une réduction du problème garantissant la terminaison.","src":["C1","C6","J8","J15"],"level":"core"},{"id":"complexity","chapter":"methods","title":"复杂度与性能比较","fr":"Complexité temporelle et spatiale","summary":"用输入规模 n 描述增长，不用“代码行少”判断效率。","body":["常见量级：O(1)、O(log n)、O(n)、O(n log n)、O(n²)、指数级。独立双重遍历通常 O(n²)，每次折半的循环通常 O(log n)；嵌套不必然平方，要看上下界。","区分最好、平均、最坏时间，以及额外空间；递归要计算栈空间。ArrayList 尾部添加是摊还 O(1)，单次扩容可能 O(n)，不要误写每次严格 O(1)。","测排序时所有算法需使用同一原数组的独立副本，避免后来的算法拿到已排序数据。用 System.nanoTime 计经过时间；多次预热和多次测量可降低偶然误差，课堂简单计时不是严格基准测试。"],"code":"int[] copie = java.util.Arrays.copyOf(original, original.length);\nlong debut = System.nanoTime();\njava.util.Arrays.sort(copie);\nlong dureeNs = System.nanoTime() - debut;","pitfall":"currentTimeMillis 是毫秒墙上时钟；nanoTime 用于时间差，不应解释成某个日历日期。","exam":"La complexité décrit la croissance du coût en fonction de la taille de l’entrée.","src":["C6","ASystem","AArrayList"],"level":"extra"},{"id":"classobject","chapter":"objects","title":"类、对象、属性与行为","fr":"Classe, objet, état et comportement","summary":"类是模型；对象是这个模型的具体实例。","body":["类将属性（état / propriétés / attributs / champs）与操作（comportements / méthodes）组织在一起。对象有身份、状态和行为；两个不同对象的状态可以相同。","Etudiant e; 声明一个 Etudiant 类型引用，不创建对象。new Etudiant(...) 创建并初始化实例。局部 e 未赋值不能读取；若是字段则默认 null。","面向对象的价值不仅是把函数放进类：用封装维护不变式，用接口表示契约，用合理对象关系分配责任。is-a 关系考虑继承；has-a 关系通常考虑组合。"],"code":"class Point {\n    private int x;\n    private int y;\n    Point(int x, int y) { this.x=x; this.y=y; }\n    void deplacer(int dx, int dy) { x+=dx; y+=dy; }\n}\n// Point p = new Point(1,2);","pitfall":"变量不是对象本身；多个变量可能引用同一对象。","exam":"Une classe définit un modèle ; un objet est une instance de cette classe.","src":["C0","C1","J8","AObject"],"level":"core"},{"id":"constructor","chapter":"objects","title":"构造器与默认构造器","fr":"Constructeurs","summary":"构造器与类同名，没有返回类型，负责实例初始化。","body":["可以重载多个构造器，参数列表需不同。只有未显式声明任何构造器时，编译器才提供默认无参构造器；一旦写了有参构造器，就不会额外自动补无参。仍可自行写无参构造器。","构造器不是普通方法，不能继承或重写，也不能声明 static/final/abstract。new 负责创建实例的表达式过程；构造器负责初始化，不宜把构造器本身等同于“分配内存的函数”。","默认构造器通常隐式调用 super()；父类没有可访问无参构造器时可能编译失败。构造器可以校验参数并抛异常，保证成功构建的实例满足不变式。"],"code":"class Compte {\n    private final String titulaire;\n    Compte(String titulaire) {\n        this.titulaire = java.util.Objects.requireNonNull(titulaire);\n    }\n    Compte() { this(\"Inconnu\"); }\n}","pitfall":"public void Compte() 不是构造器，因为多了 void。","exam":"Le constructeur par défaut n’est fourni que si aucun constructeur n’est déclaré.","src":["C0","C1","J8","AObject"],"level":"core"},{"id":"thissuper","chapter":"objects","title":"this、super 与初始化顺序","fr":"this, super et initialisation","summary":"this 表示当前实例；super 用于父类部分的访问或构造调用。","body":["同名参数遮蔽字段时，this.nom=nom 左边是字段、右边是参数。this(...) 调本类另一个构造器，super(...) 调父类构造器。按本文 Java 21 基线，显式构造器调用须位于构造器开头；更高版本变化不混入此规则。","初始化顺序理解为：先完成父类构造链，再执行本类实例字段初始化/实例初始化块，再执行本类构造器其余语句。字段先有默认值；类级静态初始化通常在首次主动使用时按规定进行。","super.m() 可显式调用父类实现；this.m() 使用当前对象的方法分派。不要在构造过程中依赖可重写方法读取尚未初始化的子类字段。"],"code":"class A {\n    A(int x) { System.out.print(\"A\"); }\n}\nclass B extends A {\n    B() {\n        super(1);\n        System.out.print(\"B\");\n    }\n}\n// new B() 输出 AB","pitfall":"this(...) 与 super(...) 不能同时成为同一个 Java 21 构造器中的显式首调用；this 构造链不能形成环。","exam":"super(...) initialise la partie héritée de l’objet.","src":["C1","C3","J8"],"level":"core"},{"id":"visibility","chapter":"objects","title":"访问权限与 protected 边界","fr":"Visibilité et contrôle d’accès","summary":"public、protected、包可见、private 决定能否访问。","body":["public：在普通非模块化课程程序中对外可见；protected：同包可见，跨包子类可按限制访问；无修饰符：仅同包；private：限制在声明所在顶层类型及其嵌套结构的访问上下文内，课程可先理解为类内部。","跨包 protected 不是“子类可以通过任何父类对象访问字段”。在子类内部，对实例成员的受保护访问还受接收者静态类型限制，通常通过 this、super 或该子类/其子类实例。","顶层类不能写 private/protected，通常是 public 或包可见。权限是编译期检查，不是运行时查看实际对象再放行。提供公开方法也不能跳过业务校验。"],"code":"// 包 p：public class A { protected int x; }\n// 包 q：class B extends p.A {\n//   void test(B b, p.A a) {\n//       this.x = 1; b.x = 2;  // 可以\n//       // a.x = 3;           // 跨包下通常不可以\n//   }\n// }","pitfall":"protected 既不是“只对所有子类可见”，也不是“对外完全不可见”：同包代码也可访问。","exam":"L’accès protected est autorisé dans le même paquetage et, sous conditions, dans les sous-classes.","src":["C1","J6"],"level":"core"},{"id":"encapsulation","chapter":"objects","title":"封装不是自动生成 getter/setter","fr":"Encapsulation et invariants","summary":"封装要隐藏表示并控制合法状态，而不只是把字段改成 private。","body":["例：年龄不得为负、分数在 0～20、余额操作遵守业务规则。不加校验的 setAge(-5) 会破坏不变式；只生成方法并不等于安全封装。","只暴露调用方需要的行为，不必每个字段都有 setter/getter。不可变属性无 setter；某些状态应用 deposer()/retirer() 等业务方法而非任意 setSolde。","返回内部可变数组或列表会泄露表示，即使字段 private。输入端也要复制，否则外部通过原参数仍能修改内部状态。浅复制只隔离容器结构，不隔离其内部可变元素。"],"code":"private int age;\npublic void setAge(int age) {\n    if (age < 0) throw new IllegalArgumentException(\"age negatif\");\n    this.age = age;\n}\npublic int getAge() { return age; }","pitfall":"getter 返回内部列表后，调用方 list.clear() 可绕过所有 setter。","exam":"L’encapsulation protège les invariants et cache la représentation interne.","src":["C0","C1","J8","AObject"],"level":"core"},{"id":"student","chapter":"objects","title":"Etudiant：双向防御性复制","fr":"Copie défensive dans Etudiant","summary":"课程例子应同时保护传入数组和返回数组。","body":["构造器将 notes 复制到内部数组，阻断与调用方输入的别名关系；getter 再返回副本，阻断调用方与内部表示的别名关系。","final double[] notes 表示字段引用固定，不表示数组内容不可变。因为 String 自身不可变，返回 nom 不需要为安全封装再 new String。","若需要提供成绩修改功能，暴露带边界与数值校验的 setNote(index,note)，而非直接暴露数组。完整可运行的 Etudiant 示例位于代码包与“算法/实现”区。"],"code":"class Etudiant {\n    private final double[] notes;\n    Etudiant(double[] notes) {\n        this.notes = java.util.Arrays.copyOf(notes, notes.length);\n    }\n    public double[] getNotes() {\n        return java.util.Arrays.copyOf(notes, notes.length);\n    }\n}","pitfall":"只复制 getter 不复制构造器参数，或只复制构造器不复制 getter，都仍有入口泄露内部数组。","exam":"La copie défensive est nécessaire à l’entrée et à la sortie lorsque la représentation est mutable.","src":["C0","C1","AArrays"],"level":"core"},{"id":"static","chapter":"objects","title":"static：类成员与实例成员","fr":"Membres de classe et d’instance","summary":"static 成员关联类，不关联某个特定对象实例。","body":["实例字段每个对象各有一份；static 字段在该类的运行时身份中共享。static 方法可以通过类名调用，不需要先创建实例，常用于 Math 工具函数。","静态方法没有 this/super，不能无对象地直接访问实例字段；但可以通过显式对象引用访问其可访问的实例成员。课件“不能访问实例属性”的表述要理解为不能直接访问当前实例。","实例方法可访问本类静态成员。语法可能允许通过对象表达式调用静态方法，但应写 ClassName.method()，避免误以为它发生动态分派。共享可变静态状态容易导致耦合。"],"code":"class Compteur {\n    private static int total;\n    Compteur() { total++; }\n    static int getTotal() { return total; }\n}\n// new Compteur(); new Compteur();\n// Compteur.getTotal() == 2","pitfall":"static 不等于常量，也不等于线程安全。","exam":"Une méthode statique n’a pas de référence this, mais peut utiliser une référence explicite vers un objet.","src":["C0","C1","J8","AObject"],"level":"core"},{"id":"final","chapter":"objects","title":"final 的三种含义","fr":"Variable, méthode et classe final","summary":"变量不能再次赋值；方法不能被重写；类不能被继承。","body":["final 基本类型变量赋值后值不再变；final 引用变量赋值后所指对象不变，但对象内部可变。实例 final 字段可在声明处、实例初始化块或每条构造路径中恰好初始化。","static final 字段可在声明处或静态初始化块赋值，不是必须在声明同一行。只有符合规则的 final 基本类型/String 且以常量表达式初始化，才是编译期常量变量。","final 实例方法不能被子类重写；final 类不能被 extends。abstract final 类不合法，abstract final 方法也矛盾。final 不决定可见性，private 与 final 不是同义词。"],"code":"final int[] a = {1};\na[0] = 9;                  // 合法\n// a = new int[]{2};       // 编译错误\nstatic final int LIMITE;\nstatic { LIMITE = 100; }    // 合法（置于类体）","pitfall":"不要将“不可重新赋值”与“深不可变”混为一谈。","exam":"final fige une affectation, pas nécessairement le contenu de l’objet référencé.","src":["C0","C1","J8","AObject"],"level":"core"},{"id":"equals","chapter":"objects","title":"==、equals 与相等性契约","fr":"Identité et égalité logique","summary":"== 问是不是同一个对象；equals 问按业务定义是否相等。","body":["Object.equals 默认相当于身份相等。自定义值对象要重写 public boolean equals(Object obj)，不能误写 equals(Point p) 当成重写；后者仅是重载。使用 @Override 可捕获这种错误。","equals 契约：自反、对称、传递、一致；x 非 null 时 x.equals(null) 为 false。比较数值、String、数组要用适当规则；对数组内容使用 Arrays.equals。","继承会使相等性定义复杂。简单值对象可设为 final，并用 getClass() 或受控 instanceof 实现；必须决定跨子类是否允许相等，不要盲目混用两种策略。"],"code":"@Override public boolean equals(Object o) {\n    if (this == o) return true;\n    if (o == null || getClass() != o.getClass()) return false;\n    Point p = (Point) o;\n    return x == p.x && y == p.y;\n} // 此片段放在具有 x,y 字段的 Point 类中","pitfall":"两个 new 出来的内容相同对象，不会因为字段相同就自动 equals 为 true。","exam":"equals définit l’égalité logique ; == compare l’identité des références.","src":["C0","C1","J8","AObject"],"level":"core"},{"id":"hashcode","chapter":"objects","title":"hashCode、哈希容器与可变键","fr":"Contrat de hachage","summary":"equals 相等的两个对象必须有相同 hashCode；反向不成立。","body":["哈希值用于 HashMap/HashSet 等结构先定位候选区域，再用 equals 判断。碰撞是允许的，不能用“哈希相同”推出“对象相等”。","重写 equals 时通常必须同步重写 hashCode，并使用相同业务字段。Objects.hash 适合多个对象/标量字段，数组字段应使用 Arrays.hashCode，而不是只按数组身份哈希。","将对象作为哈希键后，修改影响 equals/hashCode 的字段，会破坏查找所依赖的位置关系；可能 contains/get 找不到同一对象。优先使用不可变键。"],"code":"@Override public int hashCode() {\n    return java.util.Objects.hash(x, y);\n}\n// 数组字段：return java.util.Arrays.hashCode(coefficients);","pitfall":"只有 hashCode 没有 equals，或只有 equals 没有配套 hashCode，都不足以正确表达自定义值相等。","exam":"Deux objets égaux doivent avoir le même hashCode, mais une collision ne prouve pas leur égalité.","src":["C0","C1","J8","AObject"],"level":"core"},{"id":"polynomial","chapter":"objects","title":"Polynôme：相等性先定义数学含义","fr":"Égalité des polynômes","summary":"自动生成 equals 可能比较表示，而不是比较你想表达的值。","body":["假设 coefficients[i] 表示 x 的 i 次项系数，则 [1,2] 和 [1,2,0] 表示同一个多项式。若要求数学上相等，直接 Arrays.equals 会因长度不同而判 false。","可在构造时去掉最高次端的冗余零，将零多项式统一为 [0]，并将 -0.0 归一为 +0.0；之后 equals 与 hashCode 都对规范化数组工作。完整实现明确拒绝 NaN/Infinity，避免不清楚的数学语义。","不能随意用 |a-b|<epsilon 定义 equals，因为容差相等可能不满足传递性，难以与 hashCode 一致。需要近似比较时，另设 approximatelyEquals，不冒充 Java 相等性契约。"],"code":"// 系数按常数项到最高次项排列：\n// [1,2]      表示 1 + 2x\n// [1,2,0]    仍表示 1 + 2x\n// 规范化后均为 [1,2]\n// 求值可用 Horner：从最高次系数向下执行 r = r*x + c[i]。","pitfall":"是否忽略尾部零、如何处理浮点、是否允许子类相等，都必须在实现 equals 前决定。","exam":"L’égalité doit porter sur la valeur représentée, pas seulement sur sa représentation en mémoire.","src":["C0","AObject","AArrays"],"level":"core"},{"id":"tostring","chapter":"objects","title":"toString、调试与不变性","fr":"Représentation textuelle","summary":"toString 返回描述字符串，不等于直接打印。","body":["标准签名为 public String toString()。println(obj) 会利用字符串转换，通常调用对象 toString；null 会显示为 \"null\"。","数组直接 println 常显示类型/身份形式，不是元素列表；使用 Arrays.toString/deepToString。链表 toString 应覆盖空表与 null 元素，不因没有节点就访问 null。","输出格式是接口的一部分：题目要求 \"{a,b}\" 就明确分隔符、空表 \"{}\"、是否有尾逗号。toString 应避免无意修改对象状态；调试字符串不宜作为可靠的持久化格式。"],"code":"@Override public String toString() {\n    return \"Point(\" + x + \", \" + y + \")\";\n}","pitfall":"方法名必须是 toString，返回类型必须为 String；hashCode 中 C 也要大写。","exam":"toString retourne une représentation textuelle de l’objet.","src":["C0","C1","C2","AObject"],"level":"core"},{"id":"genericwhy","chapter":"generics","title":"为什么需要泛型","fr":"Motivation de la généricité","summary":"在编译期约束类型，同时复用一份实现。","body":["为 String、Point、Etudiant 各复制一套列表会重复代码且难维护。统一存 Object 虽可复用，但取出时常需强转，错误被推迟到运行时。","泛型把类型作为参数，例如 class Paire<T>。编译器在 Paire<String> 的使用处检查 setFirst 的参数和 getFirst 的返回类型，不需处处手写强转。","泛型不是“运行时自动生成任意类”；它主要提供静态类型安全。Java 普通泛型实参必须是引用类型，用 Integer 而不是 int。"],"code":"class Paire<T> {\n    private T first, second;\n    Paire(T first, T second) { this.first=first; this.second=second; }\n    T getFirst() { return first; }\n    void setFirst(T first) { this.first=first; }\n}\n// Paire<String> p = new Paire<>(\"nom\", \"prenom\");","pitfall":"Paire<String> 不能 setFirst(3)；使用原始类型会绕过一部分本应存在的检查。","exam":"La généricité permet la réutilisation du code avec un contrôle des types à la compilation.","src":["C2","J4","J8"],"level":"core"},{"id":"genericterms","chapter":"generics","title":"五个泛型术语：必须中法对应","fr":"Vocabulaire des types génériques","summary":"参数与实参、泛型类型与参数化类型不能混淆。","body":["paramètre de type：声明中的类型参数 T；argument de type：使用时填入的具体类型 String。","classe/type générique：声明了类型参数的类，如 Paire<T>；type paramétré：已指定类型实参的类型，如 Paire<String>；type brut：省略实参的原始类型 Paire。","菱形运算符 <> 让编译器推断构造表达式的类型实参，不代表原始类型。T/U/E/K/V/R 是习惯名称，不是保留关键字：E 元素、K 键、V 值、R 结果。"],"code":"Paire<String> p = new Paire<>(\"a\", \"b\");\n// 左侧 String：argument de type\n// 类声明中的 T：paramètre de type\n// Paire brut = p;   // 原始类型，不推荐","pitfall":"把 T 叫“实参”或把 String 叫“参数变量”，容易在法语填空题中失分。","exam":"T est un paramètre de type ; String est un argument de type dans Paire<String>.","src":["C2","J4","J8"],"level":"core"},{"id":"tuple","chapter":"generics","title":"多个类型参数与嵌套泛型","fr":"Types multiples et imbriqués","summary":"类型参数彼此独立，可把参数化类型作为另一个类型实参。","body":["Paire<T> 的两元素同类型；Tuple<T,U> 可让两个位置类型不同。读取第一个位置得到 T，第二个得到 U，类型信息贯穿构造器、字段、返回值和参数。","Tuple<String,Paire<Integer>> 表示第一个元素是 String，第二个元素是一个整数对。先逐层拆开类型，再追踪链式调用。","构造器声明只写 Tuple(...)，不是 Tuple<T,U>(...)；类名后的类型参数在类声明处确定。创建时可以 new Tuple<>(...)。"],"code":"class Tuple<T,U> {\n    private final T first;\n    private final U second;\n    Tuple(T a,U b) { first=a; second=b; }\n    T getFirst(){return first;}\n    U getSecond(){return second;}\n}\n// Tuple<String,Paire<Integer>> t =\n//     new Tuple<>(\"premiers\", new Paire<>(7,19));","pitfall":"泛型嵌套中，外层 T 与另一独立类声明中的 T 不是同一个类型变量。","exam":"Un argument de type peut lui-même être un type paramétré.","src":["C2","J4","J8"],"level":"core"},{"id":"genericmethods","chapter":"generics","title":"泛型方法与 static 的合法写法","fr":"Méthodes génériques","summary":"方法自己的 <T> 写在返回类型之前。","body":["public static <T> T premier(T[] a) 中，方法声明了自己的 T，不依赖外层类是否泛型。普通类、泛型类中都可声明泛型方法。","class Boite<T> 中 static T valeur 非法，因为 static 不是某个具体 Boite<String> 的成员。但 static <U> U identite(U x) 合法，U 属于该静态方法。","课件 Tools.affiche 每轮把新元素前置，所以输出顺序是倒序，且可能尾部有空格；遇 null 会在 t.toString 处失败。方法名不能代替逐行阅读实际实现。"],"code":"static <T> T premier(T[] a) {\n    if (a.length == 0) throw new IllegalArgumentException(\"vide\");\n    return a[0];\n}\nstatic <T> String inverse(T[] a) {\n    StringBuilder b = new StringBuilder();\n    for (int i=a.length-1;i>=0;i--) {\n        if (b.length()>0) b.append(' ');\n        b.append(a[i]);\n    }\n    return b.toString();\n}","pitfall":"static <T> 与使用外层类的 T 完全不同；没有声明方法 T 时不能凭空使用它。","exam":"Une méthode générique déclare ses propres paramètres de type avant le type de retour.","src":["C2","J4","J8"],"level":"core"},{"id":"genericarrays","chapter":"generics","title":"泛型数组：声明合法，直接创建受限","fr":"Tableaux et généricité","summary":"T[] 可作为类型出现，但 new T[n] 不合法。","body":["可以声明 T[] 字段、接收外部传来的 String[]/Integer[]。数组在运行时记得其元素运行时类型，而普通泛型实参被擦除，new T[n] 无法建立必要的运行时检查信息。","new Paire<String>[10] 不合法；课件 (Paire<String>[])new Paire[10] 可编译但有 unchecked 警告，不能标成类型安全的普通解法。建议 List<Paire<String>>。","(T[])new Object[n] 不是任意 T[] 的安全通用创建方式；当其以 String[] 暴露出去时可能 ClassCastException。需要真实数组时可传入现成数组、Class<T> 或数组工厂 IntFunction<T[]>。"],"code":"static <T> T[] creer(int n, java.util.function.IntFunction<T[]> factory) {\n    return factory.apply(n);\n}\n// String[] noms = creer(3, String[]::new);\n// 也可：List<Paire<String>> liste = new ArrayList<>();","pitfall":"声明 Paire<String>[] 变量与 new Paire<String>[n] 创建表达式不是同一回事。","exam":"On peut déclarer T[], mais on ne peut pas instancier directement new T[n].","src":["C2","J4","J8"],"level":"core"},{"id":"erasure","chapter":"generics","title":"类型擦除与限制","fr":"Effacement des types","summary":"编译后通常不能通过对象运行时类区分不同泛型实参。","body":["同一声明产生的 Paire<String> 与 Paire<Integer> 共享同一个运行时类。无界类型变量擦除为 Object；有界类型变量通常擦除为第一个边界。编译器可插入强转与桥接方法维护语义。","常见限制：不能 new T()、不能 new T[n]、不能 static T 使用外层 T、不能用基本类型实参；不能只靠 List<String>/List<Integer> 的差别重载，因为擦除后冲突。","不能用 Object o; o instanceof List<String> 在运行时验证元素均为 String；o instanceof List<?> 合法。Java 16+ 放宽了某些可静态确认的参数化 instanceof，例如已知 List<String> 引用检测 ArrayList<String>；这仍不检验运行时元素类型。"],"code":"java.util.List<String> a = new java.util.ArrayList<>();\njava.util.List<Integer> b = new java.util.ArrayList<>();\nSystem.out.println(a.getClass() == b.getClass()); // true\nObject o = a;\nSystem.out.println(o instanceof java.util.List<?>); // true","pitfall":"不要绝对背诵“所有带尖括号的 instanceof 都不允许”；必须考虑操作数静态类型和 Java 版本。","exam":"L’effacement empêche de vérifier arbitrairement les arguments de type à l’exécution.","src":["C2","J4","J8","J15"],"level":"core"},{"id":"bounds","chapter":"generics","title":"边界、泛型不变性与 PECS","fr":"Bornes, invariance et jokers","summary":"List<Integer> 不是 List<Number> 的子类型。","body":["即使 Integer extends Number，也不能将 List<Integer> 赋给 List<Number>，否则后者可以 add(3.14) 破坏整数列表。数组的协变与泛型的不变性不要混淆。","List<? extends Number> 是 Number 的某个未知子类型的列表：读取为 Number，但不能安全加入普通 Integer/Double 值；List<? super Integer> 可接收 Integer，读取时一般只能当 Object。PECS：Producer Extends, Consumer Super。","类型参数边界 <T extends Number> 限制 T；<T extends Comparable<? super T>> 常用于可比较元素。边界引用接口也用 extends，不用 implements。List<?> 不是 List<Object>；前者元素类型未知。"],"code":"static double somme(java.util.List<? extends Number> xs) {\n    double s=0;\n    for (Number x : xs) s += x.doubleValue();\n    return s;\n}\nstatic void ajouter(java.util.List<? super Integer> xs) { xs.add(1); }","pitfall":"“不能 add”指不能加入不明确安全的非 null 值；对未知类型仍可能 add(null)，但集合自身也可能禁止 null/修改。","exam":"Un producteur utilise extends ; un consommateur utilise super.","src":["J4","J8","AList"],"level":"extra"},{"id":"linkedmodel","chapter":"generics","title":"链表模型与表示不变式","fr":"Liste chaînée et invariant","summary":"节点存值与下一节点引用；头尾必须一致。","body":["空表：tete==null 且 queue==null；非空表：queue.suivant==null，并且从 tete 能到达 queue。维护 size 时还应与实际节点数相等。","尾插：创建新节点；空表头尾同时指它；非空表旧尾.next 指新节点，再更新尾。删除头：保存值、头移到 next；若删后空表，尾也必须置 null。","课件 removeFirst 没有清空最后一个元素后的 queue；toString 在空表直接 crt.getSuivant 会 NPE，非最后的 null 元素也会 NPE。网站提供修正版，并不把这些问题照抄为正确实现。"],"code":"// 删除首节点的关键不变式恢复：\nT value = head.value;\nhead = head.next;\nif (head == null) tail = null;\nsize--;\nreturn value;","pitfall":"不要把自定义 LinkedList 与 java.util.LinkedList 同名混用；示例统一叫 ListeChainee。","exam":"Après la suppression du dernier élément, la tête et la queue doivent être null.","src":["C2"],"level":"core"},{"id":"inherit","chapter":"inheritance","title":"继承与组合","fr":"Héritage et composition","summary":"类最多直接继承一个类，但可以实现多个接口。","body":["extends 表示子类型/专门化：class Etudiant extends Personne。继承可以复用可访问行为，并添加新属性/方法；构造器不继承，private 成员不能被子类直接访问。","子类对象包含父类状态；不能因为 private 不可直接访问就说“父类 private 状态不存在”。可通过父类公开/受保护方法间接操作受控制状态。","继承应表达可替代关系 is-a，不应只为复用几行代码。例如 Voiture 有 Moteur 应考虑组合字段，而不是 Voiture extends Moteur。"],"code":"class Personne {\n    private final String nom;\n    Personne(String nom) { this.nom=nom; }\n    public String getNom() { return nom; }\n}\nclass Etudiant extends Personne {\n    Etudiant(String nom) { super(nom); }\n}","pitfall":"Java 不允许 class C extends A, B；接口的多继承不等于多个类的状态继承。","exam":"L’héritage exprime une spécialisation ; la composition exprime une relation « possède ».","src":["C3","J8","J9"],"level":"core"},{"id":"override","chapter":"inheritance","title":"重写与重载的区别","fr":"Redéfinition et surcharge","summary":"重写同一行为的实现；重载提供不同参数形态。","body":["实例方法重写要求签名匹配，并满足返回类型可替换（引用返回可协变）。访问权限不能更严格；不能抛出比父方法更宽泛的受检异常。使用 @Override。","final 方法不能重写；private 方法不被子类继承为可重写方法；static 方法同名对应的是隐藏，不是实例动态重写。字段也不是按实例方法方式多态。","重载在编译期选择哪个签名；重写在运行时根据实际对象选择该签名的实现。两者可同时出现，分析顺序不能颠倒。"],"code":"class Animal {\n    public String parler() { return \"?\"; }\n}\nclass Chat extends Animal {\n    @Override public String parler() { return \"miaou\"; }\n}\n// Animal a = new Chat(); a.parler() 返回 \"miaou\"。","pitfall":"将参数类型从 Animal 改成 Chat 通常不是重写，而是另一个重载。","exam":"La redéfinition conserve la signature et spécialise le comportement hérité.","src":["C3","J8","J9"],"level":"core"},{"id":"dispatch","chapter":"inheritance","title":"静态类型、实际类型与动态分派","fr":"Type déclaré et type réel","summary":"引用的静态类型决定可调用什么；实际对象决定重写方法执行什么。","body":["Animal a=new Chat()：静态类型 Animal，动态类型 Chat。只能调用 Animal 类型可见的方法；若 Chat 新增 griffer，不能直接 a.griffer()。","调用被重写的实例方法时，执行 Chat 的实现。若访问字段或 static 方法，则按静态解析规则，不因实际对象是 Chat 就自动选择子类版本。","强转只改变编译器对引用的看法，不把一个 Animal 对象改造成 Chat 对象。Object[] a=new String[1] 可编译，但 a[0]=1 在运行时 ArrayStoreException。"],"code":"class A { int x=1; String f(){return \"A\";} }\nclass B extends A { int x=2; @Override String f(){return \"B\";} }\n// A a=new B();\n// a.x 为 1；a.f() 为 \"B\"。","pitfall":"先看“访问字段还是调用实例方法”，再判断是否动态分派。","exam":"Le type déclaré détermine l’accessibilité ; le type réel détermine l’implémentation redéfinie.","src":["C3","J8","J9"],"level":"core"},{"id":"casting","chapter":"inheritance","title":"向上转型、向下转型与 instanceof","fr":"Transtypage et test de type","summary":"向下转型需有真实类型兼容，不是写了括号就保证成功。","body":["子类引用赋给父类型称向上转型，通常隐式且不丢掉实际对象。父类型显式强转为子类，若实际对象不兼容会 ClassCastException。","instanceof 检查对象是否可按相应引用类型使用；null instanceof Type 总为 false。Java 21 支持模式变量，if(o instanceof String s) 中 true 分支可用 s。","某些根本不可能的类型转换编译器会直接拒绝。分析题目要先判编译，再判运行；不能把所有强转错误都叫运行时错误。"],"code":"Object o = \"bonjour\";\nif (o instanceof String s) {\n    System.out.println(s.length());\n}\n// Integer i = (Integer)o;  // 编译可过，运行时 ClassCastException","pitfall":"instanceof 不会创建新对象，也不能普遍检查集合里每个元素的泛型实参。","exam":"Un cast ne transforme pas l’objet ; il change la manière de traiter sa référence.","src":["C3","J8","J9"],"level":"core"},{"id":"abstract","chapter":"inheritance","title":"抽象类与抽象方法","fr":"Classe abstraite","summary":"抽象类不能直接实例化，但可以有构造器和普通方法。","body":["abstract class 表示本类不直接构造实例，可为子类提供共有状态、实现和契约。它可以包含零个、一个或多个抽象方法；“至少有一个抽象方法”不是必要条件。","存在未实现抽象方法的普通类必须 abstract。具体子类必须实现其所有未完成抽象方法；不实现则子类也声明 abstract。抽象方法以分号结束，没有方法体。","可以声明抽象类类型变量、参数、返回值，并用具体子类实例赋值。抽象类构造器会在创建子类时被调用，不能直接 new 抽象类本身。"],"code":"abstract class Forme {\n    private final String nom;\n    Forme(String nom) { this.nom=nom; }\n    String getNom() { return nom; }\n    abstract double aire();\n}\nclass Carre extends Forme {\n    private final double cote;\n    Carre(double c) { super(\"carre\"); cote=c; }\n    @Override double aire() { return cote*cote; }\n}","pitfall":"abstract class Vide {} 合法；new Vide() 不合法。","exam":"Une classe abstraite peut ne contenir aucune méthode abstraite.","src":["C3","J8","J9"],"level":"core"},{"id":"interfaces","chapter":"inheritance","title":"接口、默认方法与冲突","fr":"Interface et contrat","summary":"接口定义可提供什么行为，不要求只有抽象方法。","body":["接口字段隐式 public static final；常规无体方法隐式 public abstract。Java 21 接口还可有 default、static、private 方法；它们不增加必须实现的抽象契约数量。","类 implements 一个或多个接口；接口 extends 一个或多个接口。具体类必须实现仍未实现的抽象方法，不必重写所有 default 方法或实现接口 static 方法。实现接口公开方法时必须保持 public。","default 方法可继承及重写；遇两个无关接口提供冲突默认方法时通常需显式重写消歧义，可调用 I.super.m()。接口 static 方法通常通过接口名调用，不作为实例继承方法。"],"code":"interface Nommable {\n    String nom();\n    default String etiquette() { return \"Nom: \" + nom(); }\n    static String categorie() { return \"entite\"; }\n}\nclass Client implements Nommable {\n    @Override public String nom() { return \"Lea\"; }\n}","pitfall":"不能说“接口里所有方法都必须由实现类重写”，default/static/private 是反例。","exam":"Une interface définit un contrat ; ses méthodes default peuvent fournir une implémentation.","src":["C3","J8","J9"],"level":"core"},{"id":"polymorphism","chapter":"inheritance","title":"三种多态与抽象类/接口选择","fr":"Formes de polymorphisme","summary":"课程把重载、泛型、继承都归入多态讨论。","body":["重载：同名不同参数形式；泛型：同一实现对不同类型参数化；继承多态：父类型引用多种子类型对象，并通过重写执行不同实现。答题时说明你指的是哪一种。","抽象类适合共享实例状态、构造逻辑和部分实现；接口适合表达跨类层次的能力/契约，支持多实现。不能用“接口没有方法体”作为两者本质区别，因为有 default。","面向接口声明：List<String> xs=new ArrayList<>()。左侧契约稳定，右侧实现可替换，但调用范围受 List 接口限制。"],"code":"java.util.List<String> xs = new java.util.ArrayList<>();\nxs.add(\"A\");\n// 可换为其他 List 实现，但只依赖 List 的契约。","pitfall":"“Java 支持多态”不意味着方法参数动态选重载，也不意味着类能多继承。","exam":"Le cours distingue la surcharge, la généricité et le polymorphisme lié à l’héritage.","src":["C3","J8","J9"],"level":"core"},{"id":"choosecollection","chapter":"collections","title":"选结构：数组、List、Set、Map、Deque","fr":"Choisir une structure","summary":"先看操作需求：索引、唯一性、键值还是先进先出。","body":["数组固定大小、可存基本类型、下标访问 O(1)；List 是有顺序可重复序列；Set 表达不重复元素；Map 关联键和值，不是 Collection 子接口。","ArrayList 适合索引读取与尾部追加；LinkedList 双链表适合已定位节点处链接操作，但按下标定位通常 O(n)，并不是任意插入都自动 O(1)。","HashSet/HashMap 通常用于基于哈希的查找，顺序无保证；LinkedHashSet/LinkedHashMap 常用插入顺序；TreeSet/TreeMap 按比较规则排序，常见基本操作 O(log n)。Deque 可作栈或队列。"],"code":"java.util.List<String> ordre = new java.util.ArrayList<>();\njava.util.Set<String> uniques = new java.util.HashSet<>();\njava.util.Map<String,Integer> notes = new java.util.HashMap<>();\njava.util.Deque<Integer> file = new java.util.ArrayDeque<>();","pitfall":"“有序”必须说明是保存插入/遍历顺序，还是按比较规则已排序（trié）。","exam":"Une List conserve une séquence ; un Set interdit les doublons ; une Map associe clés et valeurs.","src":["C6","C2","AList","ASet","AMap","ADeque"],"level":"extra"},{"id":"listusage","chapter":"collections","title":"List 与 ArrayList：添加、替换和删除","fr":"Manipuler une liste","summary":"size() 是长度；get/set 使用索引，add 与 set 不同。","body":["add(e) 通常追加；add(i,e) 插入并后移元素；set(i,e) 替换已有元素并返回旧值，不增加长度。get(i) 读取；contains 基于相等性判断。","List<Integer> 的 remove(int index) 与 remove(Object value) 最常混淆：remove(1) 删除下标 1；remove(Integer.valueOf(1)) 删除第一个值 1。","ArrayList 初始容量不等于已存在元素数量：new ArrayList<>(10).size()==0，因此立即 set(0,x) 越界。subList 通常是原列表上的视图，改变结构要注意关联。"],"code":"java.util.List<Integer> xs = new java.util.ArrayList<>(java.util.List.of(10,20,10));\nxs.remove(1);                       // [10,10]\nxs.remove(Integer.valueOf(10));      // [10]\nxs.set(0, 99);                      // [99]","pitfall":"ArrayList 可以容纳 null；List.of 则禁止 null，不要把具体实现行为套到所有列表。","exam":"remove(int) supprime par indice ; remove(Object) supprime par valeur.","src":["AList","AArrayList"],"level":"extra"},{"id":"immutablelists","chapter":"collections","title":"可修改、定长、不可修改与视图","fr":"Modifiable, taille fixe et vue","summary":"这四个概念不能只用“能不能改”笼统判断。","body":["new ArrayList<>(source) 可增删替换，复制结构但共享元素引用。Arrays.asList(array) 通常定长且由数组支持，可替换元素，不可增删。","List.of(...) 不可修改且禁止 null；List.copyOf(source) 提供不可修改的列表并拒绝 null，不承诺每次创建新对象。Collections.unmodifiableList(list) 是不可修改视图，底层 list 的变化仍可反映。","Stream.toList()（Java 16+）返回不可修改列表；Collectors.toList() 不保证具体类型/可修改性；需要明确可变 ArrayList 时 collect(Collectors.toCollection(ArrayList::new))。不可修改容器不等于元素深不可变。"],"code":"java.util.List<String> xs = new java.util.ArrayList<>();\njava.util.List<String> vue = java.util.Collections.unmodifiableList(xs);\nxs.add(\"A\");\nSystem.out.println(vue); // [A]\n// vue.add(\"B\");        // UnsupportedOperationException","pitfall":"工厂创建、视图包装、结构复制、深拷贝是不同语义；不能互相替代描述。","exam":"Une vue non modifiable peut refléter les modifications de sa collection sous-jacente.","src":["AList","ACollections","AArrays","AStream","ACollectors"],"level":"extra"},{"id":"setmap","chapter":"collections","title":"Set、Map 与相等性","fr":"Ensembles et dictionnaires","summary":"Set 去重按实现的相等/比较规则；Map 的键唯一，值可重复。","body":["HashSet 使用 equals/hashCode 判断逻辑重复，HashMap 也依赖它们处理键。TreeSet 的重复判断按比较结果是否为 0，因此 Comparator 应与期望的相等性协调。","Map.put(k,v) 新建或替换值，返回旧值；get(k) 不存在可能返回 null，但某些 Map 可存 null 值，所以 null 不一定表示没有键；用 containsKey 区分。","遍历键值对通常用 entrySet，而不是遍历 keySet 后反复 get。频次统计用 getOrDefault 或 merge；HashMap 的遍历顺序不能当排序结果。"],"code":"java.util.Map<String,Integer> freq = new java.util.HashMap<>();\nfor (String mot : java.util.List.of(\"a\",\"b\",\"a\")) {\n    freq.merge(mot, 1, Integer::sum);\n}\nfor (var e : freq.entrySet()) {\n    System.out.println(e.getKey() + \"=\" + e.getValue());\n}","pitfall":"对 HashMap 的逐行输出不要强行给出唯一顺序，除非代码保证了顺序。","exam":"Les clés d’une Map sont uniques ; ses valeurs ne le sont pas nécessairement.","src":["AMap","AHashMap","ASet","AComparator"],"level":"extra"},{"id":"deque","chapter":"collections","title":"栈、队列与双端队列","fr":"Pile, file et deque","summary":"栈 LIFO，队列 FIFO；用 Deque 明确哪端进出。","body":["栈：push 入栈、pop 出栈、peek 查看栈顶。队列：offerLast 入队、pollFirst 出队、peekFirst 查看队头。ArrayDeque 常用于这些任务，禁止 null 元素。","异常型方法与特殊值型方法成对：removeFirst 空时抛 NoSuchElementException，pollFirst 空时返回 null；getFirst 与 peekFirst 类似。","双链表节点还包含 prev；删除中间节点要同时修复两边链接。头尾边界单独处理。ArrayDeque 是可增长数组实现，不是你在课程里手写的链表。"],"code":"java.util.Deque<Integer> q = new java.util.ArrayDeque<>();\nq.offerLast(1); q.offerLast(2);\nSystem.out.println(q.pollFirst()); // 1，FIFO\nq.push(9);\nSystem.out.println(q.pop());       // 9，LIFO","pitfall":"同一个 Deque 混用两种语义时，先画出头尾，否则容易把 BFS 写成 DFS。","exam":"Une file est FIFO ; une pile est LIFO.","src":["C2","ADeque","AArrayDeque"],"level":"extra"},{"id":"iterator","chapter":"collections","title":"迭代器与安全删除","fr":"Itérateur et suppression","summary":"遍历时不要随意通过容器本身结构修改它。","body":["Iterator 的基本协议：hasNext 判断、next 取下一个；没有元素时 next 抛 NoSuchElementException。支持删除的迭代器可在 next 后调用 remove 删除刚返回元素。","enhanced for 通常基于迭代器；在遍历 ArrayList 时直接 xs.remove(...) 可能触发 ConcurrentModificationException，但 fail-fast 是尽力检测，不是每次保证抛出。不能把这种异常当程序正确性的保障。","删除满足条件的元素可用 removeIf(predicate)，或显式 iterator.remove；按下标删除时考虑倒序，以免后移造成跳过元素。"],"code":"java.util.List<Integer> xs = new java.util.ArrayList<>(java.util.List.of(1,2,3,4));\nfor (var it=xs.iterator(); it.hasNext();) {\n    if (it.next()%2==0) it.remove();\n}\n// xs 为 [1,3]；也可 xs.removeIf(x -> x%2==0);","pitfall":"Iterator.remove 不能在第一次 next 之前调用，也不能对同一次 next 连续删除两次。","exam":"L’itérateur permet une suppression cohérente pendant le parcours.","src":["AIterator","AList"],"level":"extra"},{"id":"comparison","chapter":"collections","title":"Comparable 与 Comparator","fr":"Ordre naturel et comparateur","summary":"compare 返回负、零、正，不要求恰好 -1、0、1。","body":["Comparable<T>：类实现 compareTo(T)，定义自然顺序；Comparator<T>：外部对象实现 compare(a,b)，可提供多个排序规则，且是函数式接口。","比较函数必须有一致的顺序性质。不要返回 a.age-b.age 盲目比较，因为可能整数溢出；使用 Integer.compare 或 Comparator.comparingInt。","多关键字排序用 thenComparing；reversed 的位置决定反转单个关键字还是整条比较链。字符串自然顺序是字典序/代码单元顺序，不等于法语语言学排序。"],"code":"java.util.Comparator<String> cmp =\n    java.util.Comparator.comparingInt(String::length)\n        .thenComparing(java.util.Comparator.naturalOrder());\n// xs.sort(cmp); 长度升序，等长再按自然顺序。","pitfall":"Comparator 是 java.util 包，不在 java.util.function；它仍是函数式接口。","exam":"Comparable définit l’ordre naturel ; Comparator définit un ordre externe.","src":["C4","AComparator","AComparable"],"level":"extra"},{"id":"functionalinterface","chapter":"functional","title":"什么是函数式接口","fr":"Interface fonctionnelle","summary":"一个有效的抽象函数契约，可由 Lambda 实现。","body":["入门规则：只有一个抽象方法。default/static/private 方法不计入；与 Object 的 public 方法相对应的抽象声明也不计入。更精确地说，多个继承来的兼容抽象声明可合并为同一个函数描述符。","@FunctionalInterface 让编译器检查接口是否满足条件，它不是使接口“变成函数式”的魔法；没有注解但条件满足仍可用于 Lambda。拼写只有一个 n：FunctionalInterface。","Comparator 声明 compare，还声明 equals(Object)，但依然函数式，因为后者对应 Object 的 public 方法。课件 Filter<T>.matches(T) 的功能对应标准 Predicate<T>.test(T)。"],"code":"@FunctionalInterface\ninterface Filter<T> {\n    boolean matches(T obj);\n    default String description() { return \"filtre\"; }\n}\nFilter<Integer> positif = x -> x > 0;","pitfall":"写错成 @FunctionnalInterface 会找不到注解类型。","exam":"Une interface fonctionnelle représente un contrat de fonction à une seule méthode abstraite effective.","src":["C4","J9","J15","AFunctions"],"level":"core"},{"id":"lambdasyntax","chapter":"functional","title":"Lambda 语法与目标类型","fr":"Syntaxe et type cible","summary":"Lambda 的参数和返回类型由目标函数式接口约束。","body":["一般写 (params) -> expression 或 (params) -> { statements; }。单个未显式写类型的参数可省括号；零个或多个参数不能省。","表达式体对返回值接口隐式返回；块体要明确 return，除非返回 void。返回值的所有正常路径都需兼容。Lambda 表达式本身不只是“一个匿名方法文本”，它需要目标类型。","同一段 x->x.length() 可匹配 Function<String,Integer> 或 ToIntFunction<String>，具体类型依上下文。var f=x->x+1 没有目标类型，不能直接推断。"],"code":"java.util.function.Predicate<Integer> p1 = (Integer x) -> { return x > 5; };\njava.util.function.Predicate<Integer> p2 = x -> x > 5;\njava.util.function.Supplier<String> s = () -> \"Bonjour\";\njava.util.function.BinaryOperator<Integer> add = (a,b) -> a+b;","pitfall":"块体 { x+1; } 不是合法的有返回值实现；应该 { return x+1; }。","exam":"Une lambda reçoit son type d’une interface fonctionnelle cible.","src":["C4","J9","J15","AFunctions"],"level":"core"},{"id":"fourfunctions","chapter":"functional","title":"四类核心接口及调用方法","fr":"Consumer, Predicate, Function, Supplier","summary":"先背输入/输出关系，再背方法名。","body":["Consumer<T>：T → void，accept(T) 消费一个值，常用于输出；Predicate<T>：T → boolean，test(T) 判断条件。","Function<T,R>：T → R，apply(T) 转换；Supplier<T>：() → T，get() 提供一个值。执行接口实例时调用其方法，而不是把变量当 JavaScript 函数直接写 f(x)。","在 Streams 中：filter 接 Predicate、map 接 Function、forEach 接 Consumer；构建对象的工厂或惰性默认值可用 Supplier。"],"code":"java.util.function.Consumer<String> c = System.out::println;\njava.util.function.Predicate<String> p = s -> s.length()>3;\njava.util.function.Function<String,Integer> f = String::length;\njava.util.function.Supplier<java.util.List<String>> g = java.util.ArrayList::new;\nc.accept(\"Java\");\nboolean ok=p.test(\"Java\");\nint n=f.apply(\"Java\");\njava.util.List<String> xs=g.get();","pitfall":"Predicate 调 test，不是 apply；Supplier.get 无参数。","exam":"Consumer consomme, Predicate teste, Function transforme, Supplier fournit.","src":["C4","J9","J15","AFunctions"],"level":"core"},{"id":"specialfunctions","chapter":"functional","title":"Bi、Operator 与基本类型特化","fr":"Variantes et spécialisations","summary":"名称反映参数个数或输入输出类型。","body":["BiConsumer<T,U> 接两个值无返回；BiPredicate<T,U> 接两个值返回 boolean；BiFunction<T,U,R> 接两个值返回 R。","UnaryOperator<T> extends Function<T,T>：输入输出同类型；BinaryOperator<T> extends BiFunction<T,T,T>：两个输入和结果同类型。reduce 常用 BinaryOperator。","IntConsumer.accept(int)、IntFunction<R>.apply(int)、ToIntFunction<T>.applyAsInt(T)、IntUnaryOperator.applyAsInt(int) 避免不必要装箱。注意 IntFunction<R> 是 int 输入，而 ToIntFunction<T> 是 int 输出。"],"code":"java.util.function.IntFunction<String> a = i -> \"n=\"+i;\njava.util.function.ToIntFunction<String> b = String::length;\njava.util.function.UnaryOperator<String> trim = String::trim;\njava.util.function.BinaryOperator<Integer> max = Integer::max;","pitfall":"Function<Integer,R> 与 IntFunction<R> 不是完全相同的接口类型，调用方法签名不同。","exam":"Les spécialisations primitives évitent l’auto-boxing pour les valeurs primitives.","src":["C4","J9","J15","AFunctions"],"level":"core"},{"id":"composition","chapter":"functional","title":"组合：andThen、compose 与逻辑运算","fr":"Composition de fonctions","summary":"执行顺序必须用公式或具体值确认。","body":["f.andThen(g) 先 f 后 g：g(f(x))；f.compose(g) 先 g 后 f：f(g(x))。Consumer.andThen 先当前操作再后操作；前者抛异常时后者通常不执行。","Predicate.and/or 按逻辑与/或短路组合；negate 取反。组合表达式本身产生新函数式对象，实际逻辑在 test/apply/accept 时运行。","课件用 default 方法解释这些扩展：接口可以提供组合行为，而保持一个抽象契约。Supplier 本身没有标准 andThen/compose 组合方法。"],"code":"java.util.function.Function<Integer,Integer> f = x -> x+1;\njava.util.function.Function<Integer,Integer> g = x -> x*2;\nSystem.out.println(f.andThen(g).apply(3)); // 8\nSystem.out.println(f.compose(g).apply(3)); // 7","pitfall":"不是看到 andThen 就把“后面的先算”；明确括号再求值。","exam":"f.andThen(g) calcule g(f(x)) ; f.compose(g) calcule f(g(x)).","src":["C4","AFunction","APredicate","AConsumer"],"level":"core"},{"id":"references","chapter":"functional","title":"四种方法/构造器引用","fr":"Références de méthodes","summary":":: 是把已有可兼容操作作为函数式实现。","body":["静态方法：Integer::parseInt 等价于 s->Integer.parseInt(s)；特定对象方法：System.out::println 等价于 x->System.out.println(x)。","某类型任意对象的实例方法：String::length 对应 s->s.length()；String::compareTo 对 Comparator<String> 可对应 (a,b)->a.compareTo(b)。","构造器：ArrayList::new；数组构造器 String[]::new 对应 n->new String[n]。参数映射依目标接口决定，不能仅按冒号左边判断参数个数。"],"code":"java.util.function.Function<String,Integer> parse = Integer::parseInt;\njava.util.function.ToIntFunction<String> len = String::length;\njava.util.function.IntFunction<String[]> array = String[]::new;\nString[] a = array.apply(3);","pitfall":"引用方法不是立刻调用它；System.out.println() 与 System.out::println 不同。","exam":"Une référence de méthode fournit une implémentation compatible avec le type fonctionnel attendu.","src":["J15","AFunctions"],"level":"extra"},{"id":"capture","chapter":"functional","title":"局部变量捕获与 effectively final","fr":"Capture des variables locales","summary":"捕获的局部变量必须 final 或事实上不再被赋值。","body":["int seuil=10; Predicate<Integer> p=x->x>seuil 合法；若随后或之前对同一局部变量进行破坏 effectively final 的赋值，Lambda 使用它会编译失败。","对象引用 effectively final 不代表对象不可变：可以捕获一个列表并修改其内容，但这可能制造副作用与并发风险。实例字段不受同样的局部捕获限制。","Lambda 的 this 来自外围实例，不像匿名内部类那样创建自己的 this 语义。for-each 的元素变量可按每次迭代处理；传统 for 的不断变化索引通常需复制到一个局部 final/effectively final 变量。"],"code":"int seuil = 5;\njava.util.function.Predicate<Integer> p = x -> x > seuil;\n// seuil++; // 若启用，捕获就不再合法\nfor (int i=0;i<3;i++) {\n    int copie=i;\n    Runnable r=() -> System.out.println(copie);\n    r.run();\n}","pitfall":"用 int[] 包一层绕开限制只是把修改转移到对象里，不意味着这种副作用设计可靠。","exam":"Une variable locale capturée doit être final ou effectivement finale.","src":["J4","J15"],"level":"extra"},{"id":"pipeline","chapter":"streams","title":"流不是容器：source → pipeline → terminal","fr":"Source, pipeline et opération terminale","summary":"Stream 描述数据处理，不负责长期存储元素。","body":["来源可能是 collection.stream()、Arrays.stream(array)、Stream.of(...)、IntStream.range(...)、Files.lines(path)。一个管道由来源、零到多个中间操作和一个终端操作组成。","常规中间操作构建新的处理阶段；终端操作触发消费并产出结果或副作用。管道不是每阶段必然生成一整个中间列表，很多无状态操作可逐元素融合处理。","行为参数应不干扰源、尽量无状态。API 自身通常不改变来源结构，但你写的 Lambda 仍可能修改源或元素；“流绝不可能改源数据”是错误绝对化。"],"code":"java.util.List<String> noms = java.util.List.of(\"Lea\",\"Ali\",\"Bernard\");\njava.util.List<String> longs = noms.stream()\n    .filter(s -> s.length()>3)\n    .map(String::toUpperCase)\n    .toList(); // [BERNARD]","pitfall":"不要在正在遍历来源的 Lambda 里向同一个来源集合 add/remove。","exam":"Un stream décrit un pipeline de traitement, pas une structure de stockage.","src":["C5","AStream","ACollectors"],"level":"core"},{"id":"lazy","chapter":"streams","title":"惰性、一次性与副作用陷阱","fr":"Paresse et consommation unique","summary":"未发生消费通常不执行中间操作；消费后不能复用。","body":["只构造 filter/map 管道而没有终端操作，不会逐元素执行处理。终端操作可以短路，某些操作也可能被优化，因此不保证每个中间 Lambda 都执行。","Stream 只能使用一次。调用终端操作后再次 count()/forEach 通常触发 IllegalStateException；需要新结果就从源重新 stream()，不要缓存已消费流。","peek 常用于观察，但不能承载必须发生的业务副作用；例如可直接从已知大小得出 count 时，中间 peek/map 可能不执行。读取输出题必须结合 API 是否保证行为。"],"code":"var s = java.util.stream.Stream.of(1,2,3).filter(x -> x>1);\nlong n = s.count(); // 2\n// s.count();       // 已消费，IllegalStateException\n// 未调用终端操作的 filter 不会逐元素运行。","pitfall":"惰性不等于“所有代码永远都不执行”；创建来源及传入参数表达式本身仍会求值。","exam":"Les opérations intermédiaires sont paresseuses et un stream ne se consomme qu’une fois.","src":["C5","AStream","ACollectors"],"level":"core"},{"id":"filtermap","chapter":"streams","title":"filter、map 与 flatMap","fr":"Filtrer, transformer et aplatir","summary":"保留元素、替换元素、展开多元素是三种不同操作。","body":["filter(Predicate) 保留满足条件的元素，元素类型不变；map(Function<T,R>) 一对一转换，可能改变类型。","flatMap 把每个输入映射为一个流，再扁平化成一个元素流。例如 List<List<Integer>> 先 map(List::stream) 得到 Stream<Stream<Integer>>；flatMap(List::stream) 得到 Stream<Integer>。","mapToInt(ToIntFunction) 得 IntStream，可使用 sum/average；对 int[] 用 Arrays.stream 得 IntStream，Stream.of(intArray) 则通常是只有一个数组元素的 Stream<int[]>。"],"code":"java.util.List<java.util.List<Integer>> x = java.util.List.of(\n    java.util.List.of(1,2), java.util.List.of(3));\njava.util.List<Integer> r = x.stream()\n    .flatMap(java.util.Collection::stream)\n    .map(n -> n*2).toList(); // [2,4,6]","pitfall":"filter 不做元素转换；map 返回 null 不表示自动删除，结果里仍可出现 null。","exam":"map transforme chaque élément ; flatMap transforme puis aplatit les sous-flux.","src":["C5","AStream","ACollectors"],"level":"core"},{"id":"streamorder","chapter":"streams","title":"distinct、sorted、limit 与 skip","fr":"Unicité, tri et tranche","summary":"操作顺序会改变结果，也会改变需要消费的数据量。","body":["distinct 依 equals 的语义去重，对有 encounter order 的流保留首次出现的重复类代表；sorted() 用自然顺序，sorted(cmp) 用指定比较器。","limit(n) 最多保留前 n 个，是有状态短路中间操作；skip(n) 丢弃前 n 个，是有状态中间操作，本身不是短路操作。两者 n<0 均非法。","sorted().limit(3) 取排序最前 3 个；limit(3).sorted() 只排原来的前 3 个。无限流先 sorted 通常永远等不到来源结束；先 limit 才可能形成有限排序输入。"],"code":"var xs = java.util.List.of(4,1,4,2,3);\nvar r = xs.stream().distinct().sorted().skip(1).limit(2).toList();\n// distinct [4,1,2,3] → sorted [1,2,3,4] → [2,3]","pitfall":"课件把 skip 标为短路应纠正；“丢弃一部分”不等于“能提前停止消费剩余来源”。","exam":"L’ordre des opérations modifie le résultat ; skip n’est pas une opération de court-circuit.","src":["C5","AStream","ACollectors"],"level":"core"},{"id":"terminal","chapter":"streams","title":"终端操作与空流","fr":"Opérations terminales et flux vide","summary":"不同终端操作的返回类型必须记住。","body":["forEach 返回 void；count 返回 long；min/max/findFirst/findAny 返回 Optional<T>；allMatch/anyMatch/noneMatch 返回 boolean；collect 由 Collector 决定结果类型。","空流：count=0；anyMatch=false；allMatch=true；noneMatch=true；findFirst/min/max 返回 Optional.empty。allMatch 的空真不代表“找到一个满足条件的元素”。","allMatch/anyMatch/noneMatch/findFirst/findAny 可短路。并行流的 forEach 不保证 encounter order；需要按 encounter order 执行用 forEachOrdered，但仍需考虑副作用。"],"code":"boolean a = java.util.stream.Stream.<Integer>empty().allMatch(x -> x>0); // true\nboolean b = java.util.stream.Stream.<Integer>empty().anyMatch(x -> x>0); // false\nlong n = java.util.stream.Stream.of(\"a\",\"b\").count(); // 2L","pitfall":"count 结果是 long，不能直接赋给 int；findFirst 得到的不是直接的元素值。","exam":"allMatch est vrai sur un flux vide, alors que anyMatch est faux.","src":["C5","AStream","ACollectors"],"level":"core"},{"id":"optional","chapter":"streams","title":"Optional：空值处理而不是盲目 get","fr":"Présence ou absence d’une valeur","summary":"先考虑可能没有结果，再决定默认值或异常。","body":["Optional.of(x) 要求 x 非 null；ofNullable(x) 可将 null 转为 empty；empty 表示无值。isPresent/isEmpty 查询，ifPresent 有值时处理。","orElse(defaultValue) 提供默认值；orElseGet(supplier) 只在无值时调用提供者。orElse 的实参表达式会先求值，即使 Optional 非空。","get 在无值时抛 NoSuchElementException；更明确可用 orElseThrow。map 变换有值结果，flatMap 用于变换本身已经返回 Optional 的情形。Optional 本身应是非 null 引用。"],"code":"java.util.Optional<Integer> max = java.util.List.of(2,7,3).stream()\n    .max(Integer::compare);\nint r = max.orElse(0); // 7\n// 空序列“最大值”是否允许用0，必须由业务契约决定。","pitfall":"若所有数字都为负，随意用 0 当初始化最大值会错；Optional 可以明确表达空输入。","exam":"Optional représente explicitement la présence ou l’absence d’un résultat.","src":["C5","AOptional"],"level":"core"},{"id":"reduce","chapter":"streams","title":"reduce 与结合律","fr":"Réduction et associativité","summary":"把多个元素合成为一个结果，运算规则须适合归约。","body":["reduce(BinaryOperator<T>) 返回 Optional<T>，因为空流无元素可用；reduce(identity,accumulator) 返回 T，空流返回 identity。","identity 必须是中性元：加法 0、乘法 1；accumulator 应具有结合性，尤其并行归约。减法不结合，不能当可靠的并行 reduce 求法。","三参数 reduce(identity,accumulator,combiner) 可改变结果类型，combiner 必须与 accumulator 兼容。可变容器累加使用 collect，而不是共享一个可变 identity 给并行 reduce。"],"code":"int somme = java.util.stream.Stream.of(1,2,3)\n    .reduce(0, Integer::sum); // 6\njava.util.Optional<Integer> produit = java.util.stream.Stream.of(2,3,4)\n    .reduce((a,b) -> a*b);    // Optional[24]","pitfall":"把 identity 设为 1 来做加法会改变结果；并行分组时不正确的 identity 更容易暴露问题。","exam":"La réduction exige une opération associative et, lorsqu’il existe, un élément neutre correct.","src":["C5","AStream","ACollectors"],"level":"core"},{"id":"collectors","chapter":"streams","title":"collect 与常用 Collectors","fr":"Collecte et collecteurs","summary":"collect 是终端操作，Collector 描述怎么积累与合并。","body":["collect(Collectors.toList()) 收集为 List；toSet 去重但不保证具体实现或顺序；toCollection(ArrayList::new) 明确需要的可变结构。","joining(delimiter,prefix,suffix) 把 CharSequence 流合成字符串；counting() 可作为分组下游计数；summingInt/averagingDouble 等可做统计。","课件 <R,A> R collect(Collector<T,A,R>) 可简化理解为 T 输入元素、A 内部累积容器、R 最终结果；官方完整签名还含通配符，不必为初次使用背所有嵌套参数。"],"code":"String s = java.util.stream.Stream.of(\"a\",\"b\",\"c\")\n    .collect(java.util.stream.Collectors.joining(\",\", \"[\", \"]\")); // [a,b,c]\njava.util.ArrayList<Integer> xs = java.util.stream.Stream.of(1,2)\n    .collect(java.util.stream.Collectors.toCollection(java.util.ArrayList::new));","pitfall":"Collectors.toList() 本身返回 Collector，不是直接返回业务列表；要交给 collect。","exam":"Le collecteur décrit l’accumulation ; collect déclenche l’opération terminale.","src":["C5","AStream","ACollectors"],"level":"core"},{"id":"grouping","chapter":"streams","title":"groupingBy、toMap 与重复键","fr":"Regroupement et construction de Map","summary":"先确定键怎么来、值是什么、重复键如何处理。","body":["groupingBy(classifier) 常得到 Map<K,List<T>>；加 downstream counting 得 Map<K,Long>，加 mapping 再 toList 可收集每组转换后的字段。","toMap(keyMapper,valueMapper) 中同键的两个元素默认导致 IllegalStateException，不能以为后一个自动覆盖。提供 mergeFunction 才明确冲突处理，例如 Integer::sum 或 (a,b)->a。","需要确定键遍历顺序时可用带 mapFactory 的重载，如 LinkedHashMap::new；不要把默认 groupingBy/toMap 的结果承诺为有序 HashMap。"],"code":"java.util.Map<Integer,Long> counts = java.util.stream.Stream.of(\"a\",\"bb\",\"c\")\n    .collect(java.util.stream.Collectors.groupingBy(String::length,\n        java.util.stream.Collectors.counting())); // 1→2, 2→1\njava.util.Map<String,Integer> freq = java.util.stream.Stream.of(\"a\",\"b\",\"a\")\n    .collect(java.util.stream.Collectors.toMap(s -> s, s -> 1, Integer::sum));","pitfall":"groupingBy 保留同键所有元素；toMap 要求你定义一个值的冲突合并策略，二者目的不同。","exam":"toMap nécessite une fonction de fusion lorsque plusieurs éléments produisent la même clé.","src":["C5","AStream","ACollectors"],"level":"core"},{"id":"primitivefileparallel","chapter":"streams","title":"基本类型流、文件流与并行","fr":"Flux primitifs, fichiers et parallélisme","summary":"使用专门类型、正确关闭资源，不把 parallel 当免费加速。","body":["IntStream.range(a,b) 左闭右开；rangeClosed 两端包含。IntStream 有 sum、average、max、boxed；Stream<Integer> 可 mapToInt(Integer::intValue)。","Files.lines(path) 产生需关闭的资源型流，使用 try-with-resources。普通集合 stream 通常无需关闭；文件读取的创建/消费过程中可能发生 I/O 异常。","parallelStream/parallel 可以并行处理；收益依数据量、操作开销和硬件，不保证更快。避免共享可变计数器、非结合 reduce、随意依赖处理顺序；优先内建归约/收集器。"],"code":"int somme = java.util.stream.IntStream.rangeClosed(1, 5).sum(); // 15\n// 文件示例需方法声明 throws IOException：\n// try (var lignes = java.nio.file.Files.lines(java.nio.file.Path.of(\"data.txt\"))) {\n//     long n = lignes.filter(s -> !s.isBlank()).count();\n// }","pitfall":"parallel().forEach(x -> total++) 既有并发风险，也不符合局部变量捕获限制的朴素写法。","exam":"Un flux de fichier doit être fermé ; le parallélisme exige des opérations adaptées.","src":["C5","AStream","AIntStream","AFiles"],"level":"core"},{"id":"exceptions","chapter":"robustness","title":"受检异常、运行时异常与 throw/throws","fr":"Exceptions vérifiées et non vérifiées","summary":"异常题先判断编译器是否要求处理，再看运行时。","body":["受检异常（例如 IOException）通常需捕获或在方法 throws 声明；RuntimeException 及其子类、Error 类族不受同样的编译期处理要求。","常见运行时异常：NullPointerException、ArrayIndexOutOfBoundsException、ClassCastException、ArithmeticException、IllegalArgumentException、NoSuchElementException、UnsupportedOperationException。编译错误不是 Java 异常对象。","throw new ... 是实际抛异常的语句；throws 是方法声明中说明可能传播的异常类型。异常信息应说明哪个参数/状态不合法，不要 catch(Exception) 后悄悄返回错误结果。"],"code":"static int diviser(int a, int b) {\n    if (b == 0) throw new IllegalArgumentException(\"b doit etre non nul\");\n    return a / b;\n}","pitfall":"声明 throws 不表示每次调用都必定抛异常，也不表示异常已被处理。","exam":"throw déclenche une exception ; throws déclare les exceptions susceptibles d’être propagées.","src":["J11","J14"],"level":"extra"},{"id":"tryresources","chapter":"robustness","title":"try/catch/finally 与资源关闭","fr":"Gestion des exceptions et ressources","summary":"将清理工作与正常返回逻辑分开。","body":["catch 子类型应在父类型前，否则后者先捕获会使子类型分支不可达。多 catch 可用 catch(IOException | SomeOtherException e)，但类型不能存在直接包含关系。","finally 在正常完成、return 或异常传播时通常都会执行；但进程被终止等情况不保证。不要在 finally return，会覆盖前面的返回或异常。","try-with-resources 自动关闭 AutoCloseable 资源，按声明的逆序关闭；对 Files.lines、文件 reader 很重要。关闭时的异常可能作为 suppressed 异常保存，不应简单覆盖原异常。"],"code":"// 方法需声明或处理 IOException\n// try (var reader = java.nio.file.Files.newBufferedReader(path)) {\n//     String first = reader.readLine();\n// } // 自动关闭 reader","pitfall":"代码“能运行完”不代表资源没有泄露；终端消费文件流不等于自动帮你在所有情况关闭它。","exam":"try-with-resources garantit la fermeture des ressources lors de la sortie du bloc.","src":["J11","J14","AFiles"],"level":"extra"},{"id":"contracts","chapter":"robustness","title":"方法契约与边界测试","fr":"Préconditions, postconditions et tests","summary":"完整答案应说明输入范围、返回约定和异常。","body":["前置条件：例如二分输入升序、n≥0、字符串非 null。后置条件：返回所求下标/结果，是否修改输入，以及失败/空结果约定。参数合法性与算法核心可分开写。","对每个算法准备边界集：空、单元素、全相同、已排序、逆序、负数、零、首尾命中、未找到、异常输入。对链表测试空→单元素→空→重新插入。","对 equals 测自反/对称/传递/null，并验证相等对象 hashCode 相等。对封装，修改构造器实参数组和 getter 返回数组，确认对象内部不受影响。"],"code":"int[] source={10,15};\n// Etudiant e = new Etudiant(source);\n// source[0]=0;           // 不应影响 e\n// double[] copie=e.getNotes(); copie[0]=0; // 同样不应影响 e","pitfall":"测试“没有异常”只是最低要求，还要检查输出、输入是否被不当修改、不变式是否保持。","exam":"Une précondition décrit l’entrée admise ; une postcondition décrit le résultat garanti.","src":["C0","C2","C6"],"level":"extra"},{"id":"examreading","chapter":"robustness","title":"代码题的固定分析顺序","fr":"Méthode d’analyse de code","summary":"按编译 → 初始化/引用 → 执行 → 输出四步检查。","body":["第一步检查拼写、作用域、可见性、类型、泛型、static 上下文、是否返回、默认构造器、捕获变量。只要编译失败，不再给出正常运行输出。","第二步画引用关系：每次 new 一个新对象，赋值箭头指向哪，哪些值共享。第三步逐行跟踪状态、短路、循环次数、重载选择与重写分派、是否出现异常。","最后写精确输出，区分 print/println、空格、换行、数值类型带来的 6 与 6.0。若程序先输出再异常，写出异常之前的输出，不要只写“错误”。"],"code":"// 检查表：\n// 1. Est-ce que le code compile ?\n// 2. Quelles références désignent le même objet ?\n// 3. Quelle méthode est appelée ?\n// 4. Quelle est la sortie exacte, ou quelle exception survient ?","pitfall":"题目出现 ne ... pas、sauf、toujours、nécessairement 等词时，先圈出否定与绝对化限定。","exam":"Vérifier la compilation avant de simuler l’exécution.","src":["C6"],"level":"extra"},{"id":"handwriting","chapter":"robustness","title":"手写代码的交卷检查","fr":"Rédaction d’un programme sur papier","summary":"先给明确签名，再给算法和边界，最后检查语法。","body":["方法题：返回类型、方法名、参数类型/顺序要对；必要时 static；每条正常结束路径返回；循环上界正确；数组/字符串/集合的长度方法不要混用。","类题：private 字段、构造器与 this、需要的 getter/setter、校验与防御性复制、equals/hashCode/toString。不要无说明地暴露可变内部结构。","泛型题写清类/方法类型参数；链表维护头尾；Lambda 的方法返回类型匹配接口；Stream 区分中间与终端操作，处理 Optional 和重复键。题目禁用库函数时不可用 Arrays.sort 代替手写排序。"],"code":"// 常用 import（按需要选择）：\n// import java.util.*;\n// import java.util.function.*;\n// import java.util.stream.*;\n// import java.nio.file.*;\n// import java.io.IOException;","pitfall":"不要为了“显得高级”把简单遍历改成难解释的并行 Stream；满足题目要求与正确性优先。","exam":"Respecter la signature demandée, les cas limites et les contraintes de l’énoncé.","src":["C6","C0"],"level":"extra"}],"algorithms":[{"id":"divisor","title":"判断整除","fr":"Tester si un entier est diviseur d’un autre","prompt":"Écrire estDiviseur(nb, diviseur), qui retourne un booléen.","steps":["先检查 diviseur != 0，避免取余除零。","用 nb % diviseur == 0 判断，利用 && 短路。"],"time":"O(1)","space":"O(1)","edge":"此处定义除数为 0 返回 false；0 被任意非零整数整除。负数也按整除判断。","cases":[["(12,3)","true"],["(12,5)","false"],["(0,2)","true"],["(12,0)","false"]],"src":["C6 · p.10"],"level":"core","file":"RevisionAlgorithms.java","code":"public static boolean estDiviseur(int nb, int diviseur) {\n    return diviseur != 0 && nb % diviseur == 0;\n}"},{"id":"salary","title":"工资表与嵌套 switch","fr":"Calculer le salaire selon le grade et l’ancienneté","prompt":"Retourner le salaire d’un employé à partir de son grade et de son ancienneté.","steps":["先分 grade，再分 anciennete 1/2/3。","单位沿用课件表的 k€；Concepteur 15/17/19，Ingénieur 23/25/27，Développeur 35/40/45。","此实现对未知 grade、null、非法 anciennete 返回 0，这是显式选择的错误输入约定。"],"time":"O(1)","space":"O(1)","edge":"法语重音区分：Ingénieur、Développeur；返回 double，例如 25.0。","cases":[["(\"Ingénieur\",2)","25.0 k€"],["(\"Concepteur\",3)","19.0 k€"],["(\"Autre\",1)","0.0"]],"src":["C6 · pp.12–13"],"level":"core","file":"RevisionAlgorithms.java","code":"/** Retour en kEUR ; grade inconnu / anciennete invalide => 0. */\npublic static double calculSalaire(String grade, int anciennete) {\n    if (grade == null) return 0;\n    return switch (grade) {\n        case \"Concepteur\" -> switch (anciennete) {\n            case 1 -> 15; case 2 -> 17; case 3 -> 19; default -> 0;\n        };\n        case \"Ingénieur\" -> switch (anciennete) {\n            case 1 -> 23; case 2 -> 25; case 3 -> 27; default -> 0;\n        };\n        case \"Développeur\" -> switch (anciennete) {\n            case 1 -> 35; case 2 -> 40; case 3 -> 45; default -> 0;\n        };\n        default -> 0;\n    };\n}"},{"id":"perfect","title":"完全数与区间搜索","fr":"Rechercher les nombres parfaits","prompt":"Rechercher tous les nombres parfaits compris dans un intervalle donné.","steps":["完全数是大于1、等于所有正真因子之和的整数，例如6=1+2+3。","简单版本可检查 d=1…n/2，时间 O(n)；改进版本因子 d 与 n/d 成对，只检查到平方根。","平方数中 d 与 n/d 相等时只累加一次；sum 用 long。区间遍历用 long 避免 max=Integer.MAX_VALUE 时自增回绕。"],"time":"单数 O(√n)；区间约 O((max−min+1)√max)","space":"单数 O(1)，输出 O(k)","edge":"1、0、负数不是完全数；min>max 抛异常。不要使用整数 somme/2==n 搭配未经约束输入。","cases":[["parfaits(1,30)","[6,28]"],["estParfait(496)","true"],["estParfait(1)","false"],["estParfait(36)","false"]],"src":["C6 · pp.15–16"],"level":"core","file":"RevisionAlgorithms.java","code":"public static boolean estParfait(int n) {\n    if (n <= 1) return false;\n    long somme = 1; // somme des diviseurs propres positifs\n    for (int d = 2; d <= n / d; d++) { // evite d*d qui deborde\n        if (n % d == 0) {\n            somme += d;\n            int autre = n / d;\n            if (autre != d) somme += autre; // carre parfait : pas deux fois\n        }\n    }\n    return somme == n;\n}\npublic static List<Integer> parfaits(int min, int max) {\n    if (min > max) throw new IllegalArgumentException(\"min > max\");\n    List<Integer> resultat = new ArrayList<>();\n    for (long n = Math.max(2, min); n <= max; n++) {\n        if (estParfait((int)n)) resultat.add((int)n);\n    }\n    return resultat;\n}"},{"id":"uppercase","title":"至少一个大写字母","fr":"Détecter au moins une majuscule","prompt":"Retourner si une chaîne contient au moins une majuscule.","steps":["ASCII 版本扫描未找到的大写之前的字符，条件先查下标再 charAt。","不在 A～Z 应用 c<'A' || c>'Z'。找到即停止，不必遍历剩余内容。","另给 Unicode 版本：codePoints + Character.isUpperCase，不把 É 排除。"],"time":"最坏 O(n)","space":"O(1)","edge":"空字符串 false；null 显式拒绝。ASCII 版本 É=false，Unicode 版本 É=true。","cases":[["\"abcD\"","true"],["\"abc\"","false"],["\"\"","false"],["\"É\"","ASCII false / Unicode true"]],"src":["C6 · p.17"],"level":"core","file":"RevisionAlgorithms.java","code":"public static boolean uneMajusculeAscii(String s) {\n    Objects.requireNonNull(s, \"s\");\n    int i = 0;\n    while (i < s.length() && (s.charAt(i) < 'A' || s.charAt(i) > 'Z')) i++;\n    return i < s.length();\n}\npublic static boolean uneMajusculeUnicode(String s) {\n    Objects.requireNonNull(s, \"s\");\n    return s.codePoints().anyMatch(Character::isUpperCase);\n}"},{"id":"randomarray","title":"生成闭区间随机数组","fr":"Construire un tableau aléatoire","prompt":"Créer un tableau de taille donnée contenant des entiers dans [min,max].","steps":["先校验 taille≥0、min≤max、随机生成器非null。","用 long 计算幅度 max−min+1，避免 int 范围跨越导致溢出。","nextLong(amplitude) 为 [0,amplitude)，加 min 后落在闭区间；传固定 seed 可复现实验。"],"time":"O(n)","space":"O(n) 输出，O(1) 额外","edge":"全 int 范围也可计算幅度；min=max 返回同一数的数组；这里只用于普通伪随机练习，不用于安全场景。","cases":[["(3,4,4,new Random(1))","[4,4,4]"],["(0,1,9,new Random(1))","[]"]],"src":["C6 · p.24","ARandom"],"level":"core","file":"RevisionAlgorithms.java","code":"/** Bornes inclusives ; Random fourni pour rendre les tests reproductibles. */\npublic static int[] tableauAleatoire(int taille, int min, int max, Random random) {\n    Objects.requireNonNull(random, \"random\");\n    if (taille < 0 || min > max) throw new IllegalArgumentException(\"bornes\");\n    int[] a = new int[taille];\n    long amplitude = (long) max - min + 1;\n    for (int i = 0; i < a.length; i++) {\n        a[i] = (int) ((long) min + random.nextLong(amplitude));\n    }\n    return a;\n}"},{"id":"describe","title":"手写数组转字符串","fr":"Décrire un tableau sans séparateur final","prompt":"Retourner une description textuelle du tableau.","steps":["开头加 [，每个元素前在 i>0 时添加分隔符。","循环结束加 ]，因此自然支持空数组且没有尾随逗号。","库版本 Arrays.toString(a) 可对照，但题目要求手写时用此实现。"],"time":"O(n)，以输出字符长度计更精确","space":"O(n) 输出","edge":"null 拒绝；空数组为 []；负数由 append 自动格式化。","cases":[["{3,-1,5}","[3, -1, 5]"],["{}","[]"]],"src":["C6 · p.24"],"level":"core","file":"RevisionAlgorithms.java","code":"public static String decrire(int[] a) {\n    Objects.requireNonNull(a, \"a\");\n    StringBuilder b = new StringBuilder(\"[\");\n    for (int i = 0; i < a.length; i++) {\n        if (i > 0) b.append(\", \");\n        b.append(a[i]);\n    }\n    return b.append(']').toString();\n}"},{"id":"sums","title":"前 n 个整数求和：三种写法","fr":"Somme itérative, récursive et directe","prompt":"Calculer la somme des n premiers entiers naturels positifs.","steps":["迭代：累加 1…n，初始和为0。","递归：S(0)=0，S(n)=n+S(n−1)。","公式：n(n+1)/2，转换为 long 必须在乘法前；n+1 也使用 long。"],"time":"迭代/递归 O(n)，公式 O(1)","space":"迭代/公式 O(1)，递归 O(n) 栈","edge":"n<0 拒绝；n=0 返回0；递归只适合较小n，未承诺大n不会栈溢出。","cases":[["n=0","0"],["n=5","15"],["n=100","5050"]],"src":["C6 · pp.28–29"],"level":"core","file":"RevisionAlgorithms.java","code":"public static long sommeI(int n) {\n    if (n < 0) throw new IllegalArgumentException(\"n < 0\");\n    long s = 0;\n    for (long i = 1; i <= n; i++) s += i;\n    return s;\n}\n/** Pour de petits n : une grande profondeur peut epuiser la pile. */\npublic static long sommeR(int n) {\n    if (n < 0) throw new IllegalArgumentException(\"n < 0\");\n    if (n == 0) return 0;\n    return n + sommeR(n - 1);\n}\npublic static long sommeFormule(int n) {\n    if (n < 0) throw new IllegalArgumentException(\"n < 0\");\n    return (long) n * (n + 1L) / 2;\n}"},{"id":"fibonacci","title":"Fibonacci：递归与线性优化","fr":"Calculer le n-ième nombre de Fibonacci","prompt":"Écrire une version récursive puis supprimer les calculs répétés.","steps":["约定 F(0)=0、F(1)=1；递归 F(n)=F(n−1)+F(n−2)。","朴素递归的两棵子树重复计算，最坏可用 O(2^n) 上界描述。","迭代只保留前两项，确保没有为了算结果多计算一个已溢出的下一项。"],"time":"朴素递归 O(2^n) 上界，迭代 O(n)","space":"递归 O(n) 栈，迭代 O(1)","edge":"演示递归限制0≤n≤35；long 迭代限制0≤n≤92，F(93) 超出long。范围限制是此实现契约，不是数列定义。","cases":[["n=0","0"],["n=1","1"],["n=10","55"],["n=92（迭代）","7540113804746346429"]],"src":["C6 · p.30"],"level":"core","file":"RevisionAlgorithms.java","code":"/** Version naive volontairement limitee a 35 (cout exponentiel). */\npublic static long fibonacciR(int n) {\n    if (n < 0 || n > 35) throw new IllegalArgumentException(\"0 <= n <= 35\");\n    return fibRec(n);\n}\nprivate static long fibRec(int n) {\n    if (n < 2) return n;\n    return fibRec(n - 1) + fibRec(n - 2);\n}\n/** F(0)=0, F(1)=1 ; long represente jusqu'a F(92). */\npublic static long fibonacciI(int n) {\n    if (n < 0 || n > 92) throw new IllegalArgumentException(\"0 <= n <= 92\");\n    if (n == 0) return 0;\n    long precedent = 0, courant = 1;\n    for (int i = 2; i <= n; i++) {\n        long suivant = precedent + courant;\n        precedent = courant;\n        courant = suivant;\n    }\n    return courant;\n}"},{"id":"palindrome","title":"递归判断回文","fr":"Tester récursivement un palindrome","prompt":"Retourner si une chaîne se lit de la même façon dans les deux sens.","steps":["双指针 g,d 指向两端；g≥d 时剩余长度≤1，为回文。","首尾不相等立即fals
