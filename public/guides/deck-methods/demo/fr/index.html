        var a = ks[j - 1], b = ks[j], w = (u - a[0]) / ((b[0] - a[0]) || 1);
        return a[1] + (b[1] - a[1]) * w;
      }
    }
    return ks[ks.length - 1][1];
  }

  function state(s, id, t) {
    var n = s.nodes[id], b = s.by[id], i, f, u;
    var vis = !n.hid, op = 1, wipe = null;
    for (i = 0; i < b.vis.length; i++) { if (b.vis[i].t <= t) vis = !!b.vis[i].v; else break; }
    for (i = 0; i < b.fade.length; i++) {
      f = b.fade[i];
      if (t >= f.t && t < f.t + f.d) { u = (t - f.t) / f.d; op = f.dir === 'in' ? u : 1 - u; }
    }
    for (i = 0; i < b.wipe.length; i++) {
      f = b.wipe[i];
      if (t >= f.t && t < f.t + f.d) { u = (t - f.t) / f.d; wipe = { side: f.side, p: f.dir === 'in' ? u : 1 - u }; }
    }
    return { vis: vis, op: op, wipe: wipe, x: pv(b.prop.x, t, 0), y: pv(b.prop.y, t, 0),
      sx: pv(b.prop.sx, t, 1), sy: pv(b.prop.sy, t, 1), rot: pv(b.prop.rot, t, 0) };
  }

  function tf(n, x, y, sx, sy, rot) {
    var s = '';
    if (x || y) s += 'translate(' + x.toFixed(2) + ' ' + y.toFixed(2) + ') ';
    if (rot || sx !== 1 || sy !== 1) {
      s += 'translate(' + n.cx + ' ' + n.cy + ') rotate(' + rot.toFixed(3) + ') scale(' +
        sx.toFixed(4) + ' ' + sy.toFixed(4) + ') translate(' + (-n.cx) + ' ' + (-n.cy) + ')';
    }
    return s;
  }

  function clip(w) {
    var r = ((1 - w.p) * 100).toFixed(2) + '%';
    return w.side === 'left' ? 'inset(0 ' + r + ' 0 0)' : w.side === 'right' ? 'inset(0 0 0 ' + r + ')'
      : w.side === 'top' ? 'inset(0 0 ' + r + ' 0)' : 'inset(' + r + ' 0 0 0)';
  }

  function draw(i, t) {
    var s = S[i];
    Object.keys(s.nodes).forEach(function (id) {
      var el = s.el[id], st = state(s, id, t);
      if (!el) return;
      if (el._fc) { paintEl(el, el._fc); el._fc = null; }
      if (!st.vis) { el.style.display = 'none'; return; }
      el.style.display = '';
      el.style.opacity = st.op >= 1 ? '' : st.op.toFixed(3);
      el.setAttribute('transform', tf(s.nodes[id], st.x, st.y, st.sx, st.sy, st.rot));
      el.style.clipPath = st.wipe ? clip(st.wipe) : '';
    });
    s.bgEl.style.opacity = '';
  }

  function show(list) {
    svgs.forEach(function (v, i) {
      var on = list.indexOf(i) >= 0;
      v.style.display = on ? 'block' : 'none';
      v.style.opacity = '';
      v.style.transform = '';
      v.style.zIndex = on ? String(list.indexOf(i) + 1) : '';
    });
  }

  function hex(c) { return [parseInt(c.substr(0, 2), 16), parseInt(c.substr(2, 2), 16), parseInt(c.substr(4, 2), 16)]; }
  function mix(a, b, u) {
    var x = hex(a), y = hex(b);
    return 'rgb(' + x.map(function (v, k) { return Math.round(v + (y[k] - v) * u); }).join(',') + ')';
  }
  function paintEl(el, col) {
    var sh = el.querySelector('rect,ellipse,path');
    if (sh) sh.setAttribute('fill', col);
    else { var d = el.querySelector('foreignObject div div'); if (d) d.style.color = col; }
  }
  function io(u) { return u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2; }

  function morph(i, p) {
    var A = S[i - 1], B = S[i], u = io(p);
    draw(i - 1, A.dur); draw(i, 0); show([i - 1, i]);
    svgs[i - 1].style.opacity = (1 - u).toFixed(3);
    B.bgEl.style.opacity = u.toFixed(3);
    Object.keys(B.nodes).forEach(function (id) {
      var b = B.nodes[id], el = B.el[id];
      if (!el || el.style.display === 'none') return;
      var ida = b.m ? A.mk[b.m] : null, sa = ida ? state(A, ida, A.dur) : null;
      if (!ida || !sa.vis) { el.style.opacity = u.toFixed(3); return; }
      var a = A.nodes[ida];
      var cx = a.cx + sa.x + (b.cx - a.cx - sa.x) * u, cy = a.cy + sa.y + (b.cy - a.cy - sa.y) * u;
      var w = a.w * sa.sx + (b.w - a.w * sa.sx) * u, h = a.h * sa.sy + (b.h - a.h * sa.sy) * u;
      var r = (a.rot || 0) + sa.rot + ((b.rot || 0) - (a.rot || 0) - sa.rot) * u;
      el.setAttribute('transform', tf(b, cx - b.cx, cy - b.cy, w / b.w, h / b.h, r - (b.rot || 0)));
      el.style.opacity = '';
      if (a.fc && b.fc && a.fc !== b.fc) { paintEl(el, mix(a.fc, b.fc, u)); el._fc = '#' + b.fc; }
      A.el[ida].style.display = 'none';
    });
  }

  function transition(i, p) {
    var s = S[i], k = s.tr.t;
    if (k === 'morph') return morph(i, p);
    draw(i - 1, S[i - 1].dur); draw(i, 0); show([i - 1, i]);
    if (k === 'push') {
      var u = io(p), side = s.tr.side || 'l';
      var ax = side === 'l' ? -u : side === 'r' ? u : 0, ay = side === 'u' ? -u : side === 'd' ? u : 0;
      var bx = side === 'l' ? 1 - u : side === 'r' ? u - 1 : 0, by = side === 'u' ? 1 - u : side === 'd' ? u - 1 : 0;
      svgs[i - 1].style.transform = 'translate(' + ax * 100 + '%,' + ay * 100 + '%)';
      svgs[i].style.transform = 'translate(' + bx * 100 + '%,' + by * 100 + '%)';
    } else {
      svgs[i].style.opacity = p.toFixed(3);
    }
  }

  var T = 0, cur = -1;
  function seek(t) {
    T = Math.max(0, Math.min(total - 1e-4, t));
    var i = S.length - 1;
    while (i > 0 && S[i].start > T) i--;
    var s = S[i], loc = T - s.start;
    if (i > 0 && loc < s.trd) transition(i, loc / s.trd);
    else { draw(i, Math.min(loc - s.trd, s.dur + s.tail)); show([i]); }
    cur = i;
    ui();
  }

  var playing = false, waiting = false, last = 0, rate = 1;
  var mode = q.get('mode') === 'click' ? 'click' : 'auto', loop = q.get('loop') !== '0';
  function nextStop(t) { for (var i = 0; i < stops.length; i++) if (stops[i] > t + 1e-6) return stops[i]; return null; }
  function tick(ts) {
    if (playing) {
      var nt = T + Math.min(0.1, (ts - last) / 1000) * rate;
      if (mode === 'click') {
        var st = nextStop(T);
        if (st !== null && nt >= st) { nt = st; playing = false; waiting = true; }
      }
      if (nt >= total - 1e-3) { if (loop && mode !== 'click') nt = 0; else { nt = total - 1e-3; playing = false; } }
      seek(nt);
    }
    last = ts;
    requestAnimationFrame(tick);
  }
  function step() {
    if (waiting) { waiting = false; T = Math.min(total - 1e-3, T + PAUSE); playing = true; return; }
    playing = !playing;
  }
  function jump(dir) {
    var i = Math.max(0, Math.min(S.length - 1, cur + dir));
    waiting = false; seek(S[i].start + (i === 0 ? 0 : S[i].trd));
  }

  var pp = document.getElementById('pp'), scrub = document.getElementById('scrub'), clock = document.getElementById('clock');
  function fmt(t) { var m = Math.floor(t / 60), s = Math.floor(t % 60); return m + ':' + (s < 10 ? '0' : '') + s; }
  function ui() {
    if (!pp) return;
    pp.dataset.s = playing ? 'on' : 'off';
    if (document.activeElement !== scrub) scrub.value = String(Math.round(T / total * 1000));
    clock.textContent = (cur + 1) + ' / ' + S.length + ' · ' + fmt(T) + ' / ' + fmt(total);
  }
  pp.addEventListener('click', step);
  scrub.addEventListener('input', function () { playing = false; waiting = false; seek(scrub.value / 1000 * total); });
  document.getElementById('stage').addEventListener('click', step);
  document.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); step(); }
    else if (e.key === 'ArrowRight' || e.key === 'PageDown') { if (waiting) step(); else jump(1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') jump(-1);
  });

  window.__deck = { seek: seek, total: total, slides: S.map(function (s) {
    return { name: s.name, start: s.start, trd: s.trd, dur: s.dur, tail: s.tail };
  }), play: function () { playing = true; }, pause: function () { playing = false; } };

  if (q.get('capture') === '1') document.body.classList.add('capture');
  var t0 = parseFloat(q.get('t') || '0');
  if (q.get('slide')) { var k = Math.max(0, Math.min(S.length - 1, parseInt(q.get('slide'), 10) - 1)); t0 = S[k].start + S[k].trd; }
  seek(t0);
  playing = q.get('autoplay') !== '0' && q.get('capture') !== '1' && !q.get('t');
  requestAnimationFrame(tick);
})();
</script></body></html>
