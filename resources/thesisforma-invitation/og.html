<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>ThesisForma share card</title>
<style>
  /* 1200×630 share card; build.mjs saves it as public/thesisforma/og.png. */
  @font-face { font-family: "TF Serif"; src: url("../../public/thesisforma/fonts/tf-serif-400.woff2") format("woff2"); font-weight: 400; }
  @font-face { font-family: "TF Serif"; src: url("../../public/thesisforma/fonts/tf-serif-600.woff2") format("woff2"); font-weight: 600; }

  html, body { margin: 0; }

  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    width: 1200px;
    height: 630px;
    background: #fff;
    color: #1c1c1c;
    font-family: "TF Serif", serif;
  }

  h1 { margin: 0; font-weight: 400; font-size: 96px; line-height: 1; letter-spacing: -.01em; }

  p { margin: 34px 0 0; font-weight: 600; font-size: 30px; letter-spacing: .4em; text-indent: .4em; color: #333; }

  i { display: block; width: 48px; height: 1px; margin-top: 44px; background: #c4c4c4; }
</style>
</head>
<body>
  <h1>ThesisForma</h1>
  <p>测试与合作邀请</p>
  <i></i>
</body>
</html>
